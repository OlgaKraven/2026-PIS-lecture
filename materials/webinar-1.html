.slide-header,.slide-content,.slide-footer{position:relative;z-index:1}
.title-mascot{position:absolute;right:0;top:12%;width:34%;height:76%;object-fit:contain;z-index:2;border-radius:50%}
.kind-title .slide-content{padding-right:38%}.kind-title .slide-content:after{display:none}
.kind-title .slide-content h2{font-size:3.5cqw}.kind-title .slide-body{font-size:1.8cqw}
.section-label{font-size:1.1cqw;font-weight:850;color:var(--red);margin:0;letter-spacing:.04em}
.kind-agenda .slide-body{display:none}.kind-agenda .slide-visual{align-items:flex-start;padding-top:1cqw}
.agenda-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw 2.5cqw;width:100%;counter-reset:topics}
.agenda-list li{display:flex;align-items:baseline;gap:1.3cqw;border-top:1px solid #ceccc3;padding:1.3cqw 0;font-size:1.5cqw;font-weight:750}
.agenda-list b{color:var(--red);font-size:2cqw}
.kind-section .slide-content{justify-content:center;padding-right:33%;gap:1.5cqw}
.kind-section .slide-content h2{font-size:3.7cqw}.kind-section .slide-body{font-size:1.9cqw}
.kind-section .slide-visual{position:absolute;right:6%;top:12%;width:24%;height:76%;display:flex;justify-content:center;align-items:center}
.section-arrow{width:100%;height:100%;object-fit:contain;filter:brightness(0)}
.kind-questions .slide-visual{align-items:flex-start;padding-top:1.8cqw}
.question-list{font-size:2cqw;line-height:1.5;margin:0;padding-left:2cqw;display:grid;gap:1.8cqw;list-style:disc;width:100%}
.question-list li::marker{color:var(--red)}
.visual-pair{display:grid;grid-template-columns:repeat(var(--parts),minmax(0,1fr));gap:2cqw;width:100%;align-items:start}
.visual-pair>section{min-width:0}.visual-pair>section>h3{font-size:1.45cqw;margin:0 0 1.2cqw;line-height:1.2;color:var(--red-dark)}
.visual-pair .visual-process{grid-template-columns:1fr;gap:.5cqw}.visual-pair .process-item{border-top:0;border-left:2px solid var(--blue);padding:.2cqw .8cqw}
.visual-pair .process-number{display:none}.visual-pair .process-item b{font-size:1.3cqw;margin:0}.visual-pair .process-item p{font-size:1.15cqw;margin:.25cqw 0;line-height:1.3}
.visual-pair .visual-table{font-size:1.15cqw}.visual-pair .visual-table th,.visual-pair .visual-table td{padding:.5cqw .65cqw}
.visual-pair .visual-diagram{grid-template-columns:1fr;gap:.6cqw}.visual-pair .diagram-nodes{display:flex;flex-wrap:wrap;gap:.4cqw}.visual-pair .diagram-node{font-size:1.1cqw;padding:.5cqw}
.visual-pair .diagram-links{gap:.3cqw}.visual-pair .diagram-link,.visual-pair .diagram-link strong{font-size:1.1cqw;padding-bottom:.2cqw;margin:0}
.visual-pair .mockup{width:100%}.visual-pair .visual-code pre{font-size:1.2cqw}.visual-pair .visual-caption{font-size:1cqw}
@media print{html,body{color-scheme:light!important;background:#fff!important}.print-slide .active-slide{width:281mm;height:158.0625mm;aspect-ratio:16/9}.slide-header{font-size:1cqw}.slide-content h2{font-size:3.1cqw}.slide-body{font-size:1.7cqw}.slide-footer{font-size:.85cqw;min-height:0;padding:.6cqw 2cqw 1cqw 2.6cqw}.slide-frame{print-color-adjust:exact;-webkit-print-color-adjust:exact}.print-speech{color:#1c1c1c}.print-slide{break-inside:avoid}.print-speech{break-inside:auto}}
@media screen and (max-width:820px){.deck-topic{flex-basis:calc(100% - 7rem)}.deck-toolbar{min-width:0}.deck-topic strong{white-space:normal;overflow-wrap:anywhere}.toolbar-actions{justify-content:flex-start;gap:.3rem}.toolbar-actions .icon-button{width:2.35rem;height:2.35rem}.deck-shell{padding:.65rem;gap:.5rem}.deck-topic small{font-size:.68rem}}

/* Shared presentation and learning surfaces. */
:root{--red:#cb2823;--red-dark:#a31d19;--paper:#fff;--ink:#202022;--line:#dedee3;--tint:#fff1ef;--arrow:#eeeeef;--focus:#cb2823;--neutral:#f0f0f2}
:root[data-theme=dark]{--red:#ff716a;--red-dark:#ff8c86;--paper:#202023;--ink:#f4f4f5;--line:#43434a;--tint:#382523;--arrow:#39393e;--focus:#ff716a;--neutral:#303035;--surface:#202023;--text:#f4f4f5;--muted:#b6b6be;--border:#43434a}

window.PISDiagrams=(()=>{
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const table=(cols,rows,cls='',active=[])=>`<table class="learning-table ${cls}"><thead><tr>${cols.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${active.includes(i)?'is-focus':''}">${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 const wrap=(s,n=25)=>{const out=[];for(const word of String(s).split(' ')){if(!out.length||out.at(-1).length+word.length+1>n)out.push(word);else out[out.length-1]+=' '+word;}return out;};
 const text=(s,x,y,n=24)=>`<text x="${x}" y="${y}" text-anchor="middle">${wrap(s,n).map((line,i)=>`<tspan x="${x}" dy="${i?22:0}">${esc(line)}</tspan>`).join('')}</text>`;
 let serial=0;
 function graph(v,focus=[]){
  const uid='edge-'+(++serial),nodes=v.nodes,edges=v.edges.map(([a,b,l])=>[typeof a==='number'?a:nodes.indexOf(a),typeof b==='number'?b:nodes.indexOf(b),l]);

  const h=Math.max(145,edges.length*99+22);

 }
 function states(m,focus){const id='state-'+(++serial);return `<svg class="state-graph" viewBox="0 0 1000 300" role="img" aria-label="Состояния заявки: из pending в accepted или rejected"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs>${m.data.edges.map(([a,b,l],i)=>`<g class="${focus.includes('e'+i)?'is-focus':''}"><path d="M310 150H450V${i?240:60}H680" marker-end="url(#${id})"/>${text(l,490,i?222:40,35)}</g>`).join('')}${m.data.nodes.map((n,i)=>{const x=i?680:20,y=i===1?25:i===2?205:115;return `<g class="${focus.includes('n'+i)?'is-focus':''}"><rect x="${x}" y="${y}" width="290" height="70" rx="12"/>${text(n,x+145,y+41,30)}</g>`;}).join('')}</svg>`;}
 function sequenceMessages(m,scenario){
 const winner=scenario.label.endsWith('Б')?'Б':'А',loser=winner==='А'?'Б':'А';
 const sets={
 race:[['А','База','Проверка А: пары нет','both'],['Б','База','Проверка Б: пары нет','both'],[winner,'База','INSERT пары (12,17)','insert'],['База',winner,'COMMIT; заявка 104','commit'],['База',loser,'UNIQUE → 409','conflict']],
 transaction:scenario.label==='Сначала подача'?[['Подача','База','SELECT ... FOR UPDATE','lock'],['Подача','База','is_open=true → INSERT','insert'],['База','Закрытие','COMMIT подачи; затем закрытие','commit']]:[['Закрытие','База','is_open=false; COMMIT','close'],['Подача','База','Блокировка; is_open=false','lock'],['База','Подача','409 PROJECT_CLOSED','reject']],

 'lost-response':scenario.label==='Обрыв после COMMIT'?[['Браузер','Сервер','POST /api/applications','post'],['Сервер','База','INSERT; COMMIT 104','save'],['Сервер','Браузер','Ответ потерян ×','lost'],['Браузер','Сервер','GET → заявка 104','read']]:[['Браузер','Сервер','POST не доставлен ×','lost'],['Браузер','Сервер','Позднее: GET → []','read']],
 notification:scenario.label==='Канал подтвердил'?[['Приложение','База','INSERT; COMMIT 104','save'],['Приложение','Внешний канал','Уведомление: событие 104','send'],['Внешний канал','Приложение','Оговорённое подтверждение','ack']]:[['Приложение','База','INSERT; COMMIT 104','save'],['Приложение','Внешний канал','Отправка → таймаут','timeout'],['Приложение','Внешний канал','Уточнить исход; управляемый повтор','retry']]
 };return sets[m.id]||[];
 }
 function sequence(m,s,focus){

 }
 function joinData(m,sc){const student=sc===1?99:12;const joined=m.data.applications.flatMap(a=>m.data.projects.filter(p=>p[0]===a[2]).map(p=>[a[0],a[1],p[1],a[3]]));return {joined,result:joined.filter(r=>r[1]===student).sort((a,b)=>a[0]-b[0]).map(r=>[r[0],r[2],r[3]])};}
 function ranking(m,sc){const tags=sc===1?['робототехника']:['интерфейсы','клуб'];return m.data.projects.map(p=>({...p,score:p.tags.filter(t=>tags.includes(t)).length})).sort((a,b)=>b.score-a.score||a.id-b.id);}

 const s=m.scenarios[sc],f=s.frames[index],focus=complete?s.frames.flatMap(x=>x.focus):f.focus;

 return `<section class="learning" data-learning="${esc(m.id)}" aria-label="${esc(m.title)}">${!overview?`<p class="learning-input">${esc(s.input)}</p>`:''}<div class="learning-scene">${scene(m,scenario,index,staticMode)}</div>${staticMode?`<div class="learning-static-steps">${s.frames.slice(1).map(x=>`<p>${esc(x.caption)}</p>`).join('')}</div><p class="learning-result">${esc(s.frames.at(-1).result)}</p>`:overview?'':`<p class="learning-caption" role="status" aria-live="polite">${esc(f.caption)}${f.result?`<strong>${esc(f.result)}</strong>`:''}</p>`}${m.data.note?`<p class="learning-note">${esc(m.data.note)}</p>`:''}</section>`;

 function bind(container,m,change){

  container.querySelector('[data-reset]').onclick=()=>jump(0);
  container.querySelector('[data-play]')?.addEventListener('click',()=>{if(running){pause();return;}if(matchMedia('(prefers-reduced-motion: reduce)').matches){jump(index===s.frames.length-1?0:index+1);return;}if(index===s.frames.length-1){index=0;remaining=1800;}running=true;draw();schedule();notify();});
  if(focusKey){const target=container.querySelector('[data-'+focusKey+']');if(target&&!target.disabled)target.focus({preventScroll:true});}

 };
 const schedule=()=>{clear();deadline=performance.now()+remaining;timer=setTimeout(()=>{if(disposed||!running)return;index=Math.min(index+1,m.scenarios[sc].frames.length-1);remaining=1800;if(index===m.scenarios[sc].frames.length-1)running=false;draw();notify();if(running)schedule();},remaining);};

 }
 return {graph,render,scene,bind,joinData,ranking,sequenceMessages};
})();

window.PISPractice=(()=>{

 function revealQuiz(root,q,visible=true){if(!q)return;const el=root.querySelector('.quiz-solution');if(!el)return;el.hidden=!visible;el.innerHTML=visible?`<strong>Ответ: ${esc(q.options[q.answer])}</strong><p>${esc(q.explanation)}</p>`:'';const button=root.querySelector('[data-reveal-answer]');if(button){button.textContent=visible?'Скрыть ответ':'Показать ответ';button.setAttribute('aria-expanded',String(visible));}}

 function passport(s,l){const a=s.activity;return `<section class="practice-passport"><div><h3>Задача</h3><p>${esc(a.task)}</p></div><div><h3>Что проверить</h3><p>${esc(a.check)}</p></div><p class="practice-case">Новый учебный случай · ${a.facts.length} наблюдения · прогноз и обоснование</p><a class="button primary" href="?webinar=${l.number}&slide=${s.number}&mode=activity" data-activity="${esc(s.id)}" target="_blank" rel="noopener">Интерактивная схема ↗</a><a class="practice-print-link" href="https://olgakraven.github.io/2026-PIS-lecture/?webinar=${l.number}&amp;slide=${s.number}&amp;mode=activity">${esc('https://olgakraven.github.io/2026-PIS-lecture/?webinar='+l.number+'&slide='+s.number+'&mode=activity')}</a></section>`;}

 function bindActivity(root,a){
  if(!a)return;const draft=read(a,'activity');let step=Math.max(0,Math.min(draft.step||0,a.facts.length));

атель принимает решение. Мы последовательно получим требования и границы первой версии.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Проблема». Что мешает студенту и преподавателю. Второй блок обозначен «Решения». Какие действия и правила поддерживает система. Третий блок обозначен «Результат». Паспорт проекта, требования, границы версии.\n\nВсе примеры заранее подготовлены. Основные решения будем разбирать на схемах и таблицах. В конце станет понятно, какие сведения необходимо согласовать до создания экранов и программы.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Проблема: Что мешает студенту и преподавателю. 2. Решения: Какие действия и правила поддерживает система. 3. Результат: Паспорт проекта, требования, границы версии.","wordCount":96,"pauseSeconds":0,"estimatedSeconds":52,"requiredWpm":109,"links":"webinar-1, Информационный ресурс; учебные правила проекта"},{"id":"З1-В01","title":"Цель и результаты занятия","body":"Паспорт проекта, схема процесса, требования и границы первой версии","visual":{"type":"process","items":[{"title":"1","text":"Отделить наблюдаемую проблему от требования и критерия приёмки."},{"title":"2","text":"Прочитать контекст, процесс и разрешённые переходы заявки."},{"title":"3","text":"Обосновать состав первой версии и распределение ответственности."}]},"speech":"Цель занятия — паспорт проекта, схема процесса, требования и границы первой версии. В результате мы сможем выполнить три действия. Отделить наблюдаемую проблему от требования и критерия приёмки. Прочитать контекст, процесс и разрешённые переходы заявки. Обосновать состав первой версии и распределение ответственности. Все объяснения опираются на один учебный сервис. Это подготовленный разбор, поэтому для его понимания не потребуется программировать в эфире.","script":"Цель занятия — паспорт проекта, схема процесса, требования и границы первой версии. В результате мы сможем выполнить три действия. Отделить наблюдаемую проблему от требования и критерия приёмки. Прочитать контекст, процесс и разрешённые переходы заявки. Обосновать состав первой версии и распределение ответственности. Все объяснения опираются на один учебный сервис. Это подготовленный разбор, поэтому для его понимания не потребуется программировать в эфире.","explanation":"","hint":"Прочитайте предметный вывод; не ожидайте ответа аудитории.","sources":[],"visualDescription":"1: Отделить наблюдаемую проблему от требования и критерия приёмки. 2: Прочитать контекст, процесс и разрешённые переходы заявки. 3: Обосновать состав первой версии и распределение ответственности.","kind":"outcomes","question":null,"blockTitle":"Информационный ресурс","blockIndex":0,"wordCount":59,"pauseSeconds":5,"estimatedSeconds":37,"notebook":"","links":"Введение и итоги занятия","number":2,"plannedSeconds":38,"startSeconds":53,"requiredWpm":107},{"title":"Вопросы темы","body":"Маршрут занятия","visual":{"type":"agenda","items":[{"number":1,"title":"Информационный ресурс","start":7,"minutes":8},{"number":2,"title":"Исходная проблема","start":12,"minutes":14},{"number":3,"title":"Границы и процессы","start":21,"minutes":16},{"number":4,"title":"Требования и приёмка","start":31,"minutes":18},{"number":5,"title":"Сценарии, права и состояния","start":41,"minutes":16},{"number":6,"title":"Жизненный цикл","start":51,"minutes":16},{"number":7,"title":"Первая версия и архитектура","start":61,"minutes":20},{"number":8,"title":"Разбор изменения","start":73,"minutes":12}]},"speech":"Перед нами маршрут занятия. Вопрос 1: информационный ресурс. Вопрос 2: исходная проблема. Вопрос 3: границы и процессы. Вопрос 4: требования и приёмка. Вопрос 5: сценарии, права и состояния. Вопрос 6: жизненный цикл. Вопрос 7: первая версия и архитектура. Вопрос 8: разбор изменения.\n\nОбщий результат: паспорт проекта, схема процесса, требования и границы первой версии. Сначала обозначим связи между вопросами, затем последовательно разберём подготовленные решения. Каждый раздел продолжает один учебный пример, поэтому номера пользователей, проекта и заявки сохраняются.\n\nВ рамках нашего курса информационным ресурсом будем называть организованную информацию и способы работы с ней, которые помогают пользователю решить задачу. Файлы с описаниями проектов тоже содержат информацию. Но пользователю важно быстро найти нужное описание, понять условия и получить достоверный результат своего обращения. Поэтому проектирование включает структуру содержания, доступ, поиск и обновление. Название ресурса само по себе ещё не объясняет, кому он нужен. Для каждого примера на экране мы связываем сведения с конкретным действием человека.","explanation":"Если каталог содержит старые темы без отметки о завершении набора, информация может быть формально доступна, но вводить студента в заблуждение. Значит, актуальность входит в проектную задачу вместе с составом данных. Мы рассматриваем ресурс через пользу и наблюдаемое поведение, а затем выбираем техническую реализацию.","hint":"Прочитайте маршрут в порядке номеров. Каждый вопрос — раздел объяснения преподавателя. Ответов аудитории не ожидаем.","sources":[],"kind":"agenda","question":null,"id":"З1-С02","number":3,"blockTitle":"Информационный ресурс","blockIndex":0,"plannedSeconds":122,"startSeconds":91,"transition":"Следующий вопрос — информационный ресурс. Способ организации зависит от задачи пользователя.","script":"Перед нами маршрут занятия. Вопрос 1: информационный ресурс. Вопрос 2: исходная проблема. Вопрос 3: границы и процессы. Вопрос 4: требования и приёмка. Вопрос 5: сценарии, права и состояния. Вопрос 6: жизненный цикл. Вопрос 7: первая версия и архитектура. Вопрос 8: разбор изменения.\n\nОбщий результат: паспорт проекта, схема процесса, требования и границы первой версии. Сначала обозначим связи между вопросами, затем последовательно разберём подготовленные решения. Каждый раздел продолжает один учебный пример, поэтому номера пользователей, проекта и заявки сохраняются.\n\nВ рамках нашего курса информационным ресур ольшая серая стрелка, направленная влево.","wordCount":34,"pauseSeconds":8,"estimatedSeconds":27,"requiredWpm":102,"links":"webinar-1, Информационный ресурс; учебные правила проекта"},{"title":"Особенности веб-приложения","body":"Действие в браузере меняет общее состояние системы","visual":{"type":"pair","items":[{"title":"Типы информационных ресурсов","visual":{"type":"process","items":[{"title":"Справочник","text":"Человек получает устойчивые сведения по известному вопросу"},{"title":"Каталог","text":"Человек сравнивает несколько объектов и выбирает подходящий"},{"title":"Сервис","text":"Человек передаёт данные и получает результат обработки"}]}},{"title":"Особенности веб-приложения","visual":{"type":"diagram","nodes":["Браузер студента","Обработка на сервере","Общие данные"],"edges":[["Браузер студента","Обработка на сервере","Действие пользователя"],["Обработка на сервере","Общие данные","Сохранение"],["Обработка на сервере","Браузер студента","Результат"]],"caption":""}}]},"speech":"Разные ресурсы требуют разных проектных решений. На странице с правилами участия достаточно дать понятное содержание и дату обновления. В каталоге проектов понадобятся отдельные карточки, чтобы сравнивать темы. В сервисе подачи заявок появляется изменение данных: система должна принять обращение и сохранить его. Один продукт может объединять эти способы работы. «Проектный навигатор» содержит каталог, но его назначение шире просмотра информации. После выбора проекта студент выполняет действие, результат которого должен увидеть преподаватель.\n\nЭто различие помогает оценить объём работы. Публикация текста и приём заявок имеют разные требования к правам, подтверждению и хранению. Мы не будем выбирать сложную платформу только потому, что ресурс назван сервисом. Сначала установим, какие действия действительно требуются первой версии.\n\nВеб-приложением будем называть программу, с которой человек работает через браузер. Браузер показывает интерфейс и передаёт действия пользователя. Сервер принимает обращения и выполняет правила. Общие данные сохраняются так, чтобы результат не зависел от того, оставил ли студент страницу открытой. Пока это только обзор устройства: подробный обмен запросами разберём на третьем занятии. Здесь важно увидеть, почему изменение надписи на экране ещё не означает, что система приняла заявку.","explanation":"Представим, что после нажатия кнопки появилась зелёная плашка, а преподаватель ничего не получил. Пользовательское действие выглядело завершённым, но задача осталась нерешённой. Поэтому проектировщик описывает не только экран. Он определяет, какие данные должны сохраниться и кто получит к ним доступ.\n\nУ этой схемы есть важное следствие для проектного обсуждения. Если Анна закрыла браузер после отправки, это не должно отменить уже выполненную сервером операцию. Если она просто напечатала текст и ничего не отправила, общая система о нём ещё не знает. Два внешне похожих действия — закрытие страницы до и после сохранения — имеют разные результаты. Поэтому нам понадобится явный момент, после которого можно говорить о принятой заявке. Мы пока не выбираем конкретный способ хранения черновика. Такое пожелание потребовало бы отдельного правила и не входит в согласованный состав.","hint":"Показывайте различие по действию, а не по внешнему виду страниц. Начните с браузера, затем пройдите по подписанным связям. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"notebook":"Веб-приложение — приложение, доступное через браузер и взаимодействующее с сервером по сети.","learning":{"id":"explain-1-4","catalog":"Свободная схема","title":"Особенности веб-приложения","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Типы информационных ресурсов","visual":{"type":"process","items":[{"title":"Справочник","text":"Человек получает устойчивые сведения по известному вопросу"},{"title":"Каталог","tex ринять обращение и сохранить его. Один продукт может объединять эти способы работы. «Проектный навигатор» содержит каталог, но его назначение шире просмотра информации. После выбора проекта студент выполняет действие, результат которого должен увидеть преподаватель.\n\nЭто различие помогает оценить объём работы. Публикация текста и приём заявок имеют разные требования к правам, подтверждению и хранению. Мы не будем выбирать сложную платформу только потому, что ресурс назван сервисом. Сначала установим, какие действия действительно требуются первой версии.\n\nВеб-приложением будем называть программу, с которой человек работает через браузер. Браузер показывает интерфейс и передаёт действия пользователя. Сервер принимает обращения и выполняет правила. Общие данные сохраняются так, чтобы результат не зависел от того, оставил ли студент страницу открытой. Пока это только обзор устройства: подробный обмен запросами разберём на третьем занятии. Здесь важно увидеть, почему изменение надписи на экране ещё не означает, что система приняла заявку.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Справочник». Человек получает устойчивые сведения по известному вопросу. Второй блок обозначен «Каталог». Человек сравнивает несколько объектов и выбирает подходящий. Третий блок обозначен «Сервис». Человек передаёт данные и получает результат обработки.\n\nРассмотрим подписанные связи схемы. Связь между блоками «Браузер студента» и «Обработка на сервере» обозначает следующее: действие пользователя. Связь между блоками «Обработка на сервере» и «Общие данные» обозначает следующее: сохранение. Связь между блоками «Обработка на сервере» и «Браузер студента» обозначает следующее: результат.\n\nПредставим, что после нажатия кнопки появилась зелёная плашка, а преподаватель ничего не получил. Пользовательское действие выглядело завершённым, но задача осталась нерешённой. Поэтому проектировщик описывает не только экран. Он определяет, какие данные должны сохраниться и кто получит к ним доступ.\n\nУ этой схемы есть важное следствие для проектного обсуждения. Если Анна закрыла браузер после отправки, это не должно отменить уже выполненную сервером операцию. Если она просто напечатала текст и ничего не отправила, общая система о нём ещё не знает. Два внешне похожих действия — закрытие страницы до и после сохранения — имеют разные результаты. Поэтому нам понадобится явный момент, после которого можно говорить о принятой заявке. Мы пока не выбираем конкретный способ хранения черновика. Такое пожелание потребовало бы отдельного правила и не входит в согласованный состав.\n\n","visualDescription":"Типы информационных ресурсов. Последовательность подписанных блоков. 1. Справочник: Человек получает устойчивые сведения по известному вопросу. 2. Каталог: Человек сравнивает несколько объектов и выбирает подходящий. 3. Сервис: Человек передаёт данные и получает результат обработки.\n\nОсобенности веб-приложения. Схема. Блоки: Браузер студента; Обработка на сервере; Общие данные. Связи: Браузер студента — Обработка на сервере: Действие пользователя; Обработка на сервере — Общие данные: Сохранение; Обработка на сервере — Браузер студента: Результат.","wordCount":374,"pauseSeconds":22,"estimatedSeconds":226,"requiredWpm":107,"links":"webinar-1, Информационный ресурс; учебные правила проекта"},{"title":"Учебный сервис «Проектный навигатор»","body":"Один пример проходит через все четыре лекции","visual":{"type":"table","columns":["Участник","Учебные данные","Цель"],"rows":[["Студент","Анна Смирнова, id 12","Подать заявку"],["Преподаватель","Ирина Павлова, id 7","Принять решение"],["Проект","Сайт студенческого клуба, id 17","Набрать участников"]],"caption":""},"speech":"Во всех занятиях будем использовать одинаковые учебные сведения. Анна Смирнова выбирает проект «Сайт студенческого клуба». За проект отвечает Ирина Павлова. Числа двенадцать, семь и семнадцать служат идентификаторами, то есть обозначают конкретные записи. Они не задают порядок участия и не lannedSeconds":0,"startSeconds":665,"requiredWpm":0},{"title":"Исходная проблема","body":"Заявки распределены между сообщениями и таблицами","visual":{"type":"section","number":2,"title":"Исходная проблема"},"speech":"Переходим к вопросу 2: исходная проблема. Заявки распределены между сообщениями и таблицами. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":2,"id":"З1-С06","number":12,"blockTitle":"Исходная проблема","blockIndex":1,"plannedSeconds":28,"startSeconds":665,"transition":"","script":"Переходим к вопросу 2: исходная проблема. Заявки распределены между сообщениями и таблицами. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 2: Исходная проблема. Справа большая серая стрелка, направленная влево.","wordCount":34,"pauseSeconds":8,"estimatedSeconds":27,"requiredWpm":102,"links":"webinar-1, Исходная проблема; учебные правила проекта"},{"title":"Сбор заявок через сообщения","body":"Отправитель и получатель по-разному понимают завершение действия","visual":{"type":"pair","items":[{"title":"Исходная проблема","visual":{"type":"table","columns":["Источник","Запись","Сложность"],"rows":[["Сообщение Анны","Хочу участвовать в клубном сайте","Нет общего номера"],["Личная таблица","Анна, клубный сайт","Неясно, внесена ли заявка"],["Сообщение преподавателя","Пришлите сведения повторно","Возникает второй экземпляр"]],"caption":""}},{"title":"Сбор заявок через сообщения","visual":{"type":"process","items":[{"title":"Анна отправила текст","text":"Для неё обращение уже передано"},{"title":"Ирина прочитала сообщение","text":"Для неё сведения ещё предстоит перенести"},{"title":"Запись попала в таблицу","text":"Только теперь появляется общий рабочий список"}]}}]},"speech":"Начнём с ситуации до автоматизации. Анна пишет преподавателю в сообщениях. Преподаватель переносит сведения в личную таблицу, а позже получает уточнение ещё в одном диалоге. На каждом шаге люди знают только часть истории. Чтобы ответить, принята ли заявка, приходится сопоставлять переписку и таблицу. Такие затруднения не означают, что участники невнимательны. Сам процесс требует ручного переноса и не даёт единого места для проверки результата.\n\nНа экране показана условная ситуация, а не исследование конкретной организации. Из неё мы выделяем наблюдаемые трудности. Пока рано писать требование «сделать удобный сайт»: оно пропускает причину затруднений. Сначала определим, в каком месте информация расходится и какое действие пользователь хочет подтвердить.\n\nВ сообщениях нет единого момента, который оба участника считают регистрацией заявки. Анна видит, что текст отправлен. Ирина может прочитать его между занятиями и запланировать перенос на вечер. Если студент спрашивает о результате раньше, ответы будут противоречивыми. Проблема состоит в различии между передачей сообщения и появлением учтённого обращения. При проектировании нам понадобится явный признак: заявка сохранена и доступна в соответствующем списке.","explanation":"Прочтение сообщения не следует превращать в отдельный статус заявки нашего сервиса. Это событие исходного процесса. В будущей модели зафиксируем только те состояния, которые нужны для рассмотрения: начальное ожидание и два результата решения. Тем самым мы улучшаем учёт, не воспроизводя каждую особенность переписки.\n\nПроследим один конкретный разрыв ответственности. В понедельник Анна отправила сообщение, во вторник уточнила название проекта, а преподаватель перенёс первую версию текста. Теперь в таблице устаревшее описание намерения. Наличие сообщения и наличие строки ещё не гарантирует их согласованность. Чтобы разобраться, приходится восстанавливать порядок и выбирать достоверный источник. Проектирование будущего ресурса начинается с устранения этой неопределённости. Мы определим, какие значения составляют одну заявку и какое действие считается её подачей. При этом не обязаны переносить в модель все детали личной переписки. История диалога и история рассмотрения имеют разное назначение.\n\nЕсли просто предоставить студенту доступ к общей таблице, часть проблемы останется. Он сможет увидеть строку, но не будет знать, разрешено ли её менять и кто принимает решение. Также возникнет вопрос чужих мотиваций. Поэтому новое средство нужно оценивать по всему процессу: регистрация, доступ и результат должны быть согласованы вместе. На следующих слайдах эти наблюдения станут основанием конкретных правил, а не готовым выбором инструмента.","hint":"Разберите каждую строку как отдельное свидетельство проблемы. Различайте исходный процесс и правила будущей системы. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-7","catalog":"Свободная схема","title":"Сбор заявок через сообщения","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Исходная проблема","visual":{"type":"table","columns":["Источник","Запись","Сложность"],"rows":[["Сообщение Анны","Хочу участвовать в клубном сайте","Нет общего номера"],["Личная таблица","Анна, клубный сайт","Неясно, внесена ли заявка"],["Сообщение преподавателя","Пришлите сведения повторно","Возникает второй экземпляр"]],"caption":""}},{"title":"Сбор заявок через сообщения","visual":{"type":"process","items":[{"title":"Анна отправила текст","text":"Для неё обращение уже передано"},{"title":"Ирина прочитала сообщение","text":"Для неё сведения ещё предстоит перенести"},{"title":"Запись попала в таблицу","text":"Только теперь появляется общий рабочий список блема состоит в различии между передачей сообщения и появлением учтённого обращения. При проектировании нам понадобится явный признак: заявка сохранена и доступна в соответствующем списке.\n\nСопоставим записи в таблице. В строке 1 источник: Сообщение Анны. запись: Хочу участвовать в клубном сайте. сложность: Нет общего номера. В строке 2 источник: Личная таблица. запись: Анна, клубный сайт. сложность: Неясно, внесена ли заявка. В строке 3 источник: Сообщение преподавателя. запись: Пришлите сведения повторно. сложность: Возникает второй экземпляр.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Анна отправила текст». Для неё обращение уже передано. Второй блок обозначен «Ирина прочитала сообщение». Для неё сведения ещё предстоит перенести. Третий блок обозначен «Запись попала в таблицу». Только теперь появляется общий рабочий список.\n\nПрочтение сообщения не следует превращать в отдельный статус заявки нашего сервиса. Это событие исходного процесса. В будущей модели зафиксируем только те состояния, которые нужны для рассмотрения: начальное ожидание и два результата решения. Тем самым мы улучшаем учёт, не воспроизводя каждую особенность переписки.\n\nПроследим один конкретный разрыв ответственности. В понедельник Анна отправила сообщение, во вторник уточнила название проекта, а преподаватель перенёс первую версию текста. Теперь в таблице устаревшее описание намерения. Наличие сообщения и наличие строки ещё не гарантирует их согласованность. Чтобы разобраться, приходится восстанавливать порядок и выбирать достоверный источник. Проектирование будущего ресурса начинается с устранения этой неопределённости. Мы определим, какие значения составляют одну заявку и какое действие считается её подачей. При этом не обязаны переносить в модель все детали личной переписки. История диалога и история рассмотрения имеют разное назначение.\n\nЕсли просто предоставить студенту доступ к общей таблице, часть проблемы останется. Он сможет увидеть строку, но не будет знать, разрешено ли её менять и кто принимает решение. Также возникнет вопрос чужих мотиваций. Поэтому новое средство нужно оценивать по всему процессу: регистрация, доступ и результат должны быть согласованы вместе. На следующих слайдах эти наблюдения станут основанием конкретных правил, а не готовым выбором инструмента.\n\n","visualDescription":"Исходная проблема. Таблица. Столбцы: Источник; Запись; Сложность. Строка 1: Сообщение Анны; Хочу участвовать в клубном сайте; Нет общего номера. Строка 2: Личная таблица; Анна, клубный сайт; Неясно, внесена ли заявка. Строка 3: Сообщение преподавателя; Пришлите сведения повторно; Возникает второй экземпляр.\n\nСбор заявок через сообщения. Последовательность подписанных блоков. 1. Анна отправила текст: Для неё обращение уже передано. 2. Ирина прочитала сообщение: Для неё сведения ещё предстоит перенести. 3. Запись попала в таблицу: Только теперь появляется общий рабочий список.","wordCount":441,"pauseSeconds":16,"estimatedSeconds":257,"requiredWpm":107,"links":"webinar-1, Исходная проблема; учебные правила проекта"},{"title":"Потерянное обращение","body":"Отправленное сообщение отсутствует в общем списке","visual":{"type":"process","items":[{"title":"Наблюдение","text":"Анна отправила сведения, но в таблице её строки нет"},{"title":"Последствие","text":"Преподаватель не учитывает обращение при рассмотрении"},{"title":"Потребность","text":"Участники должны видеть подтверждённую регистрацию"}]},"speech":"Слово «потерялась» слишком общее для разработки. Уточним наблюдение: сообщение существует, но в рабочем списке заявки нет. Оно могло остаться в другом диалоге или не попасть в таблицу при переносе. Причины отличаются, однако неудобство для пользователя одинаково: нет подтверждения, что обращение принято к рассмотрению. На этой основе позже сформулируем требование к сохранению и отображению. Пока фиксируем проблему без догадки о том, какой именно программный модуль нужно написать.","explanation":"Такое уточнение делает обсуждение предметным. Можно предъявить отправленное сообщение и отсутствие строки. Фразу «пользователям некомфортно» проверить гораздо сложнее. Мы постепенно переводим переживание человека в наблюдаемую ситуацию, сохраняя его исходную потребность.","hint":"Прочитайте формулировку наблюдения целиком. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-8","catalog":"Свободная схема","title":"Потерянное обращение","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Наблюдение","text":"Анна отправила сведения, но в таблице её строки нет"},{"title":"Последствие","text":"Преподаватель не учитывает обращение при рассмотрении"},{"title":"Потребность","text":"Участники должны видеть подтверждённую регистрацию"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Отправленное сообщение отсутствует в общем списке","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Наблюдение: Анна отправила сведения, но в таблице её строки нет","focus":["p0"],"result":""},{"caption":"Последствие: Преподаватель не учитывает обращение при рассмотрении","focus":["p1"],"result":""},{"caption":"Потребность: Участники должны видеть подтверждённую регистрацию","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Отправленное сообщение отсутствует в общем списке"}]}],"structural":true},"question":2,"id":"З1-С08","number":14,"blockTitle":"Исходная проблема","blockIndex":1,"plannedSeconds":82,"startSeconds":956,"transition":"","script":"Слово «потерялась» слишком общее для разработки. Уточним наблюдение: сообщение существует, но в рабочем списке заявки нет. Оно могло остаться в другом диалоге или не попасть в таблицу при переносе. Причины отличаются, однако неудобство для пользователя одинаково: нет подтверждения, что обращение принято к рассмотрению. На этой основе позже сформулируем требование к сохранению и отображению. Пока фиксируем проблему без догадки о том, какой именно программный модуль нужно написать.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Наблюдение». Анна отправила сведения, но в таблице её строки нет. Второй блок обозначен «Последствие». Преподаватель не учитывает обращение при рассмотрении. Третий блок обозначен «Потребность». Участники должны видеть подтверждённую регистрацию.\n\nТакое уточнение делает обсуждение предметным. Можно предъявить отправленное сообщение и отсутствие строки. Фразу «пользователям некомфортно» проверить гораздо сложнее. Мы постепенно переводим переживание человека в наблюдаемую ситуацию, сохраняя его исходную потребность.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Наблюдение: Анна отправила сведения, но в таблице её строки нет. 2. Последствие: Преподаватель не учитывает обращение при рассмотрении. 3. Потребность: Участники должны видеть подтверждённую регистрацию.","wordCount":132,"pauseSeconds":8,"estimatedSeconds":80,"requiredWpm":107,"links":"webinar-1, Исходная проблема; учебные правила проекта"},{"title":"Повторные заявки","body":"Один студент и один проект оказываются в списке несколько раз","visual":{"type":"table","columns":["Студент","Проект","Основание записи"],"rows":[["Анна Смирнова","Сайт студенческого клуба","Первое сообщение"],["Анна Смирнова","Сайт студенческого клуба","Повтор после отсутствия ответа"],["Анна Смирнова","Другой проект","Самостоятельная допустимая заявка"]],"caption":""},"speech":"Повтор возникает не только из-за случайного двойного нажатия. В исходном процессе студент не получил подтверждение и отправил сведения снова. Если преподаватель перенесёт оба сообщения, число заявок увеличится без появления второго участника. Но совпадение имени само по себе недостаточно для запрета. Один студент может интересоваться разными проектами. Поэтому наше правило относится к сочетанию студента и проекта. На другой проект Анна вправе подать отдельную заявку.","explanation":"Обратите внимание на третью строку. Она выглядит похожей, но не является дубликатом. В проектировании ограничение должно точно описывать запрещённую ситуацию. Слишком широкий запрет закроет допустимое действие, слишком узкий оставит повторы. Позже свяжем это правило с двумя идентификаторами в данных.","hint":"Сопоставьте первую и вторую строки, затем отдельно третью.","sources":[],"question":2,"id":"З1-С09","number":15,"blockTitle":"Исходная проблема","blockIndex":1,"plannedSeconds":92,"startSeconds":1038,"transition":"","script":"Повтор возникает не только из-за случайного двойного нажатия. В исходном процессе студент не получил подтверждение и отправил сведения снова. Если преподаватель перенесёт оба сообщения, число заявок увеличится без появления второго участника. Но совпадение имени само по себе недостаточно для запрета. Один студент может интересоваться разными проектами. Поэтому наше правило относится к сочетанию студента и проекта. На другой проект Анна вправе подать отдельную заявку.\n\nСопоставим записи в таблице. В строке 1 студент: Анна Смирнова. проект: Сайт студенческого клуба. основание записи: Первое сообщение. В строке 2 студент: Анна Смирнова. проект: Сайт студенческого клуба. основание записи: Повтор после отсутствия ответа. В строке 3 студент: Анна Смирнова. проект: Другой проект. основание записи: Самостоятельная допустимая заявка.\n\nОбратите внимание на третью строку. Она выглядит похожей, но не является дубликатом. В проектировании ограничение должно точно описывать запрещённую ситуацию. Слишком широкий запрет закроет допустимое действие, слишком узкий оставит повторы. Позже свяжем это правило с двумя идентификаторами в данных.\n\n","visualDescription":"Таблица. Столбцы: Студент; Проект; Основание записи. Строка 1: Анна Смирнова; Сайт студенческого клуба; Первое сообщение. Строка 2: Анна Смирнова; Сайт студенческого клуба; Повтор после отсутствия ответа. Строка 3: Анна Смирнова; Другой проект; Самостоятельная допустимая заявка.","wordCount":150,"pauseSeconds":8,"estimatedSeconds":90,"requiredWpm":107,"links":"webinar-1, Исходная проблема; учебные правила проекта"},{"title":"Неясный статус","body":"Участник не может отличить ожидание от принятого решения","visual":{"type":"table","columns":["Фраза в переписке","Возможное понимание","Что нужно уточнить"],"rows":[["Посмотрим позже","Заявку ещё не рассматривали","Есть ли зарегистрированная заявка"],["Вы подходите","Участие одобрено","Принято ли окончательное решение"],["Набор завершён","Отказ всем или закрытие новых заявок","Что произошло с уже поданными"]],"caption":""},"speech":"Свободные сообщения удобны для разговора, но плохо заменяют согласованные состояния. Студент может принять предварительный комментарий за окончательное одобрение. Закрытие набора может означать запрет новых обращений, а не автоматический отказ всем участникам. Нам нужен общий словарь состояния заявки. В первой версии это «На рассмотрении», «Одобрена» и «Отклонена». Состояние проекта «закрыт» относится к приёму новых заявок и хранится отдельно.","explanation":"Разделение двух объектов предотвращает скрытую ошибку. Когда проект закрыли, уже сохранённая заявка не исчезает и не обязана менять решение. Такие последствия должны вытекать из явно согласованного правила. В нашем учебном варианте закрытие только останавливает новые подачи.","hint":"Не добавляйте «Закрыта» к статусам заявки.","sources":[],"question":2,"id":"З1-С10","number":16,"blockTitle":"Исходная проблема","blockIndex":1,"plannedSeconds":98,"startSeconds":1130,"transition":"","script":"Свободные сообщения удобны для разговора, но плохо заменяют согласованные состояния. Студент может принять предварительный комментарий за окончательное одобрение. Закрытие набора может означать запрет новых обращений, а не автоматический отказ всем участникам. Нам нужен общий словарь состояния заявки. В первой версии это «На рассмотрении», «Одобрена» и «Отклонена». Состояние проекта «закрыт» относится к приёму новых заявок и хранится отдельно.\n\nСопоставим записи в таблице. В строке 1 фраза в переписке: Посмотрим позже. возможное понимание: Заявку ещё не рассматривали. что нужно уточнить: Есть ли зарегистрированная заявка. В строке 2 фраза в переписке: Вы подходите. возможное понимание: Участие одобрено. что нужно уточнить: Принято ли окончательное решение. В строке 3 фраза в переписке: Набор завершён. возможное понимание: Отказ всем или закрытие новых заявок. что нужно уточнить: Что произошло с уже поданными.\n\nРазделение двух объектов предотвращает скрытую ошибку. Когда проект закрыли, уже сохранённая заявка не исчезает и не обязана менять решение. Такие последствия должны вытекать из явно согласованного правила. В нашем учебном варианте закрытие только останавливает новые подачи.\n\n","visualDescription":"Таблица. Столбцы: Фраза в переписке; Возможное понимание; Что нужно уточнить. Строка 1: Посмотрим позже; Заявку ещё не рассматривали; Есть ли зарегистрированная заявка. Строка 2: Вы подходите; Участие одобрено; Принято ли окончательное решение. Строка 3: Набор завершён; Отказ всем или закрытие новых заявок; Что произошло с уже поданными.","wordCount":161,"pauseSeconds":8,"estimatedSeconds":96,"requiredWpm":107,"links":"webinar-1, Исходная проблема; учебные правила проекта"},{"title":"Причины затруднений","body":"Ручной перенос и отсутствие общего подтверждения создают расхождения","visual":{"type":"process","items":[{"title":"Разрозненные источники","text":"Часть сведений хранится в сообщениях, часть в таблицах"},{"title":"Ручная регистрация","text":"Отправка и учёт происходят в разное время"},{"title":"Неопределённые правила","text":"Нет общего понимания повторов и решений"}]},"speech":"Теперь можем связать наблюдения с устройством процесса. Потери возникают там, где человеку нужно перенести сведения. Повторы усиливаются из-за отсутствия подтверждения. Неясные статусы поддерживает свободная формулировка результата. Для каждой причины потребуется своё проектное решение. Единое хранилище не исправит неопределённые правила решения преподавателя. Красивый экран не заменит подтверждение сохранения. Анализ нужен, чтобы не пытаться исправить всё одной внешней переменой.","explanation":"Мы не доказываем, что любой ручной процесс плох. Для маленькой разовой группы таблица может быть достаточной. В этом учебном случае нужны согласованный учёт и доступ участников к своему результату. Именно эти потребности оправдывают создание сервиса и задают его границы.\n\nСопоставим две похожие причины повтора. В первом случае преподаватель случайно дважды переносит одно сообщение. Во втором Анна действительно отправляет два обращения, потому что не получила подтверждение. Для системы учёта оба случая дают одинаковую пару студента и проекта. Но для общения с человеком причины отличаются. Поэтому запрет повторной записи должен сопровождаться понятным сообщением, а не обвинением пользователя в неправильном действии. Мы проектируем устойчивый результат и объяснение, которое помогает продолжить путь.\n\nЕщё одна ситуация: две студентки с одинаковым именем подают разные обращения. Запрет по тексту имени ошибочно объединит их. Поэтому позднее понадобятся устойчивые идентификаторы. Пока достаточно сформулировать смысл: одна заявка связывает конкретного человека с конкретным проектом. Эта точность возникает уже на этапе анализа, хотя технические ключи мы введём позже. Она позволяет не исправлять смысл ограничения после создания базы.","hint":"Свяжите каждую причину с ранее разобранной трудностью. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-11","catalog":"Свободная схема","title":"Причины затруднений","kind":"visual","data":{"visual":{"type":" Что исправляет причину? Варианты: Отдельный список у каждого сотрудника; Общий реестр с ответственным и статусом; Уведомление об отправке без общего учёта. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Общий реестр с ответственным и статусом. Общий реестр связывает обращение, владельца обработки и наблюдаемый статус. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","hint":"Дайте аудитории выбрать вариант. Ответ и разбор показывайте отдельной командой.","visualDescription":"В чате заявка есть, у ответственного её нет. Что исправляет причину? Отдельный список у каждого сотрудника; Общий реестр с ответственным и статусом; Уведомление об отправке без общего учёта","wordCount":68,"estimatedSeconds":58,"quiz":{"id":"З1-Т2","revision":1,"prompt":"В чате заявка есть, у ответственного её нет. Что исправляет причину?","options":["Отдельный список у каждого сотрудника","Общий реестр с ответственным и статусом","Уведомление об отправке без общего учёта"],"answer":1,"explanation":"Общий реестр связывает обращение, владельца обработки и наблюдаемый статус."},"plannedSeconds":0,"startSeconds":1472,"requiredWpm":0},{"title":"Границы и процессы","body":"В первую версию входит полный путь заявки","visual":{"type":"section","number":3,"title":"Границы и процессы"},"speech":"Переходим к вопросу 3: границы и процессы. В первую версию входит полный путь заявки. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":3,"id":"З1-С13","number":21,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":29,"startSeconds":1472,"transition":"","script":"Переходим к вопросу 3: границы и процессы. В первую версию входит полный путь заявки. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 3: Границы и процессы. Справа большая серая стрелка, направленная влево.","wordCount":36,"pauseSeconds":8,"estimatedSeconds":28,"requiredWpm":103,"links":"webinar-1, Границы и процессы; учебные правила проекта"},{"title":"Пользователи и их цели","body":"В сервисе действуют две роли","visual":{"type":"pair","items":[{"title":"Граница системы","visual":{"type":"table","columns":["Внутри сервиса","Вне первой версии"],"rows":[["Каталог и карточка проекта","Создание проектов через редактор"],["Подача и свои заявки","Чат и видеовстречи"],["Решение преподавателя","Автоматический подбор"],["Заранее подготовленный вход","Разработка механизма регистрации"]],"caption":""}},{"title":"Пользователи и их цели","visual":{"type":"table","columns":["Роль","Цель","Действия"],"rows":[["Студент","Получить участие в выбранном проекте","Каталог, заявка, свой статус"],["Преподаватель","Набрать участников своего проекта","Просмотр обращений, решение"]],"caption":""}}]},"speech":"Граница системы показывает, за что отвечает создаваемый продукт. Мы включаем каталог, подачу и рассмотрение заявки. Каталог заранее заполнен учебными проектами. Вход считаем действующим: на следующих занятиях сервер сможет определить пользователя по сеансу. Это допущение позволяет разобрать проектирование заявки без отдельного курса по регистрации. Однако существование входа не даёт права доверять любому номеру пользователя, переданному в форме.\n\nВне границы первой версии остаются чат, видеовстречи и подбор проектов. Это не навсегда запрещённые функции. Они просто не нужны для завершения основного пути. Явная граница защищает материалы от случайного появления новых полей и полномочий, которые никто не проектировал.\n\nРоль описывает характер взаимодействия с системой. Один реальный человек в разных продуктах может выполнять разные роли, но наш учебный пример фиксирует только две. Студент ищет проект и отслеживает своё обращение. Преподаватель рассматривает обращения на свои проекты. Список действий следует из целей. Если действие не связано с целью, необходимо понять, зачем оно появляется. Например, редактирование чужой заявки не требуется ни одной из этих ролей.","explanation":"Не будем вводить администратора только потому, что он встречается во многих приложениях. Поддержка сервиса как техническая работа существует, но отдельный пользовательский кабинет сопровождения в первой версии не проектируется. Это помогает сохранить понятную модель доступа и не подменять действующие роли организационными должностями.","hint":"Уточните допущение о готовом входе. Отделяйте роль в приложении от должности человека.","sources":[],"question":3,"id":"З1-С14","number":22,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":180,"startSeconds":1501,"transition":"","script":"Граница системы показывает, за что отвечает создаваемый продукт. Мы включаем каталог, подачу и рассмотрение заявки. Каталог заранее заполнен учебными проектами. Вход считаем действующим: на следующих занятиях сервер сможет определить пользователя по сеансу. Это допущение позволяет разобрать проектирование заявки без отдельного курса по регистрации. Однако существование входа не даёт права доверять любому номеру пользователя, переданному в форме.\n\nВне границы первой версии остаются чат, видеовстречи и подбор проектов. Это не навсегда запрещённые функции. Они просто не нужны для завершения основного пути. Явная граница защищает материалы от случайного появления новых полей и полномочий, которые никто не проектировал.\n\nРоль описывает характер взаимодействия с системой. Один реальный человек в разных продуктах может выполнять разные роли, но наш учебный пример фиксирует только две. Студент ищет проект и отслеживает своё обращение. Преподаватель рассматривает обращения на свои проекты. Список действий следует из целей. Если действие не связано с целью, необходимо понять, зачем оно появляется. Например, редактирование чужой заявки не требуется ни одной из этих ролей.\n\nСопоставим записи в таблице. В строке 1 внутри сервиса: Каталог и карточка проекта. вне первой версии: Создание проектов через редактор. В строке 2 внутри сервиса: Подача и свои заявки. вне первой версии: Чат и видеовстречи. В строке 3 внутри сервиса: Решение преподавателя. вне первой версии: Автоматический подбор. В строке 4 внутри сервиса: Заранее подготовленный вход. вне первой версии: Разработка механизма регистрации.\n\nСопоставим записи в таблице. В строке 1 роль: Студент. цель: Получить участие в выбранном проекте. действия: Каталог, заявка, свой статус. В строке 2 роль: Преподаватель. цель: Набрать участников своего проекта. действия: Просмотр обращений, решение.\n\nНе будем вводить администратора только потому, что он встречается во многих приложениях. Поддержка сервиса как техническая работа существует, но отдельный пользовательский кабинет сопровождения в первой версии не проектируется. Это помогает сохранить понятную модель доступа и не подменять действующие роли организационными должностями.\n\n","visualDescription":"Граница системы. Таблица. Столбцы: Внутри сервиса; Вне первой версии. Строка 1: Каталог и карточка проекта; Создание проектов через редактор. Строка 2: Подача и свои заявки; Чат и видеовстречи. Строка 3: Решение преподавателя; Автоматический подбор. Строка 4: Заранее подготовленный вход; Разработка механизма регистрации.\n\nПользователи и их цели. Таблица. Столбцы: Роль; Цель; Действия. Строка 1: Студент; Получить участие в выбранном проекте; Каталог, заявка, свой статус. Строка 2: Преподаватель; Набрать участников своего проекта; Просмотр обращений, решение.","wordCount":293,"pauseSeconds":16,"estimatedSeconds":176,"requiredWpm":107,"links":"webinar-1, Границы и процессы; учебные правила проекта"},{"title":"Заинтересованные стороны","body":"На решения влияют и те, кто не работает с интерфейсом","visual":{"type":"process","items":[{"title":"Пользователь","text":"Анна непосредственно подаёт заявку через сервис"},{"title":"Преподаватель","text":"Ирина задаёт условия рассмотрения своего проекта"},{"title":"Координатор учебных проектов","text":"Заинтересован в понятном процессе и результатах внедрения"}]},"speech":"Заинтересованная сторона — человек или группа, чьи интересы затрагивает система. Пользователь непосредственно взаимодействует с интерфейсом и тоже относится к заинтересованным сторонам. Координатор может согласовывать правила организации процесса, не получая собственной учётной записи в нашей модели. Поэтому перечень заинтересованных сторон шире перечня ролей. Мы используем его для сбора требований, а не для автоматического создания новых экранов.","explanation":"Предположим, координатор просит единые названия статусов во всех проектах. Такое пожелание влияет на правила и словарь интерфейса. Из него не следует, что координатору обязательно нужен кабинет с правом менять заявки. Полномочия проектируют отдельно, когда появляется подтверждённый сценарий.\n\nПредставим пожелание координатора: «Хочу понимать, сколько обращений ещё не рассмотрено». Оно может привести к отчёту, но сначала нужно выяснить цель и допустимый доступ. Нельзя автоматически выдать человеку все мотивационные тексты только потому, что его интерес затрагивает процесс. Для подсчёта может хватить обобщённых сведений. В нашей первой версии такой отчёт не включён. Пример показывает, как пожелание заинтересованной стороны превращается в отдельное решение, а не в неограниченную новую роль.\n\nЭто различие полезно при обсуждении состава проекта. Список людей, с которыми разговаривают, обычно шире списка пользователей интерфейса. Некоторым нужен результат организационной работы, другим — ежедневное действие в программе. Если смешать эти группы, число кабинетов начнёт расти без подтверждённых сценариев. Поэтому сначала фиксируют интерес, затем возможный способ удовлетворения и только после этого рассматривают полномочия. Такой порядок помогает удерживать ясную границу ресурса.","hint":"Третья позиция не является третьей ролью приложения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-15","catalog":"Свободная схема","title":"Заинтересованные стороны","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Пользователь","text":"Анна непосредственно подаёт заявку через сервис"},{"title":"Преподаватель","text":"Ирина задаёт условия рассмотрения своего проекта"},{"title":"Координатор учебных проектов","text":"Заинтересован в понятном процессе и результатах внедрения"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"На решения влияют и те, кто не работает с интерфейсом","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Пользователь: Анна непосредственно подаёт заявку через сервис","focus":["p0"],"result":""},{"caption":"Преподаватель: Ирина задаёт условия рассмотрения своего проекта","focus":["p1"],"result":""},{"caption":"Координатор учебных проектов: Заинтересован в понятном процессе и результатах внедрения","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"На решения влияют и те, кто не работает с интерфейсом"}]}],"structural":true},"question":3,"id":"З1-С15","number":23,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":150,"startSeconds":1681,"transition":"","script":"Заинтересованная сторона — человек или группа, чьи интересы затрагивает система. Пользователь непосредственно взаимодействует с интерфейсом и тоже относится к заинтересованным сторонам. Координатор может согласовывать правила организации процесс
