 адресов недостаточно. Клиенту нужно знать, что передавать и как понять ответ. Серверу — какие правила применить. Договор позволяет создавать части приложения согласованно, даже если их реализуют отдельно.\n\nМы фиксируем шесть операций из исходного плана. Их имена не меняются на следующих слайдах. Если понадобится расширение, оно будет объявлено отдельно. Это особенно важно для «моих заявок»: сервер получает текущего пользователя из сеанса, а не требует student_id в свободной строке. На следующих слайдах пройдём каждую операцию и покажем её связь с экраном и моделью данных.\n\nКаталог запрашивает набор проектов. Метод GET не создаёт заявку и не меняет её статус. В сокращённом ответе показан один учебный проект. Массив может содержать несколько элементов или быть пустым. Каждая карточка строится из собственных данных. Показанный номер связывает выбор с последующим запросом конкретного проекта. Мы не добавляем в ответ мотивации студентов, потому что они относятся к другому ресурсу и не нужны для выбора темы.","explanation":"Пустой успешный массив отличается от ошибки загрузки. При пустом каталоге интерфейс сообщает отсутствие доступных записей. При неудачном обмене он не должен утверждать, что проектов нет. Такое различие мы уже видели в состояниях интерфейса. Теперь у него появился технический источник: полученный результат и его содержимое. Сокращение ответа отмечено, чтобы модель проекта сохраняла поле description, хотя здесь оно опущено.","hint":"API — «эй-пи-ай», дайте расшифровку перед сокращением. Сопоставьте массив с карточками каталога. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"notebook":"API — согласованный интерфейс взаимодействия программных компонентов.","learning":{"id":"explain-3-15","catalog":"Свободная схема","title":"Получение каталога","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"API как договор","visual":{"type":"process","items":[{"title":"Обращение","text":"Метод, путь и допустимое содержимое"},{"title":"Условия","text":"Кто вызывает и какие правила выполнены"},{"title":"Результат","text":"Успешное представление или согласованная ошибка"}]}},{"title":"Получение каталога","visual":{"type":"code","language":"HTTP + JSON","code":"GET /api/projects\n\n200 OK\n[{\"id\":17,\"title\":\"Сайт студенческого клуба\",\n  \"teacher_id\":7,\"is_open\":true}]","caption":"Сокращённое представление каталога, без полного описания каждого проекта."}}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"GET /api/projects возвращает проекты","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Обращение: Метод, путь и допустимое содержимое","focus":["v0.p0"],"result":""},{"caption":"Условия: Кто вызывает и какие правила выполнены","focus":["v0.p1"],"result":""},{"caption":"Результат: Успешное представление или согласованная ошибка","focus":["v0.p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"GET /api/projects возвращает проекты"}]}],"structural":true},"question":3,"id":"З3-С15","number":23,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":192,"startSeconds":1589,"transition":"","script":"Эй-пи-ай, API, означает application programming interface, программный интерфейс приложения. В нашем разборе это договор обмена между браузером и сервером. Он описывает операции, форматы, условия доступа и результаты. Перечня адресов недостаточно. Клиенту нужно знать, что передавать и как понять ответ. Серверу — какие правила применить. Договор позволяет создавать части приложения согласованно, даже если их реализуют отдельно.\n\nМы фиксируем шесть операций из исходного плана. Их имена не меняются на следующих слайдах. Если понадобится расширение, оно будет объявлено отдельно. Это особенно важно для «моих заявок»: сервер получает текущего пользователя из сеанса, а не требует student_id в свободной строке. На следующих слайдах пройдём каждую операцию и покажем её связь с экраном и моделью данных.\n\nКаталог запрашивает набор проектов. Метод GET не создаёт заявку и не меняет её статус. В сокращённом ответе показан один учебный проект. Массив может содержать несколько элементов или быть пустым. Каждая карточка строится из собственных данных. Показанный номер связывает выбор с последующим запросом конкретного проекта. Мы не добавляем в ответ мотивации студентов, потому что они относятся к другому ресурсу и не нужны для выбора темы.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Обращение». Метод, путь и допустимое содержимое. Второй блок обозначен «Условия». Кто вызывает и какие правила выполнены. Третий блок обозначен «Результат». Успешное представление или согласованная ошибка.\n\nПеред нами подготовленный фрагмент HTTP + JSON. Сокращённое представление каталога, без полного описания каждого проекта. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nПустой успешный массив отличается от ошибки загрузки. При пустом каталоге интерфейс сообщает отсутствие доступных записей. При неудачном обмене он не должен утверждать, что проектов нет. Такое различие мы уже видели в состояниях интерфейса. Теперь у него появился технический источник: полученный результат и его содержимое. Сокращение ответа отмечено, чтобы модель проекта сохраняла поле description, хотя здесь оно опущено.\n\n","visualDescription":"API как договор. Последовательность подписанных блоков. 1. Обращение: Метод, путь и допустимое содержимое. 2. Условия: Кто вызывает и какие правила выполнены. 3. Результат: Успешное представление или согласованная ошибка.\n\nПолучение каталога. Фрагмент HTTP + JSON. Сокращённое представление каталога, без полного описания каждого проекта.\nGET /api/projects\n\n200 OK\n[{\"id\":17,\"title\":\"Сайт студенческого клуба\",\n  \"teacher_id\":7,\"is_open\":true}]","wordCount":299,"pauseSeconds":20,"estimatedSeconds":183,"requiredWpm":104,"links":"webinar-3, Договор API; учебные правила проекта"},{"title":"Получение проекта","body":"GET /api/projects/17 возвращает выбранное описание","visual":{"type":"code","language":"HTTP + JSON","code":"GET /api/projects/17\n\n200 OK\n{\"id\":17,\"title\":\"Сайт студенческого клуба\",\n \"description\":\"Каталог мероприятий и личный кабинет\",\n \"teacher_id\":7,\"is_open\":true}","caption":"Данные для карточки выбранного проекта."},"speech":"Запрос конкретного проекта содержит идентификатор в пути. Ответ даёт сведения для карточки: название, описание, ответственного и доступность набора. Номер должен совпадать с тем, который Анна выбрала в каталоге. Если проект не найден, нельзя подставлять случайную карточку или показывать форму без контекста. Для учебного договора отсутствие ресурса обозначаем 404. Это отдельная ситуация от закрытого набора, при котором проект существует, но не принимает новые заявки.","explanation":"Полученный is_open описывает состояние на момент чтения. До подачи оно может измениться. Поэтому сервер снова проверит проект при POST. Карточка помогает человеку принять решение, но её копия не даёт бессрочного разрешения на создание. Такая связь чтения и действия показывает, почему договор операции включает текущие условия, а не только поля. Следующий слайд перейдёт к созданию заявки.","hint":"Отличите отсутствующий проект от существующего закрытого.","sources":[],"question":3,"id":"З3-С16","number":24,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":99,"startSeconds":1781,"transition":"","script":"Запрос конкретного проекта содержит идентификатор в пути. Ответ даёт сведения для карточки: название, описание, ответственного и доступность набора. Номер должен совпадать с тем, который Анна выбрала в каталоге. Если проект не найден, нельзя подставлять случайную карточку или показывать форму без контекста. Для учебного договора отсутствие ресурса обозначаем 404. Это отдельная ситуация от закрытого набора, при котором проект существует, но не принимает новые заявки.\n\nПеред нами подготовленный фрагмент HTTP + JSON. Данные для карточки выбранного проекта. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nПолученный is_open описывает состояние на момент чтения. До подачи оно может измениться. Поэтому сервер снова проверит проект при POST. Карточка помогает человеку принять решение, но её копия не даёт бессрочного разрешения на создание. Такая связь чтения и действия показывает, почему договор операции включает текущие условия, а не только поля. Следующий слайд перейдёт к созданию заявки.\n\n","visualDescription":"Фрагмент HTTP + JSON. Данные для карточки выбранного проекта.\nGET /api/projects/17\n\n200 OK\n{\"id\":17,\"title\":\"Сайт студенческого клуба\",\n \"description\":\"Каталог мероприятий и личный кабинет\",\n \"teacher_id\":7,\"is_open\":true}","wordCount":152,"pauseSeconds":12,"estimatedSeconds":95,"requiredWpm":105,"links":"webinar-3, Договор API; учебные правила проекта"},{"title":"Создание заявки","body":"POST /api/applications принимает только проект и мотивацию","visual":{"type":"code","language":"HTTP + JSON","code":"POST /api/applications\nContent-Type: application/json\n\n{\n  \"project_id\": 17,\n  \"motivation\": \"Хочу разработать каталог мероприятий и личный кабинет участника студенческого клуба.\"\n}","caption":"Упрощённый запрос. Действующий сеанс подразумевается, технические заголовки опущены."},"speech":"Эта операция создаёт новую заявку при выполненных условиях. Тело содержит project_id и motivation. Сервер определит Анну как пользователя двенадцать и назначит pending. Именно поэтому клиент не выбирает status и не присылает student_id как источник полномочия. Проект семнадцать должен существовать и быть открыт. До обработки у Анны не должно быть заявки на эту же тему. Все эти условия относятся к одному действию, хотя проверяются на разных уровнях.","explanation":"Успешный ответ получит 201 и номер сто четыре. Для повтора договор предусматривает 409 с кодом APPLICATION_EXISTS. При слишком короткой мотивации будет 422. Этот набор позволяет интерфейсу выбрать конкретное состояние. Мы не отправляем одновременно два показанных успешных запроса для одного студента и проекта: последующие примеры используют разные исходные условия или обозначены как повторная попытка.","hint":"Чётко назовите исходное отсутствие заявки.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":3,"id":"З3-С17","number":25,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":103,"startSeconds":1880,"transition":"","script":"Эта операция создаёт новую заявку при выполненных условиях. Тело содержит project_id и motivation. Сервер определит Анну как пользователя двенадцать и назначит pending. Именно поэтому клиент не выбирает status и не присылает student_id как источник полномочия. Проект семнадцать должен существовать и быть открыт. До обработки у Анны не должно быть заявки на эту же тему. Все эти условия относятся к одному действию, хотя проверяются на разных уровнях.\n\nПеред нами подготовленный фрагмент HTTP + JSON. Упрощённый запрос. Действующий сеанс подразумевается, технические заголовки опущены. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nУспешный ответ получит 201 и номер сто четыре. Для повтора договор предусматривает 409 с кодом APPLICATION_EXISTS. При слишком короткой мотивации будет 422. Этот набор позволяет интерфейсу выбрать конкретное состояние. Мы не отправляем одновременно два показанных успешных запроса для одного студента и проекта: последующие примеры используют разные исходные условия или обозначены как повторная попытка.\n\n","visualDescription":"Фрагмент HTTP + JSON. Упрощённый запрос. Действующий сеанс подразумевается, технические заголовки опущены.\nPOST /api/applications\nContent-Type: application/json\n\n{\n  \"project_id\": 17,\n  \"motivation\": \"Хочу разработать каталог мероприятий и личный кабинет участника студенческого клуба.\"\n}","wordCount":158,"pauseSeconds":12,"estimatedSeconds":98,"requiredWpm":104,"links":"webinar-3, Договор API; учебные правила проекта"},{"title":"Получение своих заявок","body":"GET /api/my/applications использует текущего пользователя","visual":{"type":"code","language":"HTTP + JSON","code":"GET /api/my/applications\n\n200 OK\n[{\"id\":104,\"project_id\":17,\n  \"student_id\":12,\"status\":\"pending\"}]","caption":"Сокращённый ответ для Анны. Отбор по текущему пользователю выполняет сервер."},"speech":"Слово my в маршруте означает текущего установленного пользователя. Анна не должна передавать номер другого студента, чтобы выбрать чужие обращения. Сервер определяет её по сеансу и ограничивает выборку. В ответе показана созданная заявка сто четыре. Полный интерфейс может дополнительно получить название проекта и дату из согласованного представления. Здесь они опущены ради основной связи между пользователем и строкой.","explanation":"После неопределённого результата подачи этот запрос помогает узнать, существует ли обращение. Если запись видна, интерфейс показывает её вместо новой попытки создания. Если запрос чтения тоже не получил ответ, неопределённость сохраняется. Нельзя считать пустым список, который не удалось загрузить. Такой подход связывает пользовательское восстановление с обычной операцией чтения, не вводя неописанный дополнительный маршрут для проверки.","hint":"my — «май», объясните значение «текущий пользователь».","sources":[],"question":3,"id":"З3-С18","number":26,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":97,"startSeconds":1983,"transition":"","script":"Слово my в маршруте означает текущего установленного пользователя. Анна не должна передавать номер другого студента, чтобы выбрать чужие обращения. Сервер определяет её по сеансу и ограничивает выборку. В ответе показана созданная заявка сто четыре. Полный интерфейс может дополнительно получить название проекта и дату из согласованного представления. Здесь они опущены ради основной связи между пользователем и строкой.\n\nПеред нами подготовленный фрагмент HTTP + JSON. Сокращённый ответ для Анны. Отбор по текущему пользователю выполняет сервер. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nПосле неопределённого результата подачи этот запрос помогает узнать, существует ли обращение. Если запись видна, интерфейс показывает её вместо новой попытки создания. Если запрос чтения тоже не получил ответ, неопределённость сохраняется. Нельзя считать пустым список, который не удалось загрузить. Такой подход связывает пользовательское восстановление с обычной операцией чтения, не вводя неописанный дополнительный маршрут для проверки.\n\n","visualDescription":"Фрагмент HTTP + JSON. Сокращённый ответ для Анны. Отбор по текущему пользователю выполняет сервер.\nGET /api/my/applications\n\n200 OK\n[{\"id\":104,\"project_id\":17,\n  \"student_id\":12,\"status\":\"pending\"}]","wordCount":148,"pauseSeconds":12,"estimatedSeconds":93,"requiredWpm":104,"links":"webinar-3, Договор API; учебные правила проекта"},{"title":"Получение заявок проекта","body":"GET /api/projects/17/applications требует права на проект","visual":{"type":"code","language":"HTTP + JSON","code":"GET /api/projects/17/applications\n\n200 OK\n[{\"id\":104,\"project_id\":17,\"student_id\":12,\n  \"status\":\"pending\"}]","caption":"Сокращённый ответ Ирине, чей id 7 совпадает с teacher_id проекта."},"speech":"Ирина получает обращения к проекту семнадцать. Перед выдачей сервер проверяет её роль и принадлежность проекта. Одного знания адреса недостаточно. Номер проекта доступен в каталоге, поэтому сам путь нельзя считать секретом. Условие teacher_id равно текущему пользователю связывает операцию с матрицей прав. Анна не получает этот список через обычный студенческий доступ, хотя её собственная заявка присутствует среди строк.","explanation":"Ответ может быть пустым, если проект существует, принадлежит Ирине и обращений ещё нет. Это нормальный результат, отличный от запрета доступа. В учебном договоре при недостаточных полномочиях возвращается 403. Интерфейс должен сообщить отказ, а не показать пустой список как будто заявок нет. Такая точность помогает и пользователю, и сопровождению отличать разные причины отсутствия содержимого.","hint":"Сначала право Ирины, затем чтение заявок.","sources":[],"question":3,"id":"З3-С19","number":27,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":97,"startSeconds":2080,"transition":"","script":"Ирина получает обращения к проекту семнадцать. Перед выдачей сервер проверяет её роль и принадлежность проекта. Одного знания адреса недостаточно. Номер проекта доступен в каталоге, поэтому сам путь нельзя считать секретом. Условие teacher_id равно текущему пользователю связывает операцию с матрицей прав. Анна не получает этот список через обычный студенческий доступ, хотя её собственная заявка присутствует среди строк.\n\nПеред нами подготовленный фрагмент HTTP + JSON. Сокращённый ответ Ирине, чей id 7 совпадает с teacher_id проекта. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nОтвет может быть пустым, если проект существует, принадлежит Ирине и обращений ещё нет. Это нормальный результат, отличный от запрета доступа. В учебном договоре при недостаточных полномочиях возвращается 403. Интерфейс должен сообщить отказ, а не показать пустой список как будто заявок нет. Такая точность помогает и пользователю, и сопровождению отличать разные причины отсутствия содержимого.\n\n","visualDescription":"Фрагмент HTTP + JSON. Сокращённый ответ Ирине, чей id 7 совпадает с teacher_id проекта.\nGET /api/projects/17/applications\n\n200 OK\n[{\"id\":104,\"project_id\":17,\"student_id\":12,\n  \"status\":\"pending\"}]","wordCount":149,"pauseSeconds":12,"estimatedSeconds":93,"requiredWpm":105,"links":"webinar-3, Договор API; учебные правила проекта"},{"title":"Решение по заявке","body":"PATCH /api/applications/104 меняет только допустимый статус","visual":{"type":"code","language":"HTTP + JSON","code":"PATCH /api/applications/104\nContent-Type: application/json\n\n{\"status\":\"accepted\"}\n\n200 OK\n{\"id\":104,\"status\":\"accepted\"}","caption":"Сокращённый пример. Ирина отвечает за проект, исходный статус заявки — pending."},"speech":"Ирина отправляет частичное изменение заявки сто четыре. В теле только итоговый статус accepted. Для отрицательного решения используется rejected. Сервер по самой заявке получает проект и проверяет, что он принадлежит Ирине. Также проверяется исходное pending. Иначе уже принятое решение нельзя молча заменить. Успешный ответ показывает сохранённый итог. На экране Анны он будет представлен словом «Одобрена».","explanation":"Этот маршрут не является универсальным редактором всех полей заявки. Он не разрешает менять student_id, project_id или мотивацию. Такой объём операции явно ограничен учебным договором. Если статус уже итоговый, возвращается 409 с причиной недопустимого перехода. Если исполнитель не имеет права, возвращается 403. Разделение ошибок позволяет понять, связана ли проблема с состоянием объекта или полномочием пользователя.","hint":"PATCH — частичное изменение, а не новая заявка. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Сравните условия и результаты всех сценариев. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":["https://www.rfc-editor.org/rfc/rfc5789.html"],"learning":{"id":"atomic-decision","catalog":"ALG-01","title":"Проверка и атомарное решение","kind":"cards","data":{"items":[{"title":"Пользователь","text":"Установить Ирину по сеансу; не доверять id из тела запроса."},{"title":"Принадлежность","text":"Найти проект заявки; teacher_id должен совпасть с пользователем."},{"title":"Текущее состояние","text":"UPDATE ... WHERE id=$1 AND status='pending' RETURNING id;"},{"title":"Результат записи","text":"Одна изменённая строка — решение; ноль — перечитать состояние и вернуть согласованный отказ."}]},"scenarios":[{"label":"Первое решение","input":"Свой проект; status=pending; новый status=accepted.","frames":[{"caption":"Обзор: право и допустимость перехода — разные проверки.","focus":[],"result":""},{"caption":"Личность и принадлежность подтверждены.","focus":["0","1"],"result":""},{"caption":"Условное UPDATE меняет только pending.","focus":["2"],"result":""},{"caption":"Изменена одна строка; после COMMIT можно подтвердить результат.","focus":["3"],"result":"200 OK · accepted"}]},{"label":"Решение уже принято","input":"Свой проект; status=accepted; попытка перевести в rejected.","frames":[{"caption":"Обзор: полномочие Ирины не разрешает повторный переход.","focus":[],"result":""},{"caption":"Условие status=pending не совпало.","focus":["2"],"result":""},{"caption":"Изменено 0 строк; проверенный актуальный статус уже итоговый.","focus":["3"],"result":"409 INVALID_TRANSITION · accepted сохранён"}]}],"structural":false},"question":3,"id":"З3-С20","number":28,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":106,"startSeconds":2177,"transition":"","script":"Ирина отправляет частичное изменение заявки сто четыре. В теле только итоговый статус accepted. Для отрицательного решения используется rejected. Сервер по самой заявке получает проект и проверяет, что он принадлежит Ирине. Также проверяется исходное pending. Иначе уже принятое решение нельзя молча заменить. Успешный ответ показывает сохранённый итог. На экране Анны он будет представлен словом «Одобрена».\n\nНа схеме разберём исходные данные: Свой проект; status=pending; новый status=accepted. Обзор: право и допустимость перехода — разные проверки.  Личность и принадлежность подтверждены.  Условное UPDATE меняет только pending.  Изменена одна строка; после COMMIT можно подтвердить результат. 200 OK · accepted Изменим условие. Свой проект; status=accepted; попытка перевести в rejected. 409 INVALID_TRANSITION · accepted сохранён\n\nЭтот маршрут не является универсальным редактором всех полей заявки. Он не разрешает менять student_id, project_id или мотивацию. Такой объём операции явно ограничен учебным договором. Если статус уже итоговый, возвращается 409 с причиной недопустимого перехода. Если исполнитель не имеет права, возвращается 403. Разделение ошибок позволяет понять, связана ли проблема с состоянием объекта или полномочием пользователя.\n\n","visualDescription":"Фрагмент HTTP + JSON. Сокращённый пример. Ирина отвечает за проект, исходный статус заявки — pending.\nPATCH /api/applications/104\nContent-Type: application/json\n\n{\"status\":\"accepted\"}\n\n200 OK\n{\"id\":104,\"status\":\"accepted\"}","wordCount":164,"pauseSeconds":12,"estimatedSeconds":101,"requiredWpm":105,"links":"webinar-3, Договор API; учебные правила проекта"},{"title":"Единый формат ошибок","body":"Машинный код причины и текст выполняют разные задачи","visual":{"type":"code","language":"HTTP + JSON","code":"409 Conflict\nContent-Type: application/json\n\n{\"code\":\"APPLICATION_EXISTS\",\n \"message\":\"Вы уже подали заявку на этот проект.\"}","caption":"Тело ошибки содержит устойчивый code и понятное пользователю message."},"speech":"В договоре ошибки имеют единый вид. Поле code помогает программе различить причину без анализа свободной фразы. Поле message даёт человеку понятное объяснение. Текст можно редакционно уточнить, сохранив машинное обозначение. Для повтора используем APPLICATION_EXISTS. Закрытый проект получит PROJECT_CLOSED, недопустимый итоговый переход — INVALID_TRANSITION. Длина мотивации относится к ответу 422 и коду MOTIVATION_LENGTH. Это наши договорённости, а не универсальные имена стандарта HTTP.","explanation":"Согласованность формата уменьшает число особых случаев в интерфейсе. Однако чувствительные внутренние подробности не нужно превращать в пользовательское сообщение. Номер таблицы или текст неожиданной ошибки базы не объясняет Анне дальнейшее действие. Сервер сохраняет технические сведения для разбора, а клиент получает предусмотренную причину. Теперь перейдём от внешнего договора к шагам внутренней обработки.\n\nПроследим, что известно до отправки запроса. Анна выбрала проект 17 и написала мотивацию. Эти два значения входят в тело создания. Её номер сервер определяет по подтверждённому сеансу. Начальный статус также назначает сервер. Если разрешить клиенту передавать любой номер студента, интерфейс перестанет быть границей полномочий: запрос можно составить вручную. Поэтому доверенное значение появляется в обработчике после проверки пользователя.\n\nОтвет на успешное создание содержит номер заявки 104 и согласованное состояние. Этот номер можно использовать при последующем чтении. Однако наличие идентификатора не даёт права любому человеку читать или менять запись. Для списка студента сервер выбирает обращения текущего пользователя, а для преподавателя проверяет принадлежность проекта. Разные адреса удобны для описания сценариев, но сами по себе не выполняют проверку доступа. Договор API должен фиксировать и успешный формат, и условия отказа. Тогда разработчик интерфейса знает, когда сохранить введённый текст, когда предложить открыть существующую заявку и когда показать отсутствие полномочий. Это избавляет разные части приложения от независимых догадок о смысле ответа.","hint":"APPLICATION_EXISTS читается как «заявка уже существует».","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":3,"id":"З3-С21","number":29,"blockTitle":"Договор API","blockIndex":2,"plannedSeconds":192,"startSeconds":2283,"transition":"Следующий вопрос — обработка на сервере. Упорядоченный алгоритм выполняет одну операцию.","script":"В договоре ошибки име телю; Только отбор по проекту без проверки владельца; Только фильтрация списка в браузере. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Фильтрация по установленному пользователю. Ресурс «свои заявки» должен ограничивать выборку текущим пользователем. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","script":"Проверим понимание вопроса. GET своих заявок возвращает чужие записи. Что нарушено? Варианты: Фильтрация по установленному пользователю; Только отбор по проекту без проверки владельца; Только фильтрация списка в браузере. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Фильтрация по установленному пользователю. Ресурс «свои заявки» должен ограничивать выборку текущим пользователем. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","hint":"Дайте аудитории выбрать вариант. Ответ и разбор показывайте отдельной командой.","visualDescription":"GET своих заявок возвращает чужие записи. Что нарушено? Фильтрация по установленному пользователю; Только отбор по проекту без проверки владельца; Только фильтрация списка в браузере","wordCount":61,"estimatedSeconds":54,"quiz":{"id":"З3-Т3","revision":1,"prompt":"GET своих заявок возвращает чужие записи. Что нарушено?","options":["Фильтрация по установленному пользователю","Только отбор по проекту без проверки владельца","Только фильтрация списка в браузере"],"answer":0,"explanation":"Ресурс «свои заявки» должен ограничивать выборку текущим пользователем."},"plannedSeconds":0,"startSeconds":2475,"requiredWpm":0},{"title":"Обработка на сервере","body":"Упорядоченный алгоритм выполняет одну операцию","visual":{"type":"section","number":4,"title":"Обработка на сервере"},"speech":"Переходим к вопросу 4: обработка на сервере. Упорядоченный алгоритм выполняет одну операцию. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":4,"id":"З3-С22","number":32,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":28,"startSeconds":2475,"transition":"","script":"Переходим к вопросу 4: обработка на сервере. Упорядоченный алгоритм выполняет одну операцию. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 4: Обработка на сервере. Справа большая серая стрелка, направленная влево.","wordCount":34,"pauseSeconds":8,"estimatedSeconds":27,"requiredWpm":102,"links":"webinar-3, Обработка на сервере; учебные правила проекта"},{"title":"Определение пользователя","body":"Сервер связывает запрос с действующим сеансом","visual":{"type":"pair","items":[{"title":"Серверный обработчик","visual":{"type":"code","language":"Псевдокод","code":"пользователь = определить_по_сеансу()\nпроверить_вход_и_роль(пользователь)\nданные = разобрать_и_проверить_тело()\nпроверить_проект_и_мотивацию(данные)\nзаявка = сохранить_без_повтора(пользователь, данные)\nвернуть_подтверждение(заявка)","caption":"Псевдокод создания заявки: обозначает смысл шагов, а не синтаксис языка."}},{"title":"Определение пользователя","visual":{"type":"table","columns":["Источник","Можно считать доказательством личности?","Почему"],"rows":[["Доверенный контекст сеанса","Да, в принятом учебном допущении","Вход уже проверен системой"],["Поле student_id в JSON","Нет","Клиент может изменить значение"],["Имя на картинке формы","Нет","Внешний вид не устанавливает пользователя"]],"caption":""}}]},"speech":"Обработчик — часть серверной программы, которая принимает конкретную операцию и формирует её результат. На экране псевдокод, то есть описание алгоритма понятными действиями без привязки к языку. Сначала устанавливается пользователь, затем проверяются вход и роль. После разбора данных проверяют проект и мотивацию. Сохранение должно учитывать повтор, а ответ — подтверждённый результат. Каждый шаг соответствует уже известному правилу.\n\nПсевдокод не скрывает необходимость обработки отказа. Если условие не выполнено, путь создания прекращается и формируется согласованная ошибка. Порядок отдельных независимых проверок может отличаться в реализации, но нельзя сохранить недопустимую заявку и только потом обнаружить запрет. Мы будем читать алгоритм по смыслу, не требуя от ведущего объяснять незнакомый язык или запускать этот фрагмент.\n\nАутентификация — установление того, кто обращается к системе. В нашем сценарии она уже выполнена механизмом входа. Обработчик получает доверенный контекст и определяет Анну как пользователя двенадцать. Если в JSON прислали номер семь, это не делает клиента Ириной. Поэтому student_id не входит в согласованное тело создания. Сервер берёт значение из установленного пользователя. Так запрос нельзя превратить в чужую заявку простой подстановкой поля.","explanation":"Мы не проектируем здесь способ выдачи и проверки сеанса. Это явная зависимость учебного примера. Важно понимать её границу: готовый вход позволяет определить пользователя, но не отменяет дальнейшую проверку роли и принадлежности объекта. Человек может быть успешно установлен и всё равно не иметь права на конкретное действие. Следующие слайды разберут эти условия отдельно.","hint":"Сначала объявите псевдокод. Не вводите его в редактор. Объясните аутентификацию перед дальнейшим использованием термина.","sources":[],"question":4,"id":"З3-С23","number":33,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":203,"startSeconds":2503,"transition":"","script":"Обработчик — часть серверной программы, которая принимает конкретную операцию и формирует её результат. На экране псевдокод, то есть описание алгоритма понятными действиями без привязки к языку. Сначала устанавливается пользователь, затем проверяются вход и роль. После разбора данных проверяют проект и мотивацию. Сохранение должно учитывать повтор, а ответ — подтверждённый результат. Каждый шаг соответствует уже известному правилу.\n\nПсевдокод не скрывает необходимость обработки отказа. Если условие не выполнено, путь создания прекращается и формируется согласованная ошибка. Порядок отдельных независимых проверок может отличаться в реализации, но нельзя сохранить недопустимую заявку и только потом обнаружить запрет. Мы будем читать алгоритм по смыслу, не требуя от ведущего объяснять незнакомый язык или запускать этот фрагмент.\n\nАутентификация — установление того, кто обращается к системе. В нашем сценарии она уже выполнена механизмом входа. Обработчик получает доверенный контекст и определяет Анну как пользователя двенадцать. Если в JSON прислали номер семь, это не делает клиента Ириной. Поэтому student_id не входит в согласованное тело создания. Сервер берёт значение из установленного пользователя. Так запрос нельзя превратить в чужую заявку простой подстановкой поля.\n\nПеред нами подготовленный фрагмент Псевдокод. Псевдокод создания заявки: обозначает смысл шагов, а не синтаксис языка. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nСопоставим записи в таблице. В строке 1 источник: Доверенный контекст сеанса. можно считать доказательством личности?: Да, в принятом учебном допущении. почему: Вход уже проверен системой. В строке 2 источник: Поле student_id в JSON. можно считать доказательством личности?: Нет. почему: Клиент может изменить значение. В строке 3 источник: Имя на картинке формы. можно считать доказательством личности?: Нет. почему: Внешний вид не устанавливает пользователя.\n\nМы не проектируем здесь способ выдачи и проверки сеанса. Это явная зависимость учебного примера. Важно понимать её границу: готовый вход позволяет определить пользователя, но не отменяет дальнейшую проверку роли и принадлежности объекта. Человек может быть успешно установлен и всё равно не иметь права на конкретное действие. Следующие слайды разберут эти условия отдельно.\n\n","visualDescription":"Серверный обработчик. Фрагмент Псевдокод. Псевдокод создания заявки: обозначает смысл шагов, а не синтаксис языка.\nпользователь = определить_по_сеансу()\nпроверить_вход_и_роль(пользователь)\nданные = разобрать_и_проверить_тело()\nпроверить_проект_и_мотивацию(данные)\nзаявка = сохранить_без_повтора(пользователь, данные)\nвернуть_подтверждение(заявка)\n\nОпределение пользователя. Таблица. Столбцы: Источник; Можно считать доказательством личности?; Почему. Строка 1: Доверенный контекст сеанса; Да, в принятом учебном допущении; Вход уже проверен системой. Строка 2: Поле student_id в JSON; Нет; Клиент может изменить значение. Строка 3: Имя на картинке формы; Нет; Внешний вид не устанавливает пользователя.","wordCount":319,"pauseSeconds":20,"estimatedSeconds":194,"requiredWpm":105,"links":"webinar-3, Обработка на сервере; учебные правила проекта"},{"title":"Проверка входных данных","body":"Разобранный JSON ещё должен соответствовать договору","visual":{"type":"table","columns":["Проверка","Корректный вариант","Отказ"],"rows":[["Структура","Объект с двумя ожидаемыми полями","Неверное содержимое"],["project_id","Числовой идентификатор проекта","Отсутствует или неподходящий тип"],["motivation","Текст после согласованной нормализации","Нет текста или нарушена длина"],["Лишние поля","Отсутствуют","Не принимаются как полномочие"]],"caption":""},"speech":"Валидация — проверка соответствия данных установленным правилам. Сначала сообщение должно быть корректно разобрано как JSON. Затем проверяется структура: ожидаемые поля, их типы и обязательность. Число проекта и текст мотивации имеют разное назначение. Сервер не обязан превращать любое случайное значение в допустимое. Для учебного договора неподдерживаемое содержимое отклоняется, а неизвестные поля не становятся скрытыми командами.","explanation":"После удаления пробелов с концов мотивация считается по Unicode code points. Это уточнение введено на втором занятии и применяется одинаково. Пятьдесят и тысяча включены в допустимый диапазон. Проверка формата не доказывает существование проекта или право студента. Поэтому техническую допустимость значения отделяем от бизнес-условий. Такой порядок помогает точно назвать причину отказа и сохранить согласованное сообщение интерфейса.","hint":"Валидация — проверка данных, а не установление личности.","sources":[],"question":4,"id":"З3-С24","number":34,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":108,"startSeconds":2706,"transition":"","script":"Валидация — проверка соответствия данных установленным правилам. Сначала сообщение должно быть корректно разобрано как JSON. Затем проверяется структура: ожидаемые поля, их типы и обязательность. Число проекта и текст мотивации имеют разное назначение. Сервер не обязан превращать любое случайное значение в допустимое. Для учебного договора неподдерживаемое содержимое отклоняется, а неизвестные поля не становятся скрытыми командами.\n\nСопоставим записи в таблице. В строке 1 проверка: Структура. корректный вариант: Объект с двумя ожидаемыми полями. отказ: Неверное содержимое. В строке 2 проверка: project_id. корректный вариант: Числовой идентификатор проекта. отказ: Отсутствует или неподходящий тип. В строке 3 проверка: motivation. корректный вариант: Текст после согласованной нормализации. отказ: Нет текста или нарушена длина. В строке 4 проверка: Лишние поля. корректный вариант: Отсутствуют. отказ: Не принимаются как полномочие.\n\nПосле удаления пробелов с концов мотивация считается по Unicode code points. Это уточнение введено на втором занятии и применяется одинаково. Пятьдесят и тысяча включены в допустимый диапазон. Проверка формата не доказывает существование проекта или право студента. Поэтому техническую допустимость значения отделяем от бизнес-условий. Такой порядок помогает точно назвать причину отказа и сохранить согласованное сообщение интерфейса.\n\n","visualDescription":"Таблица. Столбцы: Проверка; Корректный вариант; Отказ. Строка 1: Структура; Объект с двумя ожидаемыми полями; Неверное содержимое. Строка 2: project_id; Числовой идентификатор проекта; Отсутствует или неподходящий тип. Строка 3: motivation; Текст после согласованной нормализации; Нет текста или нарушена длина. Строка 4: Лишние поля; Отсутствуют; Не принимаются как полномочие.","wordCount":174,"pauseSeconds":8,"estimatedSeconds":103,"requiredWpm":104,"links":"webinar-3, Обработка на сервере; учебные правила проекта"},{"title":"Проверка роли","body":"Установленный пользователь получает только разрешённые действия","visual":{"type":"table","columns":["Операция","Требуемая роль","Пример отказа"],"rows":[["Создание заявки","student","Ирина не подаёт заявку как преподаватель"],["Решение по заявке","teacher","Анна не принимает собственную заявку"],["Список проекта","teacher и принадлежность","Роль без связи проекта недостаточна"]],"caption":""},"speech":"Авторизация — проверка права выполнить действие. Она следует после установления пользователя и опирается на роль и объектные условия. В нашем учебном договоре создание заявки предназначено студенту. Решение выполняет преподаватель. Анна может быть успешно вошедшим пользователем, но не вправе одобрить своё обращение. Поэтому отсутствие кнопки в интерфейсе не является достаточной защитой: сервер проверяет роль при обращении.","explanation":"У преподавателя также есть ограничение по собственному проекту. Значение teacher не открывает общий доступ ко всем заявлениям. Таблица помогает различать общий тип действия и конкретный объект. При отсутствии входа используем 401, при установленном пользователе без нужного права — 403. Пользовательское сообщение объясняет отказ без обещания, что повторение того же запроса изменит полномочия.","hint":"Авторизация — право действия; сопоставьте с аутентификацией.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":4,"id":"З3-С25","number":35,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":100,"startSeconds":2814,"transition":"","script":"Авторизация — проверка права выполнить действие. Она следует после установления пользователя и опирается на роль и объектные условия. В нашем учебном договоре создание заявки предназначено студенту. Решение выполняет преподаватель. Анна может быть успешно вошедшим пользователем, но не вправе одобрить своё обращение. Поэтому отсутствие кнопки в интерфейсе не является достаточной защитой: сервер проверяет роль при обращении.\n\nСопоставим записи в таблице. В строке 1 операция: Создание заявки. требуемая роль: student. пример отказа: Ирина не подаёт заявку как преподаватель. В строке 2 операция: Решение по заявке. требуемая роль: teacher. пример отказа: Анна не принимает собственную заявку. В строке 3 операция: Список проекта. требуемая роль: teacher и принадлежность. пример отказа: Роль без связи проекта недостаточна.\n\nУ преподавателя также есть ограничение по собственному проекту. Значение teacher не открывает общий доступ ко всем заявлениям. Таблица помогает различать общий тип действия и конкретный объект. При отсутствии входа используем 401, при установленном пользователе без нужного права — 403. Пользовательское сообщение объясняет отказ без обещания, что повторение того же запроса изменит полномочия.\n\n","visualDescription":"Таблица. Столбцы: Операция; Требуемая роль; Пример отказа. Строка 1: Создание заявки; student; Ирина не подаёт заявку как преподаватель. Строка 2: Решение по заявке; teacher; Анна не принимает собственную заявку. Строка 3: Список проекта; teacher и принадлежность; Роль без связи проекта недостаточна.","wordCount":161,"pauseSeconds":8,"estimatedSeconds":96,"requiredWpm":105,"links":"webinar-3, Обработка на сервере; учебные правила проекта"},{"title":"Принадлежность проекта","body":"Ирина принимает решение по связи teacher_id","visual":{"type":"diagram","nodes":["Заявка 104","Проект 17","teacher_id = 7","Текущая Ирина: id 7"],"edges":[["Заявка 104","Проект 17","project_id указывает проект"],["Проект 17","teacher_id = 7","Ответственный"],["teacher_id = 7","Текущая Ирина: id 7","Значения должны совпасть"]],"caption":""},"speech":"Для решения по заявке сначала находят связанный проект. Затем сопоставляют его teacher_id с установленным пользователем. В нашем случае оба значения равны семи, поэтому условие принадлежности выполнено. Другой преподаватель не проходит это условие, даже если знает номер заявки. Клиент не может исправить ситуацию подстановкой teacher_id в тело решения: такого поля там нет, а проверка использует сохранённые связи.","explanation":"Существование объекта и право на него — разные вопросы. Заявка может существовать, но быть недоступной данному пользователю. В учебном договоре защищённая операция возвращает согласованный отказ. Реальные сервисы могут выбирать другую политику раскрытия существования ресурса, но мы не меняем её между примерами. Главное правило остаётся: сервер не выводит полномочие только из знания адреса или роли преподавателя.","hint":"Прочитайте цепочку от заявки к проекту и текущему пользователю. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-26","catalog":"Свободная схема","title":"Принадлежность проекта","kind":"visual","data":{"visual":{"type":"diagram","nodes":["Заявка 104","Проект 17","teacher_id = 7","Текущая Ирина: id 7"],"edges":[["Заявка 104","Проект 17","project_id указывает проект"],["Проект 17","teacher_id = 7","Ответственный"],["teacher_id = 7","Текущая Ирина: id 7","Значения должны совпасть"]],"caption":""},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Ирина принимает решение по связи teacher_id","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Заявка 104 → Проект 17: project_id указывает проект","focus":["e0"],"result":""},{"caption":"Проект 17 → teacher_id = 7: Ответственный","focus":["e1"],"result":""},{"caption":"teacher_id = 7 → Текущая Ирина: id 7: Значения должны совпасть","focus":["e2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Ирина принимает решение по связи teacher_id"}]}],"structural":true},"question":4,"id":"З3-С26","number":36,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":105,"startSeconds":2914,"transition":"","script":"Для решения по заявке сначала находят связанный проект. Затем сопоставляют его teacher_id с установленным пользователем. В нашем случае оба значения равны семи, поэтому условие принадлежности выполнено. Другой преподаватель не проходит это условие, даже если знает номер заявки. Клиент не может исправить ситуацию подстановкой teacher_id в тело решения: такого поля там нет, а проверка использует сохранённые связи.\n\nРассмотрим подписанные связи схемы. Связь между блоками «Заявка 104» и «Проект 17» обозначает следующее: project_id указывает проект. Связь между блоками «Проект 17» и «teacher_id = 7» обозначает следующее: ответственный. Связь между блоками «teacher_id = 7» и «Текущая Ирина: id 7» обозначает следующее: значения должны совпасть.\n\nСуществование объекта и право на него — разные вопросы. Заявка может существовать, но быть недоступной данному пользователю. В учебном договоре защищённая операция возвращает согласованный отказ. Реальные сервисы могут выбирать другую политику раскрытия существования ресурса, но мы не меняем её между примерами. Главное правило остаётся: сервер не выводит полномочие только из знания адреса или роли преподавателя.\n\n","visualDescription":"Схема. Блоки: Заявка 104; Проект 17; teacher_id = 7; Текущая Ирина: id 7. Связи: Заявка 104 — Проект 17: project_id указывает проект; Проект 17 — teacher_id = 7: Ответственный; teacher_id = 7 — Текущая Ирина: id 7: Значения должны совпасть.","wordCount":158,"pauseSeconds":14,"estimatedSeconds":100,"requiredWpm":104,"links":"webinar-3, Обработка на сервере; учебные правила проекта"},{"title":"Бизнес-правила","body":"Допустимость определяется текущим состоянием предметной области","visual":{"type":"process","items":[{"title":"Набор открыт","text":"Проект существует и принимает новые заявки"},{"title":"Мотивация допустима","text":"Нормализованный текст имеет 50–1000 символов"},{"title":"Повтора нет","text":"Сочетание студента и проекта ещё не занято"},{"title":"Переход допустим","text":"Решение применяется только из pending"}]},"speech":"Бизнес-правила описывают ограничения предметной области, а не синтаксис сообщения. Корректный JSON может содержать закрытый проект. Допустимый номер может ссылаться на уже занятую пару. Правильное слово accepted может прийти для заявки, по которой итог уже сохранён. Поэтому обработка проверяет текущее состояние и контекст операции. Не все правила используются в каждом запросе: открытый набор нужен созданию, а исходный статус — решению.","explanation":"Текущее состояние может измениться между чтением и записью. Это означает, что предварительное условие надо поддержать способом сохранения, а не только отдельным ранним запросом. Для повтора такую защиту даёт уникальная пара. Для перехода можно использовать условное обновление из pending с проверкой результата. Мы не разрабатываем большой код, но явно показываем, какое правило должно оставаться истинным.","hint":"Не смешивайте правила создания и решения в одну обязательную форму. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-27","catalog":"Свободная схема","title":"Бизнес-правила","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Набор открыт","text":"Проект существует и принимает новые заявки"},{"title":"Мотивация допустима","text":"Нормализованный текст имеет 50–1000 символов"},{"title":"Повтора нет","text":"Сочетание студента и проекта ещё не занято"},{"title":"Переход допустим","text":"Решение применяется только из pending"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Допустимость определяется текущим состоянием предметной области","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Набор открыт: Проект существует и принимает новые заявки","focus":["p0"],"result":""},{"caption":"Мотивация допустима: Нормализованный текст имеет 50–1000 символов","focus":["p1"],"result":""},{"caption":"Повтора нет: Сочетание студента и проекта ещё не занято","focus":["p2"],"result":""},{"caption":"Переход допустим: Решение применяется только из pending","focus":["p3"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Допустимость определяется текущим состоянием предметной области"}]}],"structural":true},"question":4,"id":"З3-С27","number":37,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":99,"startSeconds":3019,"transition":"","script":"Бизнес-правила описывают ограничения предметной области, а не синтаксис сообщения. Корректный JSON может содержать закрытый проект. Допустимый номер может ссылаться на уже занятую пару. Правильное слово accepted может прийти для заявки, по которой итог уже сохранён. Поэтому обработка проверяет текущее состояние и контекст операции. Не все правила используются в каждом запросе: открытый набор нужен созданию, а исходный статус — решению.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Набор открыт». Проект существует и принимает новые заявки. Второй блок обозначен «Мотивация допустима». Нормализованный текст имеет 50–1000 символов. Третий блок обозначен «Повтора нет». Сочетание студента и проекта ещё не занято. Четвёртый блок обозначен «Переход допустим». Решение применяется только из pending.\n\nТекущее состояние может измениться между чтением и записью. Это означает, что предварительное условие надо поддержать способом сохранения, а не только отдельным ранним запросом. Для повтора такую защиту даёт уникальная пара. Для перехода можно использовать условное обновление из pending с проверкой результата. Мы не разрабатываем большой код, но явно показываем, какое правило должно оставаться истинным.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Набор открыт: Проект существует и принимает новые заявки. 2. Мотивация допустима: Нормализованный текст имеет 50–1000 символов. 3. Повтора нет: Сочетание студента и проекта ещё не занято. 4. Переход допустим: Решение применяется только из pending.","wordCount":159,"pauseSeconds":8,"estimatedSeconds":95,"requiredWpm":105,"links":"webinar-3, Обработка на сервере; учебные правила проекта"},{"title":"Обработка отказов","body":"Неправильный путь завершается без недопустимой записи","visual":{"type":"table","columns":["Причина","Код ответа","Машинная причина"],"rows":[["Не подтверждён вход","401","AUTH_REQUIRED"],["Недостаточно прав","403","FORBIDDEN"],["Повтор","409","APPLICATION_EXISTS"],["Проект закрыт","409","PROJECT_CLOSED"],["Длина мотивации","422","MOTIVATION_LENGTH"]],"caption":""},"speech":"Отказ должен сохранять согласованное состояние. Если мотивация короткая, новая заявка не возникает. Если пара занята, существующая запись не дублируется. Если проект закрыт, отказ относится к новой подаче, а не к удалению старых заявок. В таблице закреплены причины и формат результата для наших примеров. Числовые коды соответствуют общей семантике HTTP, машинные имена являются договором именно этого сервиса.","explanation":"Неожиданный технический сбой рассматривается отдельно. Его нельзя выдавать за недопустимую мотивацию или отсутствие права. Подмена причины заставит пользователя исправлять то, что не связано с проблемой. Внутренние сведения помогают сопровождению, а внешний ответ должен оставаться понятным. После любого отказа интерфейс выбирает состояние по согласованной причине, сохраняет полезный ввод и не утверждает неподтверждённый успех.","hint":"Не представляйте имена ошибок как стандартные имена HTTP.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":4,"id":"З3-С28","number":38,"blockTitle":"Обработка на сервере","blockIndex":3,"plannedSeconds":109,"startSeconds":3118,"transition":"","script":"Отказ должен сохранять согласованное состояние. Если мотивация короткая, новая заявка не возникает. Если пара занята, существующая запись не дублируется. Если проект закрыт, отказ относится к новой подаче, а не к удалению старых заявок. В таблице закреплены причины и формат результата для наших примеров. Числовые коды соответствуют общей семантике HTTP, машинные имена являются договором именно этого сервиса.\n\nСопоставим записи в таблице. В строке 1 причина: Не подтверждён вход. код ответа: 401. машинная причина: AUTH_REQUIRED. В строке 2 причина: Недостаточно прав. код ответа: 403. машинная причина: FORBIDDEN. В строке 3 причина: Повтор. код ответа: 409. машинная причина: APPLICATION_EXISTS. В строке 4 причина: Проект закрыт. код ответа: 409. машинная причина: PROJECT_CLOSED. В строке 5 причина: Длина мотивации. код ответа: 422. машинная причина: MOTIVATION_LENGTH.\n\nНеожиданный технический сбой рассматривается отдельно. Его нельзя выдавать за недопустимую мотивацию или отсутствие права. Подмена причины заставит пользователя исправлять то, что не связано с проблемой. Внутренние сведения помогают сопровождению, а внешний ответ должен оставаться понятным. После любого отказа интерфейс выбирает состояние по согласованной причине, сохраняет полезный ввод и не утверждает неподтверждённый успех.\n\n","visualDescription":"Таблица. Столбцы: Причина; Код прямой ссылке. Проверка роли действует на сервере независимо от того, какие кнопки показал браузер.\n\nТретий вариант: Анна определена правильно, но проект уже не принимает обращения. Корректный текст мотивации не отменяет состояние проекта. Четвёртый вариант: набор открыт, но заявка этой пары уже существует. В каждом случае отказ имеет свою причину и понятный результат для интерфейса. Порядок проверок влияет на то, какие сведения система раскрывает, поэтому его выбирают осмысленно. При успешном пути сервер подставляет доверенные значения, сохраняет согласованную запись и формирует ответ. Проверка в браузере помогает человеку исправить простые ошибки раньше. Серверные правила обеспечивают результат при любом способе отправки, включая вторую вкладку и подготовленный вручную запрос.","hint":"Отметьте подтверждение базы перед ответом. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"learning":{"id":"explain-3-29","catalog":"Свободная схема","title":"Формирование успешного ответа","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Сохранение завершилось","text":"Получен номер созданной заявки"},{"title":"Собраны допустимые поля","text":"id, project_id, student_id и status"},{"title":"Отправлен ответ","text":"201 Created с сокращённым представлением"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Подтверждение опирается на результат сохранения","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Сохранение завершилось: Получен номер созданной заявки","focus":["p0"],"result":""},{"caption":"Собраны допустимые поля: id, project_id, student_id и status","focus":["p1"],"result":""},{"caption":"Отправлен ответ: 201 Created с сокращ ет существование связанного объекта, обязательность запрещает отсутствие значения. Уникальная пара выражает правило повтора, список статусов — допустимый словарь. Ни одно из этих ограничений в одиночку не заменяет весь договор заявки. Таблица специально показывает и границу каждого средства. Это помогает не приписывать базе проверку, которую мы фактически не описали.","explanation":"Некоторые правила можно дополнительно выразить в самой базе, если это оправдано архитектурой. В нашем объяснении важно распределить ответственность явно: обработчик проверяет пользователя и условия, а база поддерживает структурные ограничения. Если изменить это распределение в реализации, потребуется сохранить тот же наблюдаемый результат. Мы не делаем из выбранного учебного варианта универсальное требование ко всем системам.","hint":"Читайте третий столбец вместе со вторым.","sources":["https://www.postgresql.org/docs/current/ddl-constraints.html"],"question":5,"id":"З3-С33","number":45,"blockTitle":"Работа с базой","blockIndex":4,"plannedSeconds":120,"startSeconds":3726,"transition":"","script":"Ограничения дополняют друг друга. Первичный ключ отличает строку, внешний поддерживает существование связанного объекта, обязательность запрещает отсутствие значения. Уникальная пара выражает правило повтора, список статусов — допустимый словарь. Ни одно из этих ограничений в одиночку не заменяет весь договор заявки. Таблица специально показывает и границу каждого средства. Это помогает не приписывать базе проверку, которую мы фактически не описали.\n\nСопоставим записи в таблице. В строке 1 ограничение: PRIMARY KEY. что предотвращает: Повтор ключа строки. чего не доказывает: Право пользователя. В строке 2 ограничение: FOREIGN KEY. что предотвращает: Ссылку на отсутствующую запись. чего не доказывает: Нужную роль пользователя. В строке 3 ограничение: NOT NULL. что предотвращает: Отсутствие обязательного значения. чего не доказывает: Допустимую длину текста. В строке 4 ограничение: UNIQUE пары. занимает уникальную пару.","focus":["insert"],"result":""},{"caption":"Вкладка Б: COMMIT подтверждён.","focus":["commit"],"result":""},{"caption":"Другая вкладка: UNIQUE отклоняет повтор той же пары.","focus":["conflict"],"result":"Одна запись; победитель 201; другая попытка 409 APPLICATION_EXISTS"}]}],"structural":false},"question":5,"id":"З3-С34","number":46,"blockTitle":"Работа с базой","blockIndex":4,"plannedSeconds":117,"startSeconds":3846,"transition":"","script":"Рассмотрим две почти одновременные попытки Анны. До добавления обе могут прочитать, что заявки ещё нет. Поэтому логика «сначала проверить отсутствие, затем вставить» сама по себе не гарантирует единственность. Между этими действиями другой запрос успевает изменить состояние. Отключение кнопки в одной вкладке тоже не управляет другой. Необходима защита согласованного сохранения, которая удерживает правило при конкурирующих обращениях.\n\nНа схеме разберём исходные данные: Обе вкладки: student_id=12, project_id=17. Обе успели прочитать отсутствие заявки. Обзор: два обработчика могут пройти предварительное чтение.  Обе предварительные проверки: пары ещё нет.  Вкладка А: INSERT занимает уникальную пару.  Вкладка А: COMMIT подтверждён.  Другая вкладка: UNIQUE отклоняет повтор той же пары. Одна запись; победитель 201; другая попытка 409 APPLICATION_EXISTS Изменим условие. Обе вкладки: student_id=12, project_id=17. Обе успели прочитать отсутствие заявки. Одна запись; победитель 201; другая попытка 409 APPLICATION_EXISTS\n\nНа подготовленной временной таблице одна попытка сохраняет пару первой. Другая не создаёт второй строки и получает договорённый конфликт. Мы не утверждаем, что всегда победит вкладка А: буквы обозначают возможный порядок учебного примера. Важно свойство результата — одна запись на пару. Следующий слайд покажет, как интерфейс должен понять этот конфликт без ложного сообщения о потере данных.\n\n","visualDescription":"Таблица. Столбцы: Момент; Вкладка А; Вкладка Б. Строка 1: 1; Проверка: заявки нет; Проверка: заявки нет. Строка 2: 2; Начинает добавление; Тоже начинает добавление. Строка 3: 3; Сохраняет пару 12 и 17; Встречает ограничение той же пары. Строка 4: 4; Получает успех; Получает конфликт повтора.","wordCount":191,"pauseSeconds":8,"estimatedSeconds":112,"requiredWpm":105,"links":"webinar-3, Работа с базой; учебные правила проекта"},{"title":"Уникальная пара при конкуренции","body":"Один результат создания, один понятный конфликт","visual":{"type":"process","items":[{"title":"Первая фиксация","text":"Пара student_id 12 и project_id 17 занята"},{"title":"Следующая попытка","text":"База не допускает вторую такую комбинацию"},{"title":"Ответ клиенту","text":"409 APPLICATION_EXISTS и переход к своим заявкам"}]},"speech":"Составное ограничение проверяет комбинацию при сохранении. Оно защищает правило даже тогда, когда предварительное чтение уже устарело. Сервер должен обработать ожидаемый конфликт и вернуть APPLICATION_EXISTS. Для Анны это означает, что на данный проект уже есть обращение. Она может открыть свои заявки и увидеть сохранённую запись. Повтор не превращается в независимое второе участие и не меняет мотивацию существующей заявки без отдельного правила.","explanation":"Полезно отличать идемпотентное повторение от просто защищённой уникальности. Наш POST при повторе возвращает конфликт, а не обязательно тот же успешный ответ. Мы не вводили отдельный ключ идемпотентности. Согласованный механизм состоит из одной заявки на пару и понятной проверки результата через свой список. Этого достаточно для объяснения учебного случая без незаметного добавления новой инфраструктуры.","hint":"Идемпотентность здесь упомянута только для ограничения вывода. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":["https://www.postgresql.org/docs/current/ddl-constraints.html"],"learning":{"id":"explain-3-35","catalog":"Свободная схема","title":"Уникальная пара при конкуренции","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Первая фиксация","text":"Пара student_id 12 и project_id 17 занята"},{"title":"Следующая попытка","text":"База не допускает вторую такую комбинацию"},{"title":"Ответ клиенту","text":"409 APPLICATION_EXISTS и переход к своим заявкам"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Один результат создания, один понятный конфликт","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Первая фиксация: Пара student_id 12 и project_id 17 занята","focus":["p0"],"result":""},{"caption":"Следующая попытка: База не допускает вторую такую комбинацию","focus":["p1"],"result":""},{"caption":"Ответ клиенту: 409 APPLICATION_EXISTS и переход к своим заявкам","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Один результат создания, один понятный конфликт"}]}],"structural":true},"question":5,"id":"З3-С35","number":47,"blockTitle":"Работа с базой","blockIndex":4,"plannedSeconds":97,"startSeconds":3963,"transition":"","script":"Составное ограничение проверяет комбинацию при сохранении. Оно защищает правило даже тогда, когда предварительное чтение уже устарело. Сервер должен обработать ожидаемый конфликт и вернуть APPLICATION_EXISTS. Для Анны это означает, что на данный проект уже есть обращение. Она может открыть свои заявки и увидеть сохранённую запись. Повтор не превращается в независимое второе участие и не меняет мотивацию существующей заявки без отдельного правила.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Первая фиксация». Пара student_id 12 и project_id 17 занята. Второй блок обозначен «Следующая попытка». База не допускает вторую такую комбинацию. Третий блок обозначен «Ответ клиенту». 409 APPLICATION_EXISTS и переход к своим заявкам.\n\nПолезно отличать идемпотентное повторение от просто защищённой уникальности. Наш POST при повторе возвращает конфликт, а не обязательно тот же успешный ответ. Мы не вводили отдельный ключ идемпотентности. Согласованный механизм состоит из одной заявки на пару и понятной проверки результата через свой список. Этого достаточно для объяснения учебного случая без незаметного добавления новой инфраструктуры.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Первая фиксация: Пара student_id 12 и project_id 17 занята. 2. Следующая попытка: База не допускает вторую такую комбинацию. 3. Ответ клиенту: 409 APPLICATION_EXISTS и переход к своим заявкам.","wordCount":156,"pauseSeconds":8,"estimatedSeconds":93,"requiredWpm":105,"links":"webinar-3, Работа с базой; учебные правила проекта"},{"title":"Транзакция","body":"Связанное изменение завершается целиком или отменяется","visual":{"type":"process","items":[{"title":"Начало","text":"Выделить связанные операции изменения"},{"title":"Проверки и запись","text":"Выполнить действия в согласованной единице работы"},{"title":"Завершение","text":"Подтвердить изменения либо отменить при отказе"}]},"speech":"Транзакция объединяет действия с данными в единицу работы. При успешном завершении изменения фиксируются, при отказе могут быть отменены. Это помогает не оставлять частичный результат там, где шаги должны быть согласованы. Даже одна команда изменения выполняется в транзакционном контексте. Если операция включает несколько зависимых записей, их граница должна быть определена явно. Мы используем понятие, чтобы объяснить момент подтверждения сохранения.","explanation":"Обычная транзакция сама по себе не означает, что любые два запроса перестали конкурировать. Итог зависит от ограничений, способа проверки и уровня изоляции. В нашем случае уникальная пара остаётся необходимым правилом. Для согласования закрытия проекта и подачи реализация также должна определять конкурентное поведение, например через блокировку нужной строки в общей дисциплине изменений. Мы не обещаем все эти свойства одним словом «транзакция».","hint":"Разделите атомарность и защиту от любого конкурентного изменения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Сравните условия и результаты всех сценариев. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":["https://www.postgresql.org/docs/current/tutorial-transactions.html"],"notebook":"Транзакция — единица работы с данными, изменения которой фиксируются вместе либо отменяются.","learning":{"id":"transaction","catalog":"OPS-01","title":"Закрытие проекта и подача","kind":"sequence","data":{"actors":["Подача","Закрытие","База"],"note":"Оба обработчика используют блокировку одной строки projects. Это явно выбранная дисциплина реализации."},"scenarios":[{"label":"Сначала подача","input":"Подача первой блокирует projects.id=17; проект ещё открыт.","frames":[{"caption":"Обзор: BEGIN сам по себе не устраняет гонку.","focus":[],"result":""},{"caption":"Подача: SELECT ... FOR UPDATE блокирует строку проекта.","focus":["lock"],"result":""},{"caption":"Подача проверяет is_open=true и вставляет заявку.","focus":["insert"],"result":""},{"caption":"COMMIT подачи; затем закрытие получает блокировку и меняет is_open=false.","focus":["commit"],"result":"Заявка сохранена до закрытия; будущие подачи запрещены."}]},{"label":"Сначала закрытие","input":"Закрытие первым блокирует ту же строку и фиксирует is_open=false.","frames":[{"caption":"Обзор: порядок определяется получением блокировки.","focus":[],"result":""},{"caption":"Закрытие: UPDATE projects SET is_open=false; COMMIT.","focus":["close"],"result":""},{"caption":"Подача получает блокировку и читает уже закрытый проект.","focus":["lock"],"result":""},{"caption":"Условие is_open ложно: INSERT не выполняется.","focus":["reject"],"result":"409 PROJECT_CLOSED · новой заявки нет"}]}],"structural":false},"question":5,"id":"З3-С36","number":48,"blockTitle":"Работа с базой","blockIndex":4,"plannedSeconds":118,"startSeconds":4060,"transition":"","script":"Транзакция объединяет действия с данными в единицу работы. При успешном завершении изменения фиксируются, при отказе могут быть отменены. Это помогает не оставлять частичный результат там, где шаги должны быть согласованы. Даже одна команда изменения выполняется в транзакционном контексте. Если операция включает несколько зависимых записей, их граница должна быть определена явно. Мы используем понятие, чтобы объяснить момент подтверждения сохранения.\n\nНа схеме разберём исходные данные: Подача первой блокирует projects.id=17; проект ещё открыт. Обзор: BEGIN сам по себе не устраняет гонку.  Подача: SELECT ... FOR UPDATE блокирует строку проекта.  Подача проверяет is_open=true и вставляет заявку.  COMMIT подачи; затем закрытие получает блокировку и меняет is_open=false. Заявка сохранена до закрытия; будущие подачи запрещены. Изменим условие. Закрытие первым блокирует ту же строку и фиксирует is_open=false. 409 PROJECT_CLOSED · новой заявки нет\n\nОбычная транзакция сама по себе не означает, что любые два запроса перестали конкурировать. Итог зависит от ограничений, способа проверки и уровня изоляции. В нашем случае уникальная пара остаётся необходимым правилом. Для согласования закрытия проекта и подачи реализация также должна определять конкурентное поведение, например через блокировку нужной строки в общей дисциплине изменений. Мы не обещаем все эти свойства одним словом «транзакция».\n\n","visualDescription":"Последовательность подписанных блоков. 1. Начало: Выделить связанные операции изменения. 2. Проверки и запись: Выполнить действия в согласованной единице работы. 3. Завершение: Подтвердить изменения либо отменить при отказе.","wordCount":192,"pauseSeconds":8,"estimatedSeconds":113,"requiredWpm":105,"links":"webinar-3, Работа с базой; учебные правила проекта"},{"title":"Сохранение перед подтверждением","body":"Успешный ответ следует за фиксацией результата","visual":{"type":"process","items":[{"title":"Изменение подготовлено","text":"Запись ещё относится к незавершённой работе"},{"title":"Изменение зафиксировано","text":"Система получила подтверждение завершения"},{"title":"Ответ отправлен","text":"Клиент может показать успешную подачу"}]},"speech":"COMMIT, фиксация транзакции, подтверждает завершение связанных изменений. До этого момента нельзя честно обещать клиенту устойчивый результат. Если обработка отправит успех, а затем не сможет завершить запись, Анна получит ложное подтверждение. Поэтому порядок на схеме принципиален: сначала согласованное сохранение, затем успешный ответ. В учебном примере только после этого заявка получает подтверждённый номер сто четыре для представления пользователю.","explanation":"Но даже правильный порядок не гарантирует доставку ответа. Связь может оборваться после фиксации. Тогда система хранит заявку, а браузер ещё не знает результата. Это не нарушение транзакции: проблема находится на следующем участке пути. Такой разбор позволяет отдельно понять состояние данных и состояние обмена. Теперь пройдём весь основной путь по шагам, применяя уже введённые понятия к одной заявке.\n\nПредставим два почти одновременных нажатия. Первый обработчик проверил отсутствие пары 12 и 17. Второй проверил то же самое до завершения первого. Если каждый ограничится чтением перед вставкой, оба могут попытаться добавить строку. Поэтому удобное предварительное сообщение о повторе дополняется ограничением уникальности в самой базе. Когда один запрос сохранит запись, второй не сможет сохранить ту же пару.\n\nОбработчик должен превратить такой результат в предусмотренный договором отказ. Пользователь получает объяснение повтора, а не внутреннее название ограничения базы. Дополнительная запись при этом не появляется. Успешный ответ отправляют после подтверждённого сохранения. Если приложение сообщило успех раньше, последующий отказ базы сделал бы подтверждение ложным. Для нескольких связанных изменений транзакция задаёт общий результат: изменения либо фиксируются вместе, либо не оставляют частично выполненную операцию. Но транзакция не устраняет все задачи проектирования автоматически. Правила конкуренции, условия обновления статуса и обработку ошибок всё равно нужно определить. В учебном разборе мы связываем каждый механизм с конкретным нежелательным результатом, который он должен предотвращать.","hint":"COMMIT — «коммит», фиксация изменений. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":["https://www.postgresql.org/docs/current/tutorial-transactions.html"],"learning":{"id":"explain-3-37","catalog":"Свободная схема","title":"Сохранение перед подтверждением","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Изменение подготовлено","text":"Запись ещё относится к незавершённой работе"},{"title":"Изменение зафиксировано","text":"Система получила подтверждение завершения"},{"title":"Ответ отправлен","text":"Клиент может показать успешную подачу"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Успешный ответ следует за фиксацией результата","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Изменение подготовлено: Запись ещё относится к незавершённой работе","focus":["p0"],"result":""},{"caption":"Изменение зафиксировано: Система получила подтверждение завершения","focus":["p1"],"result":""},{"caption":"Ответ отправлен: Клиент может показать успешную подачу","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Успешный ответ следует за фиксацией результата"}]}],"structural":true},"question":5,"id":"З3-С37","number":49,"blockTitle":"Работа с базой","blockIndex":4,"plannedSeconds":185,"startSeconds":4178,"transition":"Следующий вопрос — путь заявки № 104. Пере
