ка 1: 12; 17; Первая заявка допустима. Строка 2: 12; 17; Повтор запрещён. Строка 3: 12; Другой проект; Отдельная заявка допустима.","wordCount":143,"pauseSeconds":8,"estimatedSeconds":86,"requiredWpm":107,"links":"webinar-1, Сценарии, права и состояния; учебные правила проекта"},{"title":"Закрытый проект","body":"Закрытие прекращает приём новых заявок","visual":{"type":"process","items":[{"title":"Открытый проект","text":"При выполнении остальных условий заявка создаётся"},{"title":"Закрытый проект","text":"Новая заявка не создаётся"},{"title":"Существующая заявка","text":"Сохраняется и остаётся доступной своему владельцу"}]},"speech":"Состояние проекта определяет возможность новой подачи. Если проект закрыт, система отказывает до создания заявки. При этом сохранённые обращения продолжают существовать. Наше правило не отменяет их и не назначает всем автоматический отказ. Это важное различие между состоянием проекта и состоянием отдельной заявки. На экране карточки можно показать отметку закрытого набора, но сервер всё равно должен проверить актуальное условие при обработке.","explanation":"Представим, что Анна открыла форму до закрытия проекта, а отправила её после. Ранее загруженный экран может содержать устаревшие сведения. Окончательное решение о допустимости новой заявки принимает обработка текущего состояния. Позже мы сопоставим этот случай с серверной проверкой и ожидаемым отказом.","hint":"Не обещайте автоматического изменения уже поданных заявок. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-32","catalog":"Свободная схема","title":"Закрытый проект","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Открытый проект","text":"При выполнении остальных условий заявка создаётся"},{"title":"Закрытый проект","text":"Новая заявка не создаётся"},{"title":"Существующая заявка","text":"Сохраняется и остаётся доступной своему владельцу"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Закрытие прекращает приём новых заявок","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Открытый проект: При выполнении остальных условий заявка создаётся","focus":["p0"],"result":""},{"caption":"Закрытый проект: Новая заявка не создаётся","focus":["p1"],"result":""},{"caption":"Существующая заявка: Сохраняется и остаётся доступной своему владельцу","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Закрытие прекращает приём новых заявок"}]}],"structural":true},"question":5,"id":"З1-С32","number":44,"blockTitle":"Сценарии, права и состояния","blockIndex":4,"plannedSeconds":83,"startSeconds":3726,"transition":"","script":"Состояние проекта определяет возможность новой подачи. Если проект закрыт, система отказывает до создания заявки. При этом сохранённые обращения продолжают существовать. Наше правило не отменяет их и не назначает всем автоматический отказ. Это важное различие между состоянием проекта и состоянием отдельной заявки. На экране карточки можно показать отметку закрытого набора, но сервер всё равно должен проверить актуальное условие при обработке.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Открытый проект». При выполнении остальных условий заявка создаётся. Второй блок обозначен «Закрытый проект». Новая заявка не создаётся. Третий блок обозначен «Существующая заявка». Сохраняется и остаётся доступной своему владельцу.\n\nПредставим, что Анна открыла форму до закрытия проекта, а отправила её после. Ранее загруженный экран может содержать устаревшие сведения. Окончательное решение о допустимости новой заявки принимает обработка текущего состояния. Позже мы сопоставим этот случай с серверной проверкой и ожидаемым отказом.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Открытый проект: При выполнении остальных условий заявка создаётся. 2. Закрытый проект: Новая заявка не создаётся. 3. Существующая заявка: Сохраняется и остаётся доступной своему владельцу.","wordCount":134,"pauseSeconds":8,"estimatedSeconds":81,"requiredWpm":107,"links":"webinar-1, Сценарии, права и состояния; учебные правила проекта"},{"title":"Права пользователей","body":"Студент видит своё, преподаватель рассматривает собственные проекты","visual":{"type":"table","columns":["Действие","Студент","Преподаватель"],"rows":[["Каталог проектов","Да","Не является обязательным сценарием"],["Свои заявки","Да","Нет роли студента в этом сценарии"],["Заявки на проект","Нет общего доступа","Только свой проект"],["Итоговое решение","Нет","Только свой проект"]],"caption":""},"speech":"Матрица прав связывает действие с ролью и дополнительным условием. Слова «преподавателю разрешено» недостаточно. Необходимо уточнить, что проект принадлежит именно этому преподавателю. Ирина может рассматривать обращения к проекту семнадцать, потому что отвечает за него. Другой преподаватель таким правом не обладает. Анна видит собственные заявки, но не получает полномочия принять свою заявку или читать мотивации других студентов.","explanation":"В таблице отсутствие обязательного сценария отличается от универсального технического запрета. Мы описываем согласованную первую версию. На сервере для защищённых операций понадобятся и роль, и проверка принадлежности. Сокрытие кнопки помогает интерфейсу, но не заменяет этих правил. Подробную последовательность проверок рассмотрим отдельно.","hint":"Прочитайте условие «только свой проект» полностью.","sources":[],"question":5,"id":"З1-С33","number":45,"blockTitle":"Сценарии, права и состояния","blockIndex":4,"plannedSeconds":94,"startSeconds":3809,"transition":"","script":"Матрица прав связывает действие с ролью и дополнительным условием. Слова «преподавателю разрешено» недостаточно. Необходимо уточнить, что проект принадлежит именно этому преподавателю. Ирина может рассматривать обращения к проекту семнадцать, потому что отвечает за него. Другой преподаватель таким правом не обладает. Анна видит собственные заявки, но не получает полномочия принять свою заявку или читать мотивации других студентов.\n\nСопоставим записи в таблице. В строке 1 действие: Каталог проектов. студент: Да. преподаватель: Не является обязательным сценарием. В строке 2 действие: Свои заявки. студент: Да. преподаватель: Нет роли студента в этом сценарии. В строке 3 действие: Заявки на проект. студент: Нет общего доступа. преподаватель: Только свой проект. В строке 4 действие: Итоговое решение. студент: Нет. преподаватель: Только свой проект.\n\nВ таблице отсутствие обязательного сценария отличается от универсального технического запрета. Мы описываем согласованную первую версию. На сервере для защищённых операций понадобятся и роль, и проверка принадлежности. Сокрытие кнопки помогает интерфейсу, но не заменяет этих правил. Подробную последовательность проверок рассмотрим отдельно.\n\n","visualDescription":"Таблица. Столбцы: Действие; Студент; Преподаватель. Строка 1: Каталог проектов; Да; Не является обязательным сценарием. Строка 2: Свои заявки; Да; Нет роли студента в этом сценарии. Строка 3: Заявки на проект; Нет общего доступа; Только свой проект. Строка 4: Итоговое решение; Нет; Только свой проект.","wordCount":154,"pauseSeconds":8,"estimatedSeconds":92,"requiredWpm":107,"links":"webinar-1, Сценарии, права и состояния; учебные правила проекта"},{"title":"Состояния заявки","body":"Три согласованных значения имеют разные значения для пользователя","visual":{"type":"table","columns":["В данных","На экране","Смысл"],"rows":[["pending","На рассмотрении","Решение ещё не принято"],["accepted","Одобрена","Преподаватель принял положительное решение"],["rejected","Отклонена","Преподаватель принял отрицательное решение"]],"caption":""},"speech":"Состояние заявки выражает этап её рассмотрения. После создания система назначает pending, на экране это «На рассмотрении». После положительного решения используется accepted, по-русски «Одобрена». После отрицательного решения — rejected, «Отклонена». Английские значения понадобятся для согласованных данных и API, то есть программного интерфейса обмена, который подробно введём на третьем занятии. Пользователь видит понятные русские подписи.","explanation":"Статусы не описывают сетевую загрузку страницы. Надпись «Отправляем заявку» означает работу интерфейса, а не четвёртое состояние заявки. До сохранения объект может вообще не существовать. Сохранение этого различия позволит корректно объяснить ошибки связи и повторную проверку результата.","hint":"Произношение: «пэндинг», «эксэптэд», «риджэктэд».","sources":[],"question":5,"id":"З1-С34","number":46,"blockTitle":"Сценарии, права и состояния","blockIndex":4,"plannedSeconds":84,"startSeconds":3903,"transition":"","script":"Состояние заявки выражает этап её рассмотрения. После создания система назначает pending, на экране это «На рассмотрении». После положительного решения используется accepted, по-русски «Одобрена». После отрицательного решения — rejected, «Отклонена». Английские значения понадобятся для согласованных данных и API, то есть программного интерфейса обмена, который подробно введём на третьем занятии. Пользователь видит понятные русские подписи.\n\nСопоставим записи в таблице. В строке 1 в данных: pending. на экране: На рассмотрении. смысл: Решение ещё не принято. В строке 2 в данных: accepted. на экране: Одобрена. смысл: Преподаватель принял положительное решение. В строке 3 в данных: rejected. на экране: Отклонена. смысл: Преподаватель принял отрицательное решение.\n\nСтатусы не описывают сетевую загрузку страницы. Надпись «Отправляем заявку» означает работу интерфейса, а не четвёртое состояние заявки. До сохранения объект может вообще не существовать. Сохранение этого различия позволит корректно объяснить ошибки связи и повторную проверку результата.\n\n","visualDescription":"Таблица. Столбцы: В данных; На экране; Смысл. Строка 1: pending; На рассмотрении; Решение ещё не принято. Строка 2: accepted; Одобрена; Преподаватель принял положительное решение. Строка 3: rejected; Отклонена; Преподаватель принял отрицательное решение.","wordCount":135,"pauseSeconds":8,"estimatedSeconds":82,"requiredWpm":107,"links":"webinar-1, Сценарии, права и состояния; учебные правила проекта"},{"title":"Допустимые переходы","body":"Из ожидания рассмотрения возможен один из двух итогов","visual":{"type":"diagram","nodes":["На рассмотрении","Одобрена","Отклонена"],"edges":[["На рассмотрении","Одобрена","Положительное решение"],["На рассмотрении","Отклонена","Отрицательное решение"]],"caption":""},"speech":"Из исходного состояния заявка переходит в одно из двух итоговых. На схеме нет обратных связей. Это отражает согласованное правило первой версии: повторное рассмотрение отсутствует. Преподаватель не может сначала одобрить заявку, затем через обычную кнопку изменить её на отклонённую. Если такая возможность понадобится, нужно будет отдельно описать полномочия, причины изменения и последствия для участников. Сейчас мы её не добавляем.","explanation":"Допустимый переход зависит и от текущего состояния, и от права исполнителя. Сам факт существования стрелки не разрешает Анне выполнить операцию. В нашем примере её выполняет Ирина для собственного проекта. При почти одновременных решениях сервер должен опираться на актуальное состояние, чтобы два действия не дали противоречивый итог.\n\nПроверим модель состояний на двух подготовленных случаях. В первом Ирина открыла ожидающую заявку и одобрила её. Переход соответствует схеме. Во втором она возвращается к той же уже одобренной заявке и пытается отклонить её обычным действием. Такого перехода на схеме нет. Если продукту действительно понадобится пересмотр, потребуется новое правило: кто и при каких основаниях его выполняет, что видит студент и как сохраняется история. В первой версии эти вопросы не решены, поэтому функцию не добавляем.\n\nНаличие окончательного состояния не означает удаления записи. Анна продолжает видеть итог. Также закрытие проекта не является обратным переходом заявки. Оно ограничивает новые подачи и относится к другому объекту. Сопоставление этих случаев помогает читать схему как точный договор, а не как декоративное изображение с произвольными стрелками. Каждая нарисованная связь должна иметь основание в согласованном действии.","hint":"Покажите отсутствие обратных стрелок. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Сравните условия и результаты всех сценариев. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"states","catalog":"UML-10","title":"Решение по заявке","kind":"states","data":{"nodes":["На рассмотрении","Одобрена","Отклонена"],"edges":[[0,1,"одобрить [свой проект, pending]"],[0,2,"отклонить [свой проект, pending]"]]},"scenarios":[{"label":"Одобрить","input":"Ирина 7; свой проект 17; заявка 104: pending.","frames":[{"caption":"Вся модель: только два разрешённых перехода.","focus":[],"result":""},{"caption":"Пользователь и принадлежность проверены; исходное состояние pending.","focus":["n0"],"result":""},{"caption":"Событие: одобрить. Условие истинно; переход выполнен.","focus":["e0","n1"],"result":"accepted · 200 OK"}]},{"label":"Отклонить","input":"Ирина 7; свой проект 17; заявка 104: pending.","frames":[{"caption":"Вся модель: только два разрешённых перехода.","focus":[],"result":""},{"caption":"Пользователь и принадлежность проверены; исходное состояние pending.","focus":["n0"],"result":""},{"caption":"Событие: отклонить. Условие истинно; переход выполнен.","focus":["e1","n2"],"result":"rejected · 200 OK"}]},{"label":"Чужой проект","input":"Преподаватель 8 не отвечает за проект 17; исходный статус pending.","frames":[{"caption":"Событие решения требует проверки исполнителя.","focus":[],"result":""},{"caption":"teacher_id проекта = 7, пользователь = 8: условие ложно.","focus":["n0"],"result":"403 FORBIDDEN · перехода нет · pending"}]},{"label":"Повторное решение","input":"Ирина 7; свой проект 17; заявка уже accepted.","frames":[{"caption":"Начальное состояние этого случая: accepted.","focus":["n1"],"result":""},{"caption":"Событие: отклонить. Из accepted такого перехода нет.","focus":["n1"],"result":"409 INVALID_TRANSITION · accepted сохранён"}]}],"structural":false},"question":5,"id":"З1-С35","number":47,"blockTitle":"Сценарии, права и состояния","blockIndex":4,"plannedSeconds":185,"startSeconds":3987,"transition":"","script":"Из исходного состояния заявка переходит в одно из двух итоговых. На схеме нет обратных связей. Это отражает согласованное правило первой версии: повторное рассмотрение отсутствует. Преподаватель не может сначала одобрить заявку, затем через обычную кнопку изменить её на отклонённую. Если такая возможность понадобится, нужно будет отдельно описать полномочия, причины изменения и последствия для участников. Сейчас мы её не добавляем.\n\nНа схеме разберём исходные данные: Ирина 7; свой проект 17; заявка 104: pending. Вся модель: только два разрешённых перехода.  Пользователь и принадлежность проверены; исходное состояние pending.  Событие: одобрить. Условие истинно; переход выполнен. accepted · 200 OK Изменим условие. Ирина 7; свой проект 17; заявка 104: pending. rejected · 200 OK Преподаватель 8 не отвечает за проект 17; исходный статус pending. 403 FORBIDDEN · перехода нет · pending Ирина 7; свой проект 17; заявка уже accepted. 409 INVALID_TRANSITION · accepted сохранён\n\nДопустимый переход зависит и от текущего состояния, и от права исполнителя. Сам факт существования стрелки не разрешает Анне выполнить операцию. В нашем примере её выполняет Ирина для собственного проекта. При почти одновременных решениях сервер должен опираться на актуальное состояние, чтобы два действия не дали противоречивый итог.\n\nПроверим модель состояний на двух подготовленных случаях. В первом Ирина открыла ожидающую заявку и одобрила её. Переход соответствует схеме. Во втором она возвращается к той же уже одобренной заявке и пытается отклонить её обычным действием. Такого перехода на схеме нет. Если продукту действительно понадобится пересмотр, потребуется новое правило: кто и при каких основаниях его выполняет, что видит студент и как сохраняется история. В первой версии эти вопросы не решены, поэтому функцию не добавляем.\n\nНаличие окончательного состояния не означает удаления записи. Анна продолжает видеть итог. Также закрытие проекта не является обратным переходом заявки. Оно ограничивает новые подачи и относится к другому объекту. Сопоставление этих случаев помогает читать схему как точный договор, а не как декоративное изображение с произвольными стрелками. Каждая нарисованная связь должна иметь основание в согласованном действии.\n\n","visualDescription":"Схема. Блоки: На рассмотрении; Одобрена; Отклонена. Связи: На рассмотрении — Одобрена: Положительное решение; На рассмотрении — Отклонена: Отрицательное решение.","wordCount":307,"pauseSeconds":14,"estimatedSeconds":181,"requiredWpm":108,"links":"webinar-1, Сценарии, права и состояния; учебные правила проекта"},{"title":"Итоговые правила заявки","body":"Ограничения образуют согласованный договор проекта","visual":{"type":"table","columns":["Правило","Значение"],"rows":[["Мотивация","50–1000 символов включительно"],["Повтор","Одна заявка студента на проект"],["Приём","Только открытый проект"],["Решение","Своя заявка проекта преподавателя, исходное pending"],["Итог","accepted или rejected, без повторного рассмотрения"]],"caption":""},"speech":"Сведём правила, которые будут действовать во всех следующих материалах. Мотивационный текст имеет обе границы включительно. Одна заявка связывает одного студента и один проект. Закрытый проект новых заявок не принимает. Ирина изменяет статус только в рамках собственного проекта и только из исходного ожидания. Итоговые состояния завершают рассмотрение первой версии. Это единый договор учебного примера, а не универсальные правила всех образовательных сервисов.","explanation":"На следующих занятиях мы будем проверять эти же ограничения в разных представлениях. Поле формы объяснит границы текста. Схема данных покажет сочетание студента и проекта. Серверная обработка свяжет проверки с ответом. Такая последовательность помогает обнаружить противоречие раньше, чем оно превратится в поведение приложения.","hint":"Исправьте устно: решение относится к заявке на собственный проект.","sources":[],"question":5,"id":"З1-С36","number":48,"blockTitle":"Сценарии, права и состояния","blockIndex":4,"plannedSeconds":104,"startSeconds":4172,"transition":"Следующий вопрос — жизненный цикл. Решения проходят путь от выяснения задачи до изменения после запуска.","script":"Сведём правила, которые будут действовать во всех следующих материалах. Мотивационный текст имеет обе границы включительно. Одна заявка связывает одного студента и один проект. Закрытый проект новых заявок не принимает. Ирина изменяет статус только в рамках собственного проекта и только из исходного ожидания. Итоговые состояния завершают рассмотрение первой версии. Это единый договор учебного примера, а не универсальные правила всех образовательных сервисов.\n\nСопоставим записи в таблице. В строке 1 правило: Мотивация. значение: 50–1000 символов включительно. В строке 2 правило: Повтор. значение: Одна заявка студента на проект. В строке 3 правило: Приём. значение: Только открытый проект. В строке 4 правило: Решение. значение: Своя заявка проекта преподавателя, исходное pending. В строке 5 правило: Итог. значение: accepted или rejected, без повторного рассмотрения.\n\nНа следующих занятиях мы будем проверять эти же ограничения в разных представлениях. Поле формы объяснит границы текста. Схема данных покажет сочетание студента и проекта. Серверная обработка свяжет проверки с ответом. Такая последовательность помогает обнаружить противоречие раньше, чем оно превратится в поведение приложения.\n\nСледующий вопрос — жизненный цикл. Решения проходят путь от выяснения задачи до изменения после запуска.","visualDescription":"Таблица. Столбцы: Правило; Значение. Строка 1: Мотивация; 50–1000 символов включительно. Строка 2: Повтор; Одна заявка студента на проект. Строка 3: Приём; Только открытый проект. Строка 4: Решение; Своя заявка проекта преподавателя, исходное pending. Строка 5: Итог; accepted или rejected, без повторного рассмотрения.","wordCount":173,"pauseSeconds":8,"estimatedSeconds":102,"requiredWpm":108,"links":"webinar-1, Сценарии, права и состояния; учебные правила проекта"},{"supplemental":true,"question":5,"blockIndex":4,"blockTitle":"Сценарии, права и состояния","sources":[],"notebook":"","links":"webinar-1, Сценарии, права и состояния; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":49,"id":"З1-П5","title":"Практика: Полномочие и состояние","kind":"practice","visual":{"type":"practice"},"speech":"Применим понятия вопроса к новому учебному случаю. Учебный случай: заявка на консультацию 312 имеет статус rejected. Ответственный пытается одобрить её. Сначала запишите прогноз. Затем последовательно исследуйте факты: Исполнитель отвечает за консультацию. Текущий статус rejected. Модель разрешает решения только из pending. Выберите решение и объясните его. Обоснованный вывод: Оставить rejected и сообщить о недопустимом переходе. Принадлежность подтверждена, но rejected не входит в множество исходных состояний разрешённого решения. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","script":"Применим понятия вопроса к новому учебному случаю. Учебный случай: заявка на консультацию 312 имеет статус rejected. Ответственный пытается одобрить её. Сначала запишите прогноз. Затем последовательно исследуйте факты: Исполнитель отвечает за консультацию. Текущий статус rejected. Модель разрешает решения только из pending. Выберите решение и объясните его. Обоснованный вывод: Оставить rejected и сообщить о недопустимом переходе. Принадлежность подтверждена, но rejected не входит в множество исходных состояний разрешённого решения. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","hint":"Откройте дополнение в новой вкладке. Сначала запишите прогноз; затем исследуйте факты и обоснуйте решение.","visualDescription":"Учебный случай: заявка на консультацию 312 имеет статус rejected. Ответственный пытается одобрить её. Исполнитель отвечает за консультацию. Текущий статус rejected. Модель разрешает решения только из pending.","wordCount":86,"estimatedSeconds":67,"activity":{"id":"З1-П5","revision":1,"title":"Полномочие и состояние","task":"Учебный случай: заявка на консультацию 312 имеет статус rejected. Ответственный пытается одобрить её.","facts":["Исполнитель отвечает за консультацию.","Текущий статус rejected.","Модель разрешает решения только из pending."],"decision":"Какой итог сохраняет правило переходов?","options":["Изменить на accepted","Оставить rejected и сообщить о недопустимом переходе","Создать второй статус в браузере"],"answer":1,"explanation":"Принадлежность подтверждена, но rejected не входит в множество исходных состояний разрешённого решения.","check":"Сопоставьте каждый факт с правилом. Обоснуйте, почему остальные решения не подходят."},"plannedSeconds":0,"startSeconds":4276,"requiredWpm":0},{"supplemental":true,"question":5,"blockIndex":4,"blockTitle":"Сценарии, права и состояния","sources":[],"notebook":"","links":"webinar-1, Сценарии, права и состояния; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":50,"id":"З1-Т5","title":"Самопроверка · Вопрос 5","kind":"quiz","visual":{"type":"quiz"},"speech":"Проверим понимание вопроса. Преподаватель отвечает за проект, но заявка уже accepted. Можно отклонить её по исходной модели? Варианты: Да, роль разрешает всё; Нет: переход разрешён только из pending; Да, если скрыть кнопку. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Нет: переход разрешён только из pending. Полномочие и допустимый переход проверяются отдельно. Из accepted исходная модель не разрешает это решение. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","script":"Проверим понимание вопроса. Преподаватель отвечает за проект, но заявка уже accepted. Можно отклонить её по исходной модели? Варианты: Да, роль разрешает всё; Нет: переход разрешён только из pending; Да, если скрыть кнопку. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Нет: переход разрешён только из pending. Полномочие и допустимый переход проверяются отдельно. Из accepted исходная модель не разрешает это решение. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","hint":"Дайте аудитории выбрать вариант. Ответ и разбор показывайте отдельной командой.","visualDescription":"Преподаватель отвечает за проект, но заявка уже accepted. Можно отклонить её по исходной модели? Да, роль разрешает всё; Нет: переход разрешён только из pending; Да, если скрыть кнопку","wordCount":73,"estimatedSeconds":60,"quiz":{"id":"З1-Т5","revision":1,"prompt":"Преподаватель отвечает за проект, но заявка уже accepted. Можно отклонить её по исходной модели?","options":["Да, роль разрешает всё","Нет: переход разрешён только из pending","Да, если скрыть кнопку"],"answer":1,"explanation":"Полномочие и допустимый переход проверяются отдельно. Из accepted исходная модель не разрешает это решение."},"plannedSeconds":0,"startSeconds":4276,"requiredWpm":0},{"title":"Жизненный цикл","body":"Решения проходят путь от выяснения задачи до изменения после запуска","visual":{"type":"section","number":6,"title":"Жизненный цикл"},"speech":"Переходим к вопросу 6: жизненный цикл. Решения проходят путь от выяснения задачи до изменения после запуска. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":6,"id":"З1-С37","number":51,"blockTitle":"Жизненный цикл","blockIndex":5,"plannedSeconds":30,"startSeconds":4276,"transition":"","script":"Переходим к вопросу 6: жизненный цикл. Решения проходят путь от выяснения задачи до изменения после запуска. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 6: Жизненный цикл. Справа большая серая стрелка, направленная влево.","wordCount":38,"pauseSeconds":8,"estimatedSeconds":29,"requiredWpm":104,"links":"webinar-1, Жизненный цикл; учебные правила проекта"},{"title":"Этап анализа","body":"Результат анализа объясняет, зачем и для кого создают ресурс","visual":{"type":"pair","items":[{"title":"Жизненный цикл ресурса","visual":{"type":"process","items":[{"title":"Анализ","text":"Проблема, участники, правила и требования"},{"title":"Проектирование","text":"Экраны, данные и устройство решения"},{"title":"Разработка и проверка","text":"Реализация поведения и поиск несоответствий"},{"title":"Выпуск и сопровождение","text":"Доступ пользователям, наблюдение и улучшения"}]}},{"title":"Этап анализа","visual":{"type":"table","columns":["Вопрос","Результат для нашего проекта"],"rows":[["Какая проблема","Обращения расходятся между источниками"],["Кто использует","Студент и преподаватель"],["Какой результат нужен","Общее сохранённое обращение и понятный статус"],["Какие ограничения","Одна заявка, границы мотивации, свои проекты"]],"caption":""}}]},"speech":"Жизненный цикл описывает работу с ресурсом во времени. Сначала выясняют задачу, затем оформляют решение, реализуют и проверяют его. После выпуска работа продолжается: возникают изменения, ошибки и новые данные о потребностях. Эта схема не требует, чтобы команда делала каждый этап только один раз. Результаты проверки могут вернуть нас к требованиям. Важно понимать назначение работ и их результаты, а не запоминать единственную последовательность для всех проектов.\n\nДля «Проектного навигатора» изменение формы может затронуть модель данных и проверку. Поэтому результаты этапов должны оставаться связанными. Мы будем показывать конкретные носители решений: требования, макеты, договор обмена и памятку сопровождения. Они помогают передать смысл следующему участнику работы.\n\nНа этапе анализа мы отделяем наблюдаемую проблему от предполагаемого решения. Итог должен быть понятен участникам без чтения программы. Для учебного сервиса уже установлены роли, основные цели и ограничения. Если пропустить этот этап, разработчик может добросовестно сделать форму, которая отправляет письмо, хотя пользователю требовался доступный список заявок. Внешне работа будет похожа, а ожидаемый результат останется недостижимым.","explanation":"Анализ не завершается количеством заполненных страниц. Его качество видно по устранённым существенным неопределённостям. Мы знаем, что считается повтором, кто вправе принять решение и что происходит после закрытия проекта. Именно такие сведения позволяют дальше проектировать согласованные экраны и данные.\n\nРезультаты анализа передают следующему участнику так, чтобы он не восстанавливал замысел из случайных сообщений. Для «Проектного навигатора» это означает известные имена ролей, цель подачи, понятие повтора и признаки сохранения. Если разработчик спрашивает, может ли студент выбрать несколько проектов, ответ уже записан. Если дизайнер предлагает поле статуса в форме, можно показать распределение ответственности. Материалы работают как связанный набор решений.\n\nТакой набор не обязан быть огромным. Его объём определяется существенными вопросами. Десять повторений общей цели не заменят одного точного условия закрытого проекта. Поэтому в учебном комплекте мы меняем масштаб рассмотрения: сначала процесс, затем экран, затем данные и обработка. Новая детализация должна добавлять знание, а не возвращать преподавателя к самостоятельному придумыванию недостающего правила.","hint":"Не представляйте ленту как обязательную универсальную методологию. Сопоставляйте каждый вопрос с уже готовым результатом. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-38","catalog":"Свободная схема","title":"Этап анализа","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Жизненный цикл ресурса","visual":{"type":"process","items":[{"title":"Анализ","text":"Проблема, участники, правила и требования"},{"title":"Проектирование","text":"Экраны, данные и устройство решения"},{"title":"Разработка и проверка","text":"Реализация поведения и поиск несоответствий"},{"title":"Выпуск и сопровождение","text":"Доступ пользователям, наблюдение и улучшения"}]}},{"title":"Этап анализа","visual":{"type":"table","columns":["Вопрос","Результат для нашего проекта"],"rows":[["Какая проблема","Обращения расходятся между источниками"],["Кто использует","Студент и преподаватель"],["Какой результат нужен","Общее сохранённое обращение и понятный статус"],["Какие ограничения","Одна заявка, границы мотивации, свои проекты"]],"caption":""}}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Результат анализа объясняет, зачем и для кого создают ресурс","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Анализ: Проблема, участники, правила и требования","focus":["v0 г. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-39","catalog":"Свободная схема","title":"Этап проектирования","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Пользовательский путь","text":"Где Анна выбирает проект и видит результат"},{"title":"Модель данных","text":"Как связаны пользователь, проект и заявка"},{"title":"Обработка","text":"Кто проверяет правила и сохраняет изменения"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Решения связывают требования с интерфейсом и данными","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Пользовательский путь: Где Анна выбирает проект и видит результат","focus":["p0"],"result":""},{"caption":"Модель данных: Как связаны пользователь, проект и заявка","focus":["p1"],"result":""},{"caption":"Обработка: Кто проверяет правила и сохраняет изменения","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Решения связывают требования с интерфейсом и данными"}]}],"structural":true},"question":6,"id":"З1-С39","number":53,"blockTitle":"Жизненный цикл","blockIndex":5,"plannedSeconds":81,"startSeconds":4552,"transition":"","script":"Проектирование преобразует требования в решения, по которым можно создать ресурс. Для Анны определим набор экранов и обратную связь. Для хранения сведений выберем структуру связанных записей. Для обработки опишем ответственность частей приложения. Решения должны поддерживать один сценарий. Например, если макет показывает дату подачи, необходимо определить, откуда эта дата появляется. Нельзя просто добавить красивую строку без источника значения.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Пользовательский путь». Где Анна выбирает проект и видит результат. Второй блок обозначен «Модель данных». Как связаны пользователь, проект и заявка. Третий блок обозначен «Обработка». Кто проверяет правила и сохраняет изменения.\n\nНа этом этапе допустимы варианты. Можно сравнить два расположения сообщения об ошибке или два способа навигации. Выбор объясняют задачей пользователя и ограничениями. На втором занятии мы пройдём такой путь для формы заявки и получим готовую модель данных.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Пользовательский путь: Где Анна выбирает проект и видит результат. 2. Модель данных: Как связаны пользователь, проект и заявка. 3. Обработка: Кто проверяет правила и сохраняет изменения.","wordCount":130,"pauseSeconds":8,"estimatedSeconds":79,"requiredWpm":107,"links":"webinar-1, Жизненный цикл; учебные правила проекта"},{"title":"Этап разработки","body":"Программа реализует согласованные правила и представления","visual":{"type":"process","items":[{"title":"Интерфейс","text":"Показывает каталог, форму и состояния"},{"title":"Обработка на сервере","text":"Проверяет пользователя и бизнес-правила"},{"title":"Работа с данными","text":"Сохраняет заявку и решение преподавателя"}]},"speech":"На этапе разработки проектные решения превращают в исполняемую программу. Разные части могут создавать разные специалисты, но правила остаются общими. Если интерфейс допускает текст до тысячи символов, а сервер принимает только пятьсот, пользователю достанется противоречие. Если база хранит произвольные статусы, обработка может получить неподдерживаемое значение. Поэтому реализация должна опираться на согласованный договор.","explanation":"В лекциях не требуется писать программу в прямом эфире. Вместо этого на третьем занятии увидим подготовленные запросы, ответы и последовательность обработки. Такой формат позволяет разобрать причинную связь каждого шага, не тратя время на настройку инструментов и исправление опечаток.","hint":"Не запускайте обязательную демонстрацию программирования. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-40","catalog":"Свободная схема","title":"Этап разработки","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Интерфейс","text":"Показывает каталог, форму и состояния"},{"title":"Обработка на сервере","text":"Проверяет пользователя и бизнес-правила"},{"title":"Работа с данными","text":"Сохраняет заявку и решение преподавателя"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Программа реализует согласованные правила и представления","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Интерфейс: Показывает каталог, форму и состояния","focus":["p0"],"result":""},{"caption":"Обработка на сервере: Проверяет пользователя и бизнес-правила","focus":["p1"],"result":""},{"caption":"Работа с данными: Сохраняет заявку и решение преподавателя","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Программа реализует согласованные правила и представления"}]}],"structural":true},"question":6,"id":"З1-С40","number":54,"blockTitle":"Жизненный цикл","blockIndex":5,"plannedSeconds":77,"startSeconds":4633,"transition":"","script":"На этапе разработки проектные решения превращают в исполняемую программу. Разные части могут создавать разные специалисты, но правила остаются общими. Если интерфейс допускает текст до тысячи символов, а сервер принимает только пятьсот, пользователю достанется противоречие. Если база хранит произвольные статусы, обработка может получить неподдерживаемое значение. Поэтому реализация должна опираться на согласованный договор.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Интерфейс». Показывает каталог, форму и состояния. Второй блок обозначен «Обработка на сервере». Проверяет пользователя и бизнес-правила. Третий блок обозначен «Работа с данными». Сохраняет заявку и решение преподавателя.\n\nВ лекциях не требуется писать программу в прямом эфире. Вместо этого на третьем занятии увидим подготовленные запросы, ответы и последовательность обработки. Такой формат позволяет разобрать причинную связь каждого шага, не тратя время на настройку инструментов и исправление опечаток.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Интерфейс: Показывает каталог, форму и состояния. 2. Обработка на сервере: Проверяет пользователя и бизнес-правила. 3. Работа с данными: Сохраняет заявку и решение преподавателя.","wordCount":123,"pauseSeconds":8,"estimatedSeconds":75,"requiredWpm":107,"links":"webinar-1, Жизненный цикл; учебные правила проекта"},{"title":"Этап проверки","body":"Согласованные условия сопоставляют с поведением реализации","visual":{"type":"table","columns":["Условие","Ожидаемый результат"],"rows":[["Анна подаёт допустимую первую заявку","Появляется одна запись pending"],["Анна повторяет подачу","Вторая запись не возникает"],["Другой преподаватель меняет решение","Система отказывает"]],"caption":""},"speech":"Проверка связывает требование с наблюдаемым поведением программы. Сначала задают исходные условия, затем выполняют действие и сравнивают результат с ожидаемым. Ожидаемый результат выводится из правил проекта. Фактический результат получают только при выполнении проверки на реализации. На этом слайде мы показываем подготовленные ожидания. Мы ещё не утверждаем, что действующее приложение успешно прошло эти проверки.","explanation":"Разница между ожиданием и наблюдением существенна для доверия к отчёту. Заполненная таблица сама по себе ничего не доказывает о работающей программе. На четвёртом занятии разберём виды проверок, границы длины и оформление несоответствий. Сейчас фиксируем место проверки в жизненном цикле и её связь с требованиями.\n\nПроверка может обнаружить ошибку не только в программе, но и в самом описании. Например, одно требование разрешает заявки на разные проекты, а другое запрещает студенту больше одной заявки вообще. Программа не сможет одновременно выполнить оба условия. Такое противоречие нужно устранить до оценки реализации. Поэтому подготовка проверок является способом уточнения проектных решений. Она заставляет явно назвать исходную ситуацию и ожидаемый результат.\n\nЕсли ожидания различаются у участников, недостаточно выбрать более удобную реализацию и объявить её правильной. Нужно вернуться к цели и согласовать правило. В нашем курсе источник уже фиксирует одну заявку на конкретный проект, поэтому неоднозначность снимается этой формулировкой. На четвёртом занятии мы покажем, как то же решение превращается в позитивный, негативный и конкурентный случаи. Пока отмечаем, почему проверка относится ко всему жизненному циклу.","hint":"Явно назовите таблицу ожидаемыми результатами.","sources":[],"question":6,"id":"З1-С41","number":55,"blockTitle":"Жизненный цикл","blockIndex":5,"plannedSeconds":154,"startSeconds":4710,"transition":"","script":"Проверка связывает требование с наблюдаемым поведением программы. Сначала задают исходные условия, затем выполняют действие и сравнивают результат с ожидаемым. Ожидаемый результат выводится из правил проекта. Фактический результат получают только при выполнении проверки на реализации. На этом слайде мы показываем подготовленные ожидания. Мы ещё не утверждаем, что действующее приложение успешно прошло эти проверки.\n\nСопоставим записи в таблице. В строке 1 условие: Анна подаёт допустимую первую заявку. ожидаемый результат: Появляется одна запись pending. В строке 2 условие: Анна повторяет подачу. ожидаемый результат: Вторая запись не возникает. В строке 3 условие: Другой преподаватель меняет решение. ожидаемый результат: Система отказывает.\n\nРазница между ожиданием и наблюдением существенна для доверия к отчёту. Заполненная таблица сама по себе ничего не доказывает о работающей программе. На четвёртом занятии разберём виды проверок, границы длины и оформление несоответствий. Сейчас фиксируем место проверки в жизненном цикле и её связь с требованиями.\n\nПроверка может обнаружить ошибку не только в программе, но и в самом описании. Например, одно требование разрешает заявки на разные проекты, а другое запрещает студенту больше одной заявки вообще. Программа не сможет одновременно выполнить оба условия. Такое противоречие нужно устранить до оценки реализации. Поэтому подготовка проверок является способом уточнения проектных решений. Она заставляет явно назвать исходную ситуацию и ожидаемый результат.\n\nЕсли ожидания различаются у участников, недостаточно выбрать более удобную реализацию и объявить её правильной. Нужно вернуться к цели и согласовать правило. В нашем курсе источник уже фиксирует одну заявку на конкретный проект, поэтому неоднозначность снимается этой формулировкой. На четвёртом занятии мы покажем, как то же решение превращается в позитивный, негативный и конкурентный случаи. Пока отмечаем, почему проверка относится ко всему жизненному циклу.\n\n","visualDescription":"Таблица. Столбцы: Условие; Ожидаемый результат. Строка 1: Анна подаёт допустимую первую заявку; Появляется одна запись pending. Строка 2: Анна повторяет подачу; Вторая запись не возникает. Строка 3: Другой преподаватель меняет решение; Система отказывает.","wordCount":262,"pauseSeconds":8,"estimatedSeconds":151,"requiredWpm":108,"links":"webinar-1, Жизненный цикл; учебные правила проекта"},{"title":"Развёртывание","body":"Подготовленная версия становится доступна в рабочей среде","visual":{"type":"process","items":[{"title":"Подготовка","text":"Настройки приложения и доступ к хранилищу"},{"title":"Публикация","text":"Запуск выбранной версии по рабочему адресу"},{"title":"Подтверждение","text":"Проверка доступности и основного пути заявки"}]},"speech":"Развёртывание означает размещение и запуск подготовленной версии в среде, где ею будут пользоваться. На компьютере разработчика программа может работать с отдельными учебными данными. Рабочая среда имеет собственные настройки и хранилище. Поэтому простое копирование файлов не гарантирует готовности. Нужно убедиться, что компоненты связаны и основные действия доступны. Подробный порядок выпуска рассмотрим вместе с инфраструктурой на третьем занятии.","explanation":"Для проектирования важно заранее знать условия использования. Если ресурс должен работать через браузер по общему адресу, эта потребность влияет на размещение. Однако мы не выбираем конкретного поставщика только по названию этапа. Устройство и стоимость соотносят с объёмом задачи и возможностями сопровождения.","hint":"Произношение слова «развёртывание» не требует англоязычного сокращения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-42","catalog":"Свободная схема","title":"Развёртывание","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Подготовка","text":"Настройки приложения и доступ к хранилищу"},{"title":"Публикация","text":"Запуск выбранной версии по рабочему адресу"},{"title":"Подтверждение","text":"Проверка доступности и основного пути заявки"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Подготовленная версия становится доступна в рабочей среде","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Подготовка: Настройки приложения и доступ к хранилищу","focus":["p0"],"result":""},{"caption":"Публикация: Запуск выбранной версии по рабочему адресу","focus":["p1"],"result":""},{"caption":"Подтверждение: Проверка доступности и основного пути заявки","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Подготовленная версия становится доступна в рабочей среде"}]}],"structural":true},"question":6,"id":"З1-С42","number":56,"blockTitle":"Жизненный цикл","blockIndex":5,"plannedSeconds":81,"startSeconds":4864,"transition":"","script":"Развёртывание означает размещение и запуск подготовленной версии в среде, где ею будут пользоваться. На компьютере разработчика программа может работать с отдельными учебными данными. Рабочая среда имеет собственные настройки и хранилище. Поэтому простое копирование файлов не гарантирует готовности. Нужно убедиться, что компоненты связаны и основные действия доступны. Подробный порядок выпуска рассмотрим вместе с инфраструктурой на третьем занятии.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Подготовка». Настройки приложения и доступ к хранилищу. Второй блок обозначен «Публикация». Запуск выбранной версии по рабочему адресу. Третий блок обозначен «Подтверждение». Проверка доступности и основного пути заявки.\n\nДля проектирования важно заранее знать условия использования. Если ресурс должен работать через браузер по общему адресу, эта потребность влияет на размещение. Однако мы не выбираем конкретного поставщика только по названию этапа. Устройство и стоимость соотносят с объёмом задачи и возможностями сопровождения.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Подготовка: Настройки приложения и доступ к хранилищу. 2. Публикация: Запуск выбранной версии по рабочему адресу. 3. Подтверждение: Проверка доступности и основного пути заявки.","wordCount":131,"pauseSeconds":8,"estimatedSeconds":79,"requiredWpm":108,"links":"webinar-1, Жизненный цикл; учебные правила проекта"},{"title":"Сопровождение","body":"После запуска ресурс требует наблюдения и обновлений","visual":{"type":"process","items":[{"title":"Обнаружение","text":"Участник сообщает о проблеме или система показывает отклонение"},{"title":"Разбор","text":"Команда сопоставляет действия, состояние и технические сведения"},{"title":"Исправление","text":"Изменение проверяют и выпускают управляемо"}]},"speech":"Сопровождение поддерживает пригодность ресурса после выпуска. Пользователи могут столкнуться с непредусмотренной ситуацией, объём каталога может вырасти, а зависимый сервис — стать недоступным. Чтобы реагировать предметно, нужны сведения о работе системы и понятный порядок изменений. На четвёртом занятии разберём случай, когда заявка сохранена, но подтверждение не дошло. Он покажет, почему сообщение пользователя нужно связывать с состоянием данных.","explanation":"Сопровождение не сводится к постоянному переписыванию программы. Иногда достаточно объяснения, восстановления связи или исправления настройки. В каждом случае полезно знать границу ответственности и критерий восстановления. Поэтому памятка сопровождения входит в комплект результатов проекта вместе с экранами и моделью данных.","hint":"Не добавляйте новую роль пользователя для технического сопровождения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-43","catalog":"Свободная схема","title":"Сопровождение","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Обнаружение","text":"Участник сообщает о проблеме или система показывает отклонение"},{"title":"Разбор","text":"Команда сопоставляет действия, состояние и технические сведения"},{"title":"Исправление","text":"Изменение проверяют и выпускают управляемо"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"После запуска ресурс требует наблюдения и обновлений","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Обнаружение: Участник сообщает о проблеме или система показывает отклонение","focus":["p0"],"result":""},{"caption":"Разбор: Команда сопоставляет действия, состояние и технические сведения","focus":["p1"],"result":""},{"caption":" у влияния","visual":{"type":"process","items":[{"title":"Пожелание","text":"Студент хочет приложить файл с примерами работ"},{"title":"Оценка","text":"Меняются форма, хранение, ограничения и сопровождение"},{"title":"Решение","text":"Функцию принимают в план или обоснованно откладывают"}]},"speech":"После запуска знания о потребностях уточняются. Это естественно, но изменение нужно оценивать целиком. Просьба добавить одну кнопку может затронуть несколько частей системы. Мы проверяем пользу, зависимые решения, дополнительные ограничения и способ приёмки. Если просто изменить экран, остальные части окажутся неподготовленными. В конце занятия подробно пройдём такое изменение на примере вложений.","explanation":"Изменение не обнуляет уже согласованные решения. Необходимо явно указать, какие правила сохраняются, а какие меняются. Например, добавление файла само по себе не должно менять число заявок на один проект. Связи требований с данными и обработкой помогают увидеть эту границу и избежать случайных последствий.\n\nПосле запуска может оказаться, что пользователям важнее лучшее описание проекта, чем новая техническая функция. Это тоже изменение ресурса. Если проблема в непонятном содержании карточки, добавление чата не обязательно поможет. Поэтому пожелание сопоставляют с наблюдаемой трудностью. Новый запрос должен объяснять, для кого изменится результат и как это можно будет заметить. Такая постановка удерживает развитие связанным с задачей.\n\nДля учебного сервиса мы специально сохранили небольшой базовый путь. Он позволяет оценивать расширения относительно известной основы. Уведомление улучшает осведомлённость Ирины, но не заменяет сохранение. Поиск помогает выбрать проект, но не заменяет решение. Вложения дают дополнительный материал, но требуют правил обработки. Различие пользы и ответственности станет основой итогового разбора изменения на следующих слайдах.","hint":"Свяжите с будущим разбором вложений, не раскрывая его повторно. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-44","catalog":"Свободная схема","title":"Изменение требований после запуска","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Пожелание","text":"Студент хочет приложить файл с примерами работ"},{"title":"Оценка","text":"Меняются форма, хранение, ограничения и сопровождение"},{"title":"Решение","text":"Функцию принимают в план или обоснованно откладывают"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Новое пожелание проходит оценку влияния","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Пожелание: Студент хочет приложить файл с примерами работ","focus":["p0"],"result":""},{"caption":"Оценка: Меняются форма, хранение, ограничения и сопровождение","focus":["p1"],"result":""},{"caption":"Решение: Функцию принимают в план или обоснованно откладывают","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Новое пожелание проходит оценку влияния"}]}],"structural":true},"question":6,"id":"З1-С44","number":58,"blockTitle":"Жизненный цикл","blockIndex":5,"plannedSeconds":147,"startSeconds":5026,"transition":"Следующий вопрос — первая версия и архитектура. Полный основной путь важнее числа функций.","script":"После запуска знания о потребностях уточняются. Это естественно, но изменение нужно оценивать целиком. Просьба добавить одну кнопку может затронуть несколько частей системы. Мы проверяем пользу, зависимые решения, дополнительные ограничения и способ приёмки. Если просто изменить экран, остальные части окажутся неподготовленными. В конце занятия подробно пройдём такое изменение на примере вложений.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Пожела
