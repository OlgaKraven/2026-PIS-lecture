.slide-header,.slide-content,.slide-footer{position:relative;z-index:1}
.title-mascot{position:absolute;right:0;top:12%;width:34%;height:76%;object-fit:contain;z-index:2;border-radius:50%}
.kind-title .slide-content{padding-right:38%}.kind-title .slide-content:after{display:none}
.kind-title .slide-content h2{font-size:3.5cqw}.kind-title .slide-body{font-size:1.8cqw}
.section-label{font-size:1.1cqw;font-weight:850;color:var(--red);margin:0;letter-spacing:.04em}
.kind-agenda .slide-body{display:none}.kind-agenda .slide-visual{align-items:flex-start;padding-top:1cqw}
.agenda-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw 2.5cqw;width:100%;counter-reset:topics}
.agenda-list li{display:flex;align-items:baseline;gap:1.3cqw;border-top:1px solid #ceccc3;padding:1.3cqw 0;font-size:1.5cqw;font-weight:750}
.agenda-list b{color:var(--red);font-size:2cqw}
.kind-section .slide-content{justify-content:center;padding-right:33%;gap:1.5cqw}
.kind-section .slide-content h2{font-size:3.7cqw}.kind-section .slide-body{font-size:1.9cqw}
.kind-section .slide-visual{position:absolute;right:6%;top:12%;width:24%;height:76%;display:flex;justify-content:center;align-items:center}
.section-arrow{width:100%;height:100%;object-fit:contain;filter:brightness(0)}
.kind-questions .slide-visual{align-items:flex-start;padding-top:1.8cqw}
.question-list{font-size:2cqw;line-height:1.5;margin:0;padding-left:2cqw;display:grid;gap:1.8cqw;list-style:disc;width:100%}
.question-list li::marker{color:var(--red)}
.visual-pair{display:grid;grid-template-columns:repeat(var(--parts),minmax(0,1fr));gap:2cqw;width:100%;align-items:start}
.visual-pair>section{min-width:0}.visual-pair>section>h3{font-size:1.45cqw;margin:0 0 1.2cqw;line-height:1.2;color:var(--red-dark)}
.visual-pair .visual-process{grid-template-columns:1fr;gap:.5cqw}.visual-pair .process-item{border-top:0;border-left:2px solid var(--blue);padding:.2cqw .8cqw}
.visual-pair .process-number{display:none}.visual-pair .process-item b{font-size:1.3cqw;margin:0}.visual-pair .process-item p{font-size:1.15cqw;margin:.25cqw 0;line-height:1.3}
.visual-pair .visual-table{font-size:1.15cqw}.visual-pair .visual-table th,.visual-pair .visual-table td{padding:.5cqw .65cqw}
.visual-pair .visual-diagram{grid-template-columns:1fr;gap:.6cqw}.visual-pair .diagram-nodes{display:flex;flex-wrap:wrap;gap:.4cqw}.visual-pair .diagram-node{font-size:1.1cqw;padding:.5cqw}
.visual-pair .diagram-links{gap:.3cqw}.visual-pair .diagram-link,.visual-pair .diagram-link strong{font-size:1.1cqw;padding-bottom:.2cqw;margin:0}
.visual-pair .mockup{width:100%}.visual-pair .visual-code pre{font-size:1.2cqw}.visual-pair .visual-caption{font-size:1cqw}
@media print{html,body{color-scheme:light!important;background:#fff!important}.print-slide .active-slide{width:281mm;height:158.0625mm;aspect-ratio:16/9}.slide-header{font-size:1cqw}.slide-content h2{font-size:3.1cqw}.slide-body{font-size:1.7cqw}.slide-footer{font-size:.85cqw;min-height:0;padding:.6cqw 2cqw 1cqw 2.6cqw}.slide-frame{print-color-adjust:exact;-webkit-print-color-adjust:exact}.print-speech{color:#1c1c1c}.print-slide{break-inside:avoid}.print-speech{break-inside:auto}}
@media screen and (max-width:820px){.deck-topic{flex-basis:calc(100% - 7rem)}.deck-toolbar{min-width:0}.deck-topic strong{white-space:normal;overflow-wrap:anywhere}.toolbar-actions{justify-content:flex-start;gap:.3rem}.toolbar-actions .icon-button{width:2.35rem;height:2.35rem}.deck-shell{padding:.65rem;gap:.5rem}.deck-topic small{font-size:.68rem}}

/* Shared presentation and learning surfaces. */
:root{--red:#cb2823;--red-dark:#a31d19;--paper:#fff;--ink:#202022;--line:#dedee3;--tint:#fff1ef;--arrow:#eeeeef;--focus:#cb2823;--neutral:#f0f0f2}
:root[data-theme=dark]{--red:#ff716a;--red-dark:#ff8c86;--paper:#202023;--ink:#f4f4f5;--line:#43434a;--tint:#382523;--arrow:#39393e;--focus:#ff716a;--neutral:#303035;--surface:#202023;--text:#f4f4f5;--muted:#b6b6be;--border:#43434a}

 return `<section class="learning" data-learning="${esc(m.id)}" aria-label="${esc(m.title)}">${!overview?`<p class="learning-input">${esc(s.input)}</p>`:''}<div class="learning-scene">${scene(m,scenario,index,staticMode)}</div>${staticMode?`<div class="learning-static-steps">${s.frames.slice(1).map(x=>`<p>${esc(x.caption)}</p>`).join('')}</div><p class="learning-result">${esc(s.frames.at(-1).result)}</p>`:overview?'':`<p class="learning-caption" role="status" aria-live="polite">${esc(f.caption)}${f.result?`<strong>${esc(f.result)}</strong>`:''}</p>`}${m.data.note?`<p class="learning-note">${esc(m.data.note)}</p>`:''}</section>`;

 function bind(container,m,change){

 };
 const schedule=()=>{clear();deadline=performance.now()+remaining;timer=setTimeout(()=>{if(disposed||!running)return;index=Math.min(index+1,m.scenarios[sc].frames.length-1);remaining=1800;if(index===m.scenarios[sc].frames.length-1)running=false;draw();notify();if(running)schedule();},remaining);};

 }

})();

window.PISPractice=(()=>{

 function revealQuiz(root,q,visible=true){if(!q)return;const el=root.querySelector('.quiz-solution');if(!el)return;el.hidden=!visible;el.innerHTML=visible?`<strong>Ответ: ${esc(q.options[q.answer])}</strong><p>${esc(q.explanation)}</p>`:'';const button=root.querySelector('[data-reveal-answer]');if(button){button.textContent=visible?'Скрыть ответ':'Показать ответ';button.setAttribute('aria-expanded',String(visible));}}

 function passport(s,l){const a=s.activity;return `<section class="practice-passport"><div><h3>Задача</h3><p>${esc(a.task)}</p></div><div><h3>Что проверить</h3><p>${esc(a.check)}</p></div><p class="practice-case">Новый учебный случай · ${a.facts.length} наблюдения · прогноз и обоснование</p><a class="button primary" href="?webinar=${l.number}&slide=${s.number}&mode=activity" data-activity="${esc(s.id)}" target="_blank" rel="noopener">Интерактивная схема ↗</a><a class="practice-print-link" href="https://olgakraven.github.io/2026-PIS-lecture/?webinar=${l.number}&amp;slide=${s.number}&amp;mode=activity">${esc('https://olgakraven.github.io/2026-PIS-lecture/?webinar='+l.number+'&slide='+s.number+'&mode=activity')}</a></section>`;}

 function bindActivity(root,a){

const l={"id":"webinar-3","title":"Работа приложения, API, сервер и инфраструктура","result":"Путь запроса, согласованный API и схема запуска приложения","blocks":[[1,11,10.633333333333333,"Части приложения"],[12,21,15.383333333333333,"HTTP и JSON"],[22,31,15.233333333333333,"Договор API"],[32,41,15.55,"Обработка на сервере"],[42,51,15.916666666666666,"Работа с базой"],[52,63,18.683333333333334,"Путь заявки № 104"],[64,73,15.366666666666667,"Размещение приложения"],[74,81,13.233333333333333,"Выпуск версии"]],"semester":3,"number":3,"slides":[{"title":"Работа приложения, API, сервер и инфраструктура","body":"Путь одного действия через браузер, обработку и хранение","visual":{"type":"process","items":[{"title":"Обмен","text":"Запрос и ответ в согласованном формате"},{"title":"Обработка","text":"Пользователь, проверки, сохранение"},{"title":"Запуск","text":"Рабочая среда и выпуск версии"}]},"speech":"На третьем лекции проследим, как действие Анны превращается в сохранённую заявку. Разберём обмен между браузером и сервером, согласуем программный интерфейс и увидим работу с базой. Затем рассмотрим размещение и выпуск версии. Все запросы и результаты заранее подготовлены; запускать программы в эфире не потребуется.","explanation":"Сохраняем роли, поля и номера. Анна — пользователь двенадцать, проект — семнадцать, созданная заявка — сто четыре. Это позволит читать технические фрагменты как продолжение знакомого сценария.","hint":"Краткое введение, без повторного определения всех объектов.","sources":[],"question":null,"id":"З3-С01","number":1,"blockTitle":"Части приложения","blockIndex":0,"plannedSeconds":54,"startSeconds":0,"transition":"","script":"На третьем лекции проследим, как действие Анны превращается в сохранённую заявку. Разберём обмен между браузером и сервером, согласуем программный интерфейс и увидим работу с базой. Затем рассмотрим размещение и выпуск версии. Все запросы и результаты заранее подготовлены; запускать программы в эфире не потребуется.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Обмен». Запрос и ответ в согласованном формате. Второй блок обозначен «Обработка». Пользователь, проверки, сохранение. Третий блок обозначен «Запуск». Рабочая среда и выпуск версии.\n\nСохраняем роли, поля и номера. Анна — пользователь двенадцать, проект — семнадцать, созданная заявка — сто четыре. Это позволит читать технические фрагменты как продолжение знакомого сценария.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Обмен: Запрос и ответ в согласованном формате. 2. Обработка: Пользователь, проверки, сохранение. 3. Запуск: Рабочая среда и выпуск версии.","wordCount":96,"pauseSeconds":0,"estimatedSeconds":52,"requiredWpm":107,"links":"webinar-3, Части приложения; учебные правила проекта"},{"id":"З3-В01","title":"Цель и результаты занятия","body":"Путь запроса, согласованный API и схема запуска приложения","visual":{"type":"process","items":[{"title":"1","text":"Проследить HTTP-запрос от браузера до подтверждённого сохранения."},{"title":"2","text":"Объяснить проверку пользователя, прав и текущего состояния."},{"title":"3","text":"Разобрать конкуренцию запросов и условия безопасного выпуска."}]},"speech":"Цель занятия — путь запроса, согласованный api и схема запуска приложения. В результате мы сможем выполнить три действия. Проследить HTTP-запрос от браузера до подтверждённого сохранения. Объяснить проверку пользователя, прав и текущего состояния. Разобрать конкуренцию запросов и условия безопасного выпуска. Все объяснения опираются на один учебный сервис. Это подготовленный разбор, поэтому для его понимания не потребуется программировать в эфире.","script":"Цель занятия — путь запроса, согласованный api и схема запуска приложения. В результате мы сможем выполнить три действия. Проследить HTTP-запрос от браузера до подтверждённого сохранения. Объяснить проверку пользователя, прав и текущего состояния. Разобрать конкуренцию запросов и условия безопасного выпуска. Все объяснения опираются на один учебный сервис. Это подготовленный разбор, поэтому для его понимания не потребуется программировать в эфире.","explanation":"","hint":"Прочитайте предметный вывод; не ожидайте ответа аудитории.","sources":[],"visualDescription":"1: Проследить HTTP-запрос от браузера до подтверждённого сохранения. 2: Объяснить проверку пользователя, прав и текущего состояния. 3: Разобрать конкуренцию запросов и условия безопасного выпуска.","kind":"outcomes","question":null,"blockTitle":"Части приложения","blockIndex":0,"wordCount":57,"pauseSeconds":5,"estimatedSeconds":36,"notebook":"","links":"Введение и итоги занятия","number":2,"plannedSeconds":38,"startSeconds":54,"requiredWpm":104},{"title":"Вопросы темы","body":"Маршрут занятия","visual":{"type":"agenda","items":[{"number":1,"title":"Части приложения","start":7,"minutes":8},{"number":2,"title":"HTTP и JSON","start":12,"minutes":16},{"number":3,"title":"Договор API","start":22,"minutes":16},{"number":4,"title":"Обработка на сервере","start":32,"minutes":16},{"number":5,"title":"Работа с базой","start":42,"minutes":16},{"number":6,"title":"Путь заявки № 104","start":52,"minutes":20},{"number":7,"title":"Размещение приложения","start":64,"minutes":16},{"number":8,"title":"Выпуск версии","start":74,"minutes":12}]},"speech":"Перед нами маршрут занятия. Вопрос 1: части приложения. Вопрос 2: http и json. Вопрос 3: договор api. Вопрос 4: обработка на сервере. Вопрос 5: работа с базой. Вопрос 6: путь заявки № 104. Вопрос 7: размещение приложения. Вопрос 8: выпуск версии.\n\nОбщий результат: путь запроса, согласованный api и схема запуска приложения. Сначала обозначим связи между вопросами, затем последовательно разберём подготовленные решения. Каждый раздел продолжает один учебный пример, поэтому номера пользователей, проекта и заявки сохраняются.\n\nАнна нажимает «Подать заявку». Браузер собирает выбранный проект и мотивационный текст в обращение к серверу. Личность не передаётся как свободное поле формы: она определяется по действующему сеансу. На этом шаге ещё нет доказательства сохранения. Интерфейс переходит в ожидание, а сервер должен получить данные и проверить правила. Мы разложим путь на отдельные события, чтобы не смешивать причину, действие и результат.","explanation":"Если браузер мгновенно показал успех без ответа, он мог сообщить ложный результат. Если он повторно отправил форму при задержке, возникла новая попытка обработки. Поэтому состояние кнопки и правило уникальности выполняют разные задачи. В техническом разборе будем каждый раз уточнять, какая часть системы уже знает результат и какой факт она может честно подтвердить. Это особенно важно при обрыве связи после сохранения.","hint":"Прочитайте маршрут в порядке номеров. Каждый вопрос — раздел объяснения преподавателя. Ответов аудитории не ожидаем.","sources":[],"kind":"agenda","question":null,"id":"З3-С02","number":3,"blockTitle":"Части приложения","blockIndex":0,"plannedSeconds":123,"startSeconds":92,"transition":"Следующий вопрос — части приложения. Показать состояние и передать пользовательские данные.","script":"Перед нами маршрут занятия. Вопрос 1: части приложения. Вопрос 2: http и json. Вопрос 3: договор api. Вопрос 4: обработка на сервере. Вопрос 5: работа с базой. Вопрос 6: путь заявки № 104. Вопрос 7: размещение приложения. Вопрос 8: выпуск версии.\n\nОбщий результат: путь запроса, согласованный api и схема запуска приложения. Сначала обозначим связи между вопросами, затем последовательно разберём подготовленные решения. Каждый раздел продолжает один учебный пример, поэтому номера пользователей, проекта и заявки сохраняются.\n\nАнна нажимает «Подать заявку». Браузер собирает выбранный проект и мотивационный текст в обращение к серверу. Личность не передаётся как свободное поле формы: она определяется по действующему сеансу. На этом шаге ещё нет доказательства сохранения. Интерфейс переходит в ожидание, а сервер должен получить данные и проверить правила. Мы разложим путь на отдельные события, чтобы не смешивать причину, действие и результат.\n\n\n\nЕсли браузер мгновенно показал успех без ответа, он мог сообщить ложный результат. Если он повторно отправил форму при задержке, возникла новая попытка обработки. Поэтому состояние кнопки и правило уникальности выполняют разные задачи. В техническом разборе будем каждый раз уточнять, какая часть системы уже знает результат и какой факт она может честно подтвердить. Это особенно важно при обрыве связи после сохранения.\n\nСледующий вопрос — части приложения. Показать состояние и передать пользовательские данные.","visualDescription":"Маршрут занятия. Вопрос 1. Части приложения. Начало: слайд 3. Вопрос 2. HTTP и JSON. Начало: слайд 6. Вопрос 3. Договор API. Начало: слайд 14. Вопрос 4. Обработка на сервере. Начало: слайд 22. Вопрос 5. Работа с базой. Начало: слайд 30. Вопрос 6. Путь заявки № 104. Начало: слайд 38. Вопрос 7. Размещение приложения. Начало: слайд 48. Вопрос 8. Выпуск версии. Начало: слайд 56.","wordCount":202,"pauseSeconds":8,"estimatedSeconds":118,"requiredWpm":105,"links":"webinar-3, Части приложения; учебные правила проекта"},{"id":"З3-М01","title":"Материалы к занятиям","body":"","visual":{"type":"resources","url":"https://disk.yandex.ru/d/P40mjNJWYJAW9g","qr":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMzcgMzciIHNoYXBlLXJlbmRlcmluZz0iY3Jpc3BFZGdlcyI+PHBhdGggZmlsbD0iI2ZmZmZmZiIgZD0iTTAgMGgzN3YzN0gweiIvPjxwYXRoIHN0cm9rZT0iIzAwMDAwMCIgZD0iTTQgNC41aDdtMiAwaDFtMSAwaDJtMSAwaDZtMiAwaDdNNCA1LjVoMW01IDBoMW00IDBoN20yIDBoMW0xIDBoMW01IDBoMU00IDYuNWgxbTEgMGgzbTEgMGgxbTEgMGgybTEgMGgybTEgMGgybTQgMGgxbTEgMGgxbTEgMGgzbTEgMGgxTTQgNy41aDFtMSAwaDNtMSAwaDFtMSAwaDFtMiAwaDFtMSAwaDFtMSAwaDFtMSAwaDFtMiAwaDFtMSAwaDFtMSAwaDNtMSAwaDFNNCA4LjVoMW0xIDBoM20xIDBoMW0xIDBoMW0yIDBoMW0xIDBoNG0xIDBoM20xIDBoMW0xIDBoM20xIDBoMU00IDkuNWgxbTUgMGgxbTEgMGgybTUgMGgxbTYgMGgxbTUgMGgxTTQgMTAuNWg3bTEgMGgxbTEgMGgxbTEgMGgxbTEgMGgxbTEgMGgxbTEgMGgxbTEgMGgxbTEgMGg3TTEyIDExLjVoMW0 вка","text":"Передать согласованное обращение"},{"title":"Представление","text":"Показать ожидание, результат или неопределённость"}]}},{"title":"Ответственность сервера","visual":{"type":"process","items":[{"title":"Установить пользователя","text":"Получить Анну из действующего сеанса"},{"title":"Проверить","text":"Формат, роль, проект, текст и повтор"},{"title":"Сохранить","text":"Создать согласованную запись"},{"title":"Ответить","text":"Сообщить подтверждённый результат"}]}}]},"speech":"Браузерная часть управляет представлением и взаимодействием. Она помогает Анне заполнить форму и передаёт обращение в согласованном формате. Затем читает результат и выбирает соответствующее состояние интерфейса. Это не означает право назначить student_id или итоговый статус. Клиентские данные могут быть изменены, а локальные сведения о проекте — устареть. Поэтому сервер не считает внешний вид страницы доказательством допустимости операции.\n\nТакое разделение полезно и при разработке. Изменение расположения поля не должно менять правило допустимой длины. Замена интерфейса не должна открывать дополнительные права. Серверный договор позволяет нескольким представлениям обращаться к одной логике. В нашем примере реализуется только согласованный веб-путь, но принцип объясняет, почему правила не прячут исключительно в код кнопки. Дальше посмотрим на сторону, которая принимает окончательное решение.\n\nСервер принимает запрос и применяет правила независимо от состояния страницы. Он определяет пользователя по сеансу, проверяет структуру данных и право выполнить действие. Для создания заявки нужен студент, открытый существующий проект, допустимая мотивация и отсутствие предыдущей пары. Затем сервер организует сохранение. Только после подтверждения записи можно формировать успешный результат. Такой порядок исключает обещание действия, которое ещё не завершилось.","explanation":"На схеме показаны логические шаги, а не обязательное число функций в программе. Реализация может распределить их между несколькими частями. Существенно, чтобы проверки не исчезли и чтобы ошибка ограничения данных превратилась в понятный договорённый ответ. Если два обращения пришли почти одновременно, простое предварительное чтение ещё не гарантирует отсутствие повтора. Этот случай позже разберём на временной последовательности.","hint":"Не передавайте браузеру полномочие выбрать пользователя. Сначала пользователь и проверки, затем сохранение и ответ. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-4","catalog":"Свободная схема","title":"Ответственность сервера","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Ответственность браузера","visual":{"type":"process","items":[{"title":"Подготовка","text":"Получить выбранный проект и мотивацию"},{"title":"Отправка","text":"Передать согласованное обращение"},{"title":"Представление","text":"Показать ожидание, результат или неопределённость"}]}},{"title":"Ответственность сервера","visual":{"type":"process","items":[{"title":"Установить пользователя","text":"Получить Анну из действующего сеанса"},{"title":"Проверить","text":"Формат, роль, проект, текст и повтор"},{"title":"Сохранить","text":"Создать согласованную запись"},{"title":"Ответить","text":"Сообщить подтверждённый результат"}]}}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Проверки предшествуют изменению данных","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Подготовка: Получить выбранный проект и мотивацию","focus":["v0.p0"],"result":""},{"caption":"Отправка: Передать согласованное обращение","focus":["v0.p1"],"result":""},{"caption":"Представление: Показать ожидание, результат или неопределённость","focus":["v0.p2"],"result":""},{"caption":" , которое ещё не завершилось.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Подготовка». Получить выбранный проект и мотивацию. Второй блок обозначен «Отправка». Передать согласованное обращение. Третий блок обозначен «Представление». Показать ожидание, результат или неопределённость.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Установить пользователя». Получить Анну из действующего сеанса. Второй блок обозначен «Проверить». Формат, роль, проект, текст и повтор. Третий блок обозначен «Сохранить». Создать согласованную запись. Четвёртый блок обозначен «Ответить». Сообщить подтверждённый результат.\n\nНа схеме показаны логические шаги, а не обязательное число функций в программе. Реализация может распределить их между несколькими частями. Существенно, чтобы проверки не исчезли и чтобы ошибка ограничения данных превратилась в понятный договорённый ответ. Если два обращения пришли почти одновременно, простое предварительное чтение ещё не гарантирует отсутствие повтора. Этот случай позже разберём на временной последовательности.\n\n","visualDescription":"Ответственность браузера. Последовательность подписанных блоков. 1. Подготовка: Получить выбранный проект и мотивацию. 2. Отправка: Передать согласованное обращение. 3. Представление: Показать ожидание, результат или неопределённость.\n\nОтветственность сервера. Последовательность подписанных блоков. 1. Установить пользователя: Получить Анну из действующего сеанса. 2. Проверить: Формат, роль, проект, текст и повтор. 3. Сохранить: Создать согласованную запись. 4. Ответить: Сообщить подтверждённый результат.","wordCount":292,"pauseSeconds":16,"estimatedSeconds":175,"requiredWpm":105,"links":"webinar-3, Части приложения; учебные правила проекта"},{"title":"Роль базы в обмене","body":"Сохранённое состояние переживает завершение запроса","visual":{"type":"diagram","nodes":["Браузер Анны","Сервер приложения","База данных"],"edges":[["Браузер Анны","Сервер приложения","Запрос на подачу"], обоснование выбранного решения. Правильный вариант: Нет, сервер устанавливает личность по сеансу. Формат и скрытое поле не доказывают личность отправителя. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","script":"Проверим понимание вопроса. Браузер отправил id пользователя в JSON. Можно доверять этому id? Варианты: Да, это JSON; Нет, сервер устанавливает личность по сеансу; Да, если поле скрыто. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Нет, сервер устанавливает личность по сеансу. Формат и скрытое поле не доказывают личность отправителя. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","hint":"Дайте аудитории выбрать вариант. Ответ и разбор показывайте отдельной командой.","visualDescription":"Браузер отправил id пользователя в JSON. Можно доверять этому id? Да, это JSON; Нет, сервер устанавливает личность по сеансу; Да, если поле скрыто","wordCount":62,"estimatedSeconds":54,"quiz":{"id":"З3-Т1","revision":1,"prompt":"Браузер отправил id пользователя в JSON. Можно доверять этому id?","options":["Да, это JSON","Нет, сервер устанавливает личность по сеансу","Да, если поле скрыто"],"answer":1,"explanation":"Формат и скрытое поле не доказывают личность отправителя."},"plannedSeconds":0,"startSeconds":638,"requiredWpm":0},{"title":"HTTP и JSON","body":"Правила запроса и ответа между участниками веб-обмена","visual":{"type":"section","number":2,"title":"HTTP и JSON"},"speech":"Переходим к вопросу 2: http и json. Правила запроса и ответа между участниками веб-обмена. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":2,"id":"З3-С06","number":12,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":29,"startSeconds":638,"transition":"","script":"Переходим к вопросу 2: http и json. Правила запроса и ответа между участниками веб-обмена. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 2: HTTP и JSON. Справа большая серая стрелка, направленная влево.","wordCount":36,"pauseSeconds":8,"estimatedSeconds":28,"requiredWpm":103,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Адрес запроса","body":"Путь обозначает ресурс внутри приложения","visual":{"type":"pair","items":[{"title":"HTTP","visual":{"type":"code","language":"HTTP","code":"GET /api/projects\nAccept: application/json","caption":"Упрощённая запись запроса каталога. Версия протокола и технические заголовки опущены."}},{"title":"Адрес запроса","visual":{"type":"table","columns":["Часть адреса","Учебный пример","Смысл"],"rows":[["Схема","https","Защищённое соединение"],["Имя узла","projects.example.test","Условный адрес приложения"],["Путь","/api/projects/17","Проект 17"],["Полный пример","https://projects.example.test/api/projects/17","Не является действующим сервисом"]],"caption":""}}]},"speech":"Эйч-ти-ти-пи, HTTP, расшифровывается как Hypertext Transfer Protocol. Это протокол, то есть согласованные правила обмена. Клиент отправляет запрос, сервер возвращает ответ. Запрос указывает операцию и адрес, а при необходимости содержит данные. Ответ содержит код результата и может передавать представление ресурса. Наш фрагмент сокращён, чтобы показать смысл основных частей. Он не является полным сетевым пакетом и не требует ручного ввода.\n\nМетод GET в этом примере запрашивает каталог. Адрес /api/projects обозначает согласованный путь нашей системы. Заголовок Accept показывает предпочтительный формат ответа. HTTP не определяет, как именно устроена таблица проектов или какой интерфейс увидит Анна. Эти решения принадлежат приложению. Протокол даёт общий язык обмена, на котором можно выразить наш проектный договор.\n\nАдрес запроса состоит из частей. Схема задаёт способ обращения, имя узла помогает найти нужный сервис, путь указывает ресурс внутри приложения. В нашем примере projects.example.test является условным доменом для пояснения. К нему не нужно переходить. В рабочих примерах далее будем показывать только путь, потому что обсуждаем договор приложения. Число семнадцать в пути выбирает конкретный проект из общего набора.","explanation":"Адрес сам по себе не выражает все полномочия. Человек может узнать или изменить число в строке, поэтому сервер проверяет право при каждом защищённом действии. Мы также не выводим из одного технического пути обязательный вид страницы. Карточка проекта может использовать сведения этого ресурса и показывать их понятным образом. Следующий слайд добавит к адресу метод, который уточняет намерение обращения.","hint":"HTTP — «эйч-ти-ти-пи», GET — «гет». example.test — условное имя; не открывайте его.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"notebook":"HTTP — протокол обмена сообщениями запроса и ответа между клиентом и сервером.","question":2,"id":"З3-С07","number":13,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":208,"startSeconds":667,"transition":"","script":"Эйч-ти-ти-пи, HTTP, расшифровывается как Hypertext Transfer Protocol. Это протокол, то есть согласованные правила обмена. Клиент отправляет запрос, сервер возвращает ответ. Запрос указывает операцию и адрес, а при необходимости содержит данные. Ответ содержит код результата и может передавать представление ресурса. Наш фрагмент сокращён, чтобы показать смысл основных частей. Он не является полным сетевым пакетом и не требует ручного ввода.\n\nМетод GET в этом примере запрашивает каталог. Адрес /api/projects обозначает согласованный путь нашей системы. Заголовок Accept показывает предпочтительный формат ответа. HTTP не определяет, как именно устроена таблица проектов или какой интерфейс увидит Анна. Эти решения принадлежат приложению. Протокол даёт общий язык обмена, на котором можно выразить наш проектный договор.\n\nАдрес запроса состоит из частей. Схема задаёт способ обращения, имя узла помогает найти нужный сервис, путь указывает ресурс внутри приложения. В нашем примере projects.example.test является условным доменом для пояснения. К нему не нужно переходить. В рабочих примерах далее будем показывать только путь, потому что обсуждаем договор приложения. Число семнадцать в пути выбирает конкретный проект из общего набора.\n\nПеред нами подготовленный фрагмент HTTP. Упрощённая запись запроса каталога. Версия протокола и технические заголовки опущены. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nСопоставим записи в таблице. В строке 1 часть адреса: Схема. учебный пример: https. смысл: Защищённое соединение. В строке 2 часть адреса: Имя узла. учебный пример: projects.example.test. смысл: Условный адрес приложения. В строке 3 часть адреса: Путь. учебный пример: /api/projects/17. смысл: Проект 17. В строке 4 часть адреса: Полный пример. учебный пример: https://projects.example.test/api/projects/17. смысл: Не является действующим сервисом.\n\nАдрес сам по себе не выражает все полномочия. Человек может узнать или изменить число в строке, поэтому сервер проверяет право при каждом защищённом действии. Мы также не выводим из одного технического пути обязательный вид страницы. Карточка проекта может использовать сведения этого ресурса и показывать их понятным образом. Следующий слайд добавит к адресу метод, который уточняет намерение обращения.\n\n","visualDescription":"HTTP. Фрагмент HTTP. Упрощённая запись запроса каталога. Версия протокола и технические заголовки опущены.\nGET /api/projects\nAccept: application/json\n\nАдрес запроса. Таблица. Столбцы: Часть адреса; Учебный пример; Смысл. Строка 1: Схема; https; Защищённое соединение. Строка 2: Имя узла; projects.example.test; Условный адрес приложения. Строка 3: Путь; /api/projects/17; Проект 17. Строка 4: Полный пример; https://projects.example.test/api/projects/17; Не является действующим сервисом.","wordCount":328,"pauseSeconds":20,"estimatedSeconds":199,"requiredWpm":105,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Метод запроса","body":"GET, POST и PATCH выражают разные действия","visual":{"type":"table","columns":["Метод","В нашем договоре","Пример"],"rows":[["GET","Получить сведения","/api/projects"],["POST","Создать заявку","/api/applications"],["PATCH","Частично изменить заявку","/api/applications/104"]],"caption":""},"speech":"Метод — часть запроса, которая задаёт характер действия. GET используем для получения сведений. POST в нашем договоре создаёт заявку. PATCH передаёт частичное изменение, в данном случае решение по статусу. Эти значения не выводятся только из названия кнопки. Они должны быть согласованы между клиентом и сервером. Если действие меняет данные, нельзя проектировать его как обычное чтение только ради удобства ссылки.","explanation":"При этом протокол не превращает любой POST автоматически в создание именно заявки. Конкретную операцию определяет договор приложения вместе с путём и форматом. Для PATCH также необходимо описать, какие изменения разрешены. В нашем примере не допускается произвольная правка студента, проекта и мотивации через маршрут решения. Передаётся только итоговый статус из согласованного набора. Остальные условия проверяются сервером.","hint":"POST — «пост», PATCH — «патч».","sources":["https://www.rfc-editor.org/rfc/rfc9110.html","https://www.rfc-editor.org/rfc/rfc5789.html"],"question":2,"id":"З3-С08","number":14,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":98,"startSeconds":875,"transition":"","script":"Метод — часть запроса, которая задаёт характер действия. GET используем для получения сведений. POST в нашем договоре создаёт заявку. PATCH передаёт частичное изменение, в данном случае решение по статусу. Эти значения не выводятся только из названия кнопки. Они должны быть согласованы между клиентом и сервером. Если действие меняет данные, нельзя проектировать его как обычное чтение только ради удобства ссылки.\n\nСопоставим записи в таблице. В строке 1 метод: GET. в нашем договоре: Получить сведения. пример: /api/projects. В строке 2 метод: POST. в нашем договоре: Создать заявку. пример: /api/applications. В строке 3 метод: PATCH. в нашем договоре: Частично изменить заявку. пример: /api/applications/104.\n\nПри этом протокол не превращает любой POST автоматически в создание именно заявки. Конкретную операцию определяет договор приложения вместе с путём и форматом. Для PATCH также необходимо описать, какие изменения разрешены. В нашем примере не допускается произвольная правка студента, проекта и мотивации через маршрут решения. Передаётся только итоговый статус из согласованного набора. Остальные условия проверяются сервером.\n\n","visualDescription":"Таблица. Столбцы: Метод; В нашем договоре; Пример. Строка 1: GET; Получить сведения; /api/projects. Строка 2: POST; Создать заявку; /api/applications. Строка 3: PATCH; Частично изменить заявку; /api/applications/104.","wordCount":158,"pauseSeconds":8,"estimatedSeconds":94,"requiredWpm":105,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Заголовки","body":"Служебные сведения помогают интерпретировать сообщение","visual":{"type":"code","language":"HTTP","code":"Content-Type: application/json\nAccept: application/json","caption":"Content-Type описывает передаваемое содержимое. Accept задаёт предпочтительный формат ответа."},"speech":"Заголовки передают сведения о сообщении и условиях обмена. Content-Type сообщает, как понимать тело запроса или ответа. Значение application/json обозначает формат JSON, который скоро разберём. Accept выражает предпочтение клиента по представлению результата. Эти заголовки имеют разное назначение, хотя в примере значения одинаковы. Заголовок не является произвольной строкой для декоративного комментария; его смысл задан правилами обмена.","explanation":"В упрощённых фрагментах механизм сеанса не показан. Это не означает отсутствие входа. Мы заранее считаем его действующим и отдельно объясняем, что сервер получает пользователя из доверенного контекста. Пропущенные технические детали отмечаются, чтобы ведущий не принимал короткую запись за полный набор необходимых сведений. На экране достаточно двух строк для понимания формата передаваемых данных и ожидаемого результата.","hint":"Произнесите «контент-тайп», затем объясните смысл по-русски.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":2,"id":"З3-С09","number":15,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":96,"startSeconds":973,"transition":"","script":"Заголовки передают сведения о сообщении и условиях обмена. Content-Type сообщает, как понимать тело запроса или ответа. Значение application/json обозначает формат JSON, который скоро разберём. Accept выражает предпочтение клиента по представлению результата. Эти заголовки имеют разное назначение, хотя в примере значения одинаковы. Заголовок не является произвольной строкой для декоративного комментария; его смысл задан правилами обмена.\n\nПеред нами подготовленный фрагмент HTTP. Content-Type описывает передаваемое содержимое. Accept задаёт предпочтительный формат ответа. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nВ упрощённых фрагментах механизм сеанса не показан. Это не означает отсутствие входа. Мы заранее считаем его действующим и отдельно объясняем, что сервер получает пользователя из доверенного контекста. Пропущенные технические детали отмечаются, чтобы ведущий не принимал короткую запись за полный набор необходимых сведений. На экране достаточно двух строк для понимания формата передаваемых данных и ожидаемого результата.\n\n","visualDescription":"Фрагмент HTTP. Content-Type описывает передаваемое содержимое. Accept задаёт предпочтительный формат ответа.\nContent-Type: application/json\nAccept: application/json","wordCount":146,"pauseSeconds":12,"estimatedSeconds":92,"requiredWpm":104,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Тело запроса","body":"Передаются выбранный проект и мотивация","visual":{"type":"code","language":"JSON","code":"{\n  \"project_id\": 17,\n  \"motivation\": \"Хочу разработать каталог мероприятий и личный кабинет участника студенческого клуба.\"\n}","caption":"Тело создания заявки. student_id и status клиент не задаёт."},"speech":"Тело содержит данные для конкретного действия. При создании заявки Анна передаёт выбранный проект и мотивацию. Поля student_id нет: пользователь определяется сервером. Поля status тоже нет: начальное состояние задаётся по правилу создания. Такой договор уменьшает неоднозначность и не даёт клиенту выбирать полномочия через обычное содержимое формы. Число семнадцать совпадает с карточкой, а мотивация — с подготовленным текстом.","explanation":"Если в запрос неожиданно добавили status со значением accepted, обработка не должна принять его как разрешение на одобрение. Для учебного договора неизвестные поля отклоняются как неподдерживаемое содержимое. Решение преподавателя выполняется отдельной операцией и с отдельной проверкой права. Это разделение помогает понять, почему модель хранения может содержать больше полей, чем клиент передаёт при создании объекта.","hint":"Сравните тело с полным составом сохранённой заявки.","sources":[],"question":2,"id":"З3-С10","number":16,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":96,"startSeconds":1069,"transition":"","script":"Тело содержит данные для конкретного действия. При создании заявки Анна передаёт выбранный проект и мотивацию. Поля student_id нет: пользователь определяется сервером. Поля status тоже нет: начальное состояние задаётся по правилу создания. Такой договор уменьшает неоднозначность и не даёт клиенту выбирать полномочия через обычное содержимое формы. Число семнадцать совпадает с карточкой, а мотивация — с подготовленным текстом.\n\nПеред нами подготовленный фрагмент JSON. Тело создания заявки. student_id и status клиент не задаёт. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nЕсли в запрос неожиданно добавили status со значением accepted, обработка не должна принять его как разрешение на одобрение. Для учебного договора неизвестные поля отклоняются как неподдерживаемое содержимое. Решение преподавателя выполняется отдельной операцией и с отдельной проверкой права. Это разделение помогает понять, почему модель хранения может содержать больше полей, чем клиент передаёт при создании объекта.\n\n","visualDescription":"Фрагмент JSON. Тело создания заявки. student_id и status клиент не задаёт.\n{\n  \"project_id\": 17,\n  \"motivation\": \"Хочу разработать каталог мероприятий и личный кабинет участника студенческого клуба.\"\n}","wordCount":147,"pauseSeconds":12,"estimatedSeconds":92,"requiredWpm":105,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Ответ сервера","body":"Код и содержимое описывают результат операции","visual":{"type":"code","language":"HTTP + JSON","code":"201 Created\nLocation: /api/applications/104\nContent-Type: application/json\n\n{\"id\":104,\"project_id\":17,\n \"student_id\":12,\"status\":\"pending\"}","caption":"Сокращённый пример успешного ответа после сохранения."},"speech":"В ответе сервер сообщает результат. Код двести один, Created, означает создание ресурса. Заголовок Location указывает его идентификатор в адресном виде. В теле кратко показаны номер заявки, проект, студент и начальный статус. Это сокращённое представление: мотивация и время не исчезли из сохранённых данных. Мы опустили их ради читаемости. Успех отправляется после подтверждения сохранения, а не после одного получения текста запроса.","explanation":"Указанный Location не добавляет в учебный договор новую обязательную операцию чтения по этому адресу. Согласованный способ Анны проверить свои обращения — GET /api/my/applications. Адрес созданного ресурса и перечень поддержанных операций являются связанными, но разными частями договора. Такое уточнение сохраняет исходный набор маршрутов и не заставляет ведущего придумывать неописанный запрос.","hint":"Created — «криэйтид»; проговорите, что ответ сокращён.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":2,"id":"З3-С11","number":17,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":94,"startSeconds":1165,"transition":"","script":"В ответе сервер сообщает результат. Код двести один, Created, означает создание ресурса. Заголовок Location указывает его идентификатор в адресном виде. В теле кратко показаны номер заявки, проект, студент и начальный статус. Это сокращённое представление: мотивация и время не исчезли из сохранённых данных. Мы опустили их ради читаемости. Успех отправляется после подтверждения сохранения, а не после одного получения текста запроса.\n\nПеред нами подготовленный фрагмент HTTP + JSON. Сокращённый пример успешного ответа после сохранения. Читаем его как пример согласованного обмена или обработки. Ни один фрагмент на этом слайде не требуется вводить или запускать в прямом эфире.\n\nУказанный Location не добавляет в учебный договор новую обязательную операцию чтения по этому адресу. Согласованный способ Анны проверить свои обращения — GET /api/my/applications. Адрес созданного ресурса и перечень поддержанных операций являются связанными, но разными частями договора. Такое уточнение сохраняет исходный набор маршрутов и не заставляет ведущего придумывать неописанный запрос.\n\n","visualDescription":"Фрагмент HTTP + JSON. Сокращённый пример успешного ответа после сохранения.\n201 Created\nLocation: /api/applications/104\nContent-Type: application/json\n\n{\"id\":104,\"project_id\":17,\n \"student_id\":12,\"status\":\"pending\"}","wordCount":143,"pauseSeconds":12,"estimatedSeconds":90,"requiredWpm":105,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Формат JSON","body":"Имена полей и значения образуют структуру данных","visual":{"type":"table","columns":["Фрагмент","Тип","Смысл"],"rows":[["\"project_id\": 17","Число","Идентификатор выбранного проекта"],["\"motivation\": \"...\"","Строка","Текст из формы"],["\"is_open\": true","Логическое значение","Признак открытого набора"]],"caption":""},"speech":"Джей-сон, JSON, расшифровывается как JavaScript Object Notation. Это текстовый формат представления структурированных данных. Имя поля записывается строкой в двойных кавычках, затем идёт двоеточие и значение. Число и логический признак отличаются от строки. Фигурные скобки группируют поля объекта, квадратные могут обозначать массив. Формат не ограничивает обмен одним языком программирования, несмотря на историю названия.","explanation":"В примерах важно сохранять точные имена. project_id и projectId были бы разными именами, если договор не описал преобразование. Мы используем единый вариант с подчёркиванием. JSON задаёт форму записи, но не проверяет, существует ли проект и допустима ли мотивация. Корректно разобранный текст ещё должен пройти правила приложения. Поэтому следующий шаг — различить группы результатов и конкретные причины отказа.","hint":"JSON — «джей-сон». Не читайте знаки пунктуации без необходимости.","sources":["https://www.rfc-editor.org/rfc/rfc8259.html"],"question":2,"id":"З3-С12","number":18,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":94,"startSeconds":1259,"transition":"","script":"Джей-сон, JSON, расшифровывается как JavaScript Object Notation. Это текстовый формат представления структурированных данных. Имя поля записывается строкой в двойных кавычках, затем идёт двоеточие и значение. Число и логический признак отличаются от строки. Фигурные скобки группируют поля объекта, квадратные могут обозначать массив. Формат не ограничивает обмен одним языком программирования, несмотря на историю названия.\n\nСопоставим записи в таблице. В строке 1 фрагмент: \"project_id\": 17. тип: Число. смысл: Идентификатор выбранного проекта. В строке 2 фрагмент: \"motivation\": \"...\". тип: Строка. смысл: Текст из формы. В строке 3 фрагмент: \"is_open\": true. тип: Логическое значение. смысл: Признак открытого набора.\n\nВ примерах важно сохранять точные имена. project_id и projectId были бы разными именами, если договор не описал преобразование. Мы используем единый вариант с подчёркиванием. JSON задаёт форму записи, но не проверяет, существует ли проект и допустима ли мотивация. Корректно разобранный текст ещё должен пройти правила приложения. Поэтому следующий шаг — различить группы результатов и конкретные причины отказа.\n\n","visualDescription":"Таблица. Столбцы: Фрагмент; Тип; Смысл. Строка 1: \"project_id\": 17; Число; Идентификатор выбранного проекта. Строка 2: \"motivation\": \"...\"; Строка; Текст из формы. Строка 3: \"is_open\": true; Логическое значение; Признак открытого набора.","wordCount":151,"pauseSeconds":8,"estimatedSeconds":90,"requiredWpm":105,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"title":"Группы результатов","body":"Успех, отказ по запросу и сбой обработки различаются","visual":{"type":"table","columns":["Код","Значение в нашем договоре"],"rows":[["200 / 201","Успешное чтение или создание"],["401 / 403","Вход не подтверждён или действие запрещено"],["409","Конфликт: повтор, закрытый проект, недопустимый переход"],["422","Формат понятен, содержимое не соответствует правилам"],["5xx","Сервер не смог нормально выполнить обработку"]],"caption":""},"speech":"Код ответа помогает клиенту понять общий характер результата. Двухсотые коды связаны с успешной обработкой. Четырёхсотые указывают на условия запроса или его допустимость. Пятисотые относятся к сбою серверной обработки. Конкретное значение читают по стандарту и договору. Для нашего сервиса повторная заявка получает 409, а недопустимая длина — 422. Коды не заменяют понятный текст и машинное обозначение причины.","explanation":"Отсутствие ответа отличается от любого полученного кода. При обрыве нельзя автоматически предположить 500 или отказ в создании. Браузер должен сохранить неопределённость и проверить доступные сведения позже. Также один код 409 может иметь несколько причин в нашем договоре, поэтому тело ошибки содержит отдельный code. Это позволит показать правильное сообщение без угадывания по свободной фразе.\n\nСопоставим два запроса к одному адресу создания заявки. В первом корректная мотивация, а во втором текст короче минимальной границы. Оба сообщения могут быть синтаксически правильным JSON. Успех разбора формата ещё не означает, что действие допустимо. Сервер сначала получает значения, затем применяет согласованные проверки и только после этого решает, можно ли сохранять запись.\n\nТеперь сравним ответ об ошибке и отсутствие ответа. Если сервер вернул известный код и описание причины, браузер может показать конкретное объяснение. Если соединение оборвалось, клиент не знает, на каком шаге это произошло. Нельзя по одному сетевому исключению утверждать, что запись отсутствует. Поэтому код результата, тело ответа и транспортный сбой рассматриваются отдельно. В нашем сценарии пользователь проверяет свои заявки, а ограничение уникальности защищает от повторного создания. При этом метод запроса не выбирают по желаемой подписи кнопки. Он описывает смысл обращения к ресурсу. Название операции, адрес, формат данных и возможные результаты составляют один договор, который должны одинаково понимать браузер, сервер и будущие проверки.","hint":"Не называйте сетевой обрыв полученным кодом ответа.","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"question":2,"id":"З3-С13","number":19,"blockTitle":"HTTP и JSON","blockIndex":1,"plannedSeconds":208,"startSeconds":1353,"transition":"Следующий вопрос — договор api. Операция включает путь, данные, права и результат.","script":"Код ответа помогает клиенту понять общий характер результата. Двухсотые коды связаны с успешной обработкой. Четырёхсотые указывают на условия запроса или его допустимость. Пятисотые относятся к сбою серверной обработки. Конкретное значение читают по стандарту и договору. Для нашего сервиса повторная заявка получает 409, а недопустимая длина — 422. Коды не заменяют понятный текст и машинное обозначение причины.\n\nСопоставим записи в таблице. В строке 1 код: 200 / 201. значение в нашем договоре: Успешное чтение или создание. В строке 2 код: 401 / 403. значение в нашем договоре: Вход не подтверждён или действие запрещено. В строке 3 код: 409. значение в нашем договоре: Конфликт: повтор, закрытый проект, недопустимый переход. В строке 4 код: 422. значение в нашем договоре: Формат понятен, содержимое не соответствует правилам. В строке 5 код: 5xx. значение в нашем договоре: Сервер не смог нормально выполнить обработку.\n\nОтсутствие ответа отличается от любого полученного кода. При обрыве нельзя автоматически предположить 500 или отказ в создании. Браузер должен сохранить неопределённость и проверить доступные сведения позже. Также один код 409 может иметь несколько причин в нашем договоре, поэтому тело ошибки содержит отдельный code. Это позволит показать правильное сообщение без угадывания по свободной фразе.\n\nСопоставим два запроса к одному адресу создания заявки. В первом корректная мотивация, а во втором текст короче минимальной границы. Оба сообщения могут быть синтаксически правильным JSON. Успех разбора формата ещё не означает, что действие допустимо. Сервер сначала получает значения, затем применяет согласованные проверки и только после этого решает, можно ли сохранять запись.\n\nТеперь сравним ответ об ошибке и отсутствие ответа. Если сервер вернул известный код и описание причины, браузер может показать конкретное объяснение. Если соединение оборвалось, клиент не знает, на каком шаге это произошло. Нельзя по одному сетевому исключению утверждать, что запись отсутствует. Поэтому код результата, тело ответа и транспортный сбой рассматриваются отдельно. В нашем сценарии пользователь проверяет свои заявки, а ограничение уникальности защищает от повторного создания. При этом метод запроса не выбирают по желаемой подписи кнопки. Он описывает смысл обращения к ресурсу. Название операции, адрес, формат данных и возможные результаты составляют один договор, который должны одинаково понимать браузер, сервер и будущие проверки.\n\nСледующий вопрос — договор api. Операция включает путь, данные, права и результат.","visualDescription":"Таблица. Столбцы: Код; Значение в нашем договоре. Строка 1: 200 / 201; Успешное чтение или создание. Строка 2: 401 / 403; Вход не подтверждён или действие запрещено. Строка 3: 409; Конфликт: повтор, закрытый проект, недопустимый переход. Строка 4: 422; Формат понятен, содержимое не соответствует правилам. Строка 5: 5xx; Сервер не смог нормально выполнить обработку.","wordCount":351,"pauseSeconds":8,"estimatedSeconds":199,"requiredWpm":105,"links":"webinar-3, HTTP и JSON; учебные правила проекта"},{"supplemental":true,"question":2,"blockIndex":1,"blockTitle":"HTTP и JSON","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"notebook":"","links":"webinar-3, HTTP и JSON; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":20,"id":"З3-П2","title":"Практика: Запрос и ответ","kind":"practice","visual":{"type":"practice"},"speech":"Применим понятия вопроса к новому учебному случаю. Учебный случай: POST /registrations с event_id=42 и комментарием. Сначала запишите прогноз. Затем последовательно исследуйте факты: Это запрос на создание. Тело имеет корректный синтаксис JSON. Доступность события ещё не проверена. Выберите решение и объясните его. Обоснованный вывод: Нет, нужны предметные проверки. Синтаксис и Content-Type не проверяют доступность мероприятия и остальные предметные условия. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","script":"Применим понятия вопроса к новому учебному случаю. Учебный случай: POST /registrations с event_id=42 и комментарием. Сначала запишите прогноз. Затем последовательно исследуйте факты: Это запрос на создание. Тело имеет корректный синтаксис JSON. Доступность события ещё не проверена. Выберите решение и объясните его. Обоснованный вывод: Нет, нужны предметные проверки. Синтаксис и Content-Type не проверяют доступность мероприятия и остальные предметные условия. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","hint":"Откройте дополнение в новой вкладке. Сначала запишите прогноз; затем исследуйте факты и обоснуйте решение.","visualDescription":"Учебный случай: POST /registrations с event_id=42 и комментарием. Это запрос на создание. Тело имеет корректный синтаксис JSON. Доступность события ещё не проверена.","wordCount":78,"estimatedSeconds":63,"activity":{"id":"З3-П2","revision":1,"title":"Запрос и ответ","task":"Учебный случай: POST /registrations с event_id=42 и комментарием.","facts":["Это запрос на создание.","Тело имеет корректный синтаксис JSON.","Доступность события ещё не проверена."],"decision":"Достаточно ли корректного JSON для успеха?","options":["Да","Нет, нужны предметные проверки","Да, если указан Content-Type"],"answer":1,"explanation":"Синтаксис и Content-Type не проверяют доступность мероприятия и остальные предметные условия.","check":"Сопоставьте каждый факт с правилом. Обоснуйте, почему остальные решения не подходят."},"plannedSeconds":0,"startSeconds":1561,"requiredWpm":0},{"supplemental":true,"question":2,"blockIndex":1,"blockTitle":"HTTP и JSON","sources":["https://www.rfc-editor.org/rfc/rfc9110.html"],"notebook":"","links":"webinar-3, HTTP и JSON; учебные правила проекта","
