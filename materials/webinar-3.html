льзовательский ввод, но будет присутствовать в базе и ответе. Источником служит система. Такой же подход применяется к начальному статусу и времени, хотя их происхождение другое. Важно точно объяснить, откуда появляется каждое поле, чтобы не оставлять преподавателю скрытый переход.","hint":"Отметьте, что проверена личность и роль, но не весь запрос.","sources":[],"question":6,"id":"З3-С40","number":54,"blockTitle":"Путь заявки № 104","blockIndex":5,"plannedSeconds":102,"startSeconds":4595,"transition":"","script":"Сервер получил запрос и установил пользователя по действующему сеансу. Это Анна с идентификатором двенадцать и ролью student. Условие роли для подачи выполнено. Пользователь не выбирается по имени на странице и не подменяется полем в теле. Теперь обработчик может связать будущую заявку с Анной. Но к сохранению ещё рано переходить: нужно проверить проект, содержимое и отсутствие повтора.\n\nСопоставим записи в таблице. В строке 1 проверяемое сведение: Пользователь. источник: Действующий сеанс. результат шага: id 12. В строке 2 проверяемое сведение: Роль. источник: Сохранённые сведения пользователя. результат шага: student. В строке 3 проверяемое сведение: Свободный номер из тела. источник: В договоре отсутствует. результат шага: Не используется как личность.\n\nЭтот шаг показывает разницу между отсутствием поля в запросе и отсутствием значения в итоговой записи. student_id не передаётся как пользовательский ввод, но будет присутствовать в базе и ответе. Источником служит система. Такой же подход применяется к начальному статусу и времени, хотя их происхождение другое. Важно точно объяснить, откуда появляется каждое поле, чтобы не оставлять преподавателю скрытый переход.\n\n","visualDescription":"Таблица. Столбцы: Проверяемое сведение; Источник; Результат шага. Строка 1: Пользователь; Действующий сеанс; id 12. Строка 2: Роль; Сохранённые сведения пользователя; student. Строка 3: Свободный номер из тела; В договоре отсутствует; Не используется как личность.","wordCount":163,"pauseSeconds":8,"estimatedSeconds":97,"requiredWpm":104,"links":"webinar-3, Путь заявки № 104; учебные правила проекта"},{"title":"Путь заявки: проверка проекта","body":"Проект существует и открыт для новой подачи","visual":{"type":"table","columns":["Сведение проекта 17","Учебное значение","Вывод"],"rows":[["Наличие записи","Проект найден","Можно продолжить предметные проверки"],["is_open","true","Новый приём разрешён"],["teacher_id","7","Будущая заявка попадёт в область Ирины"]],"caption":""},"speech":"Обработчик находит проект семнадцать и читает актуальные сведения. Проект существует, набор открыт. Значение teacher_id равно семи и позднее позволит Ирине получить заявку. Здесь мы не проверяем, является ли Анна преподавателем проекта: она действует как студент и не должна владеть проектом для подачи. Условие принадлежности понадобится при решении. Так проверка определяется конкретной операцией, а не механически копируется во все запросы.","explanation":"Если набор закрыт, создание прекращается с причиной PROJECT_CLOSED. Существующие заявки сохраняются. Если проекта нет, это другой отказ. В конкурентной реализации проверка открытости и запись должны быть согласованы с закрытием проекта. На слайде показан успешный учебный путь, где состояние остаётся допустимым. Мы не делаем из одного раннего чтения гарантию на любое последующее время. Следующий шаг проверит мотивацию.","hint":"Не требуйте от студента принадлежности проекта.","sources":[],"question":6,"id":"З3-С41","number":55,"blockTitle":"Путь заявки № 104","blockIndex":5,"plannedSeconds":106,"startSeconds":4697,"transition":"","script":"Обработчик находит проект семнадцать и читает актуальные сведения. Проект существует, набор открыт. Значение teacher_id равно семи и позднее позволит Ирине получить заявку. Здесь мы не проверяем, является ли Анна преподавателем проекта: она действует как студент и не должна владеть проектом для подачи. Условие принадлежности понадобится при решении. Так проверка определяется конкретной операцией, а не механически копируется во все запросы.\n\nСопоставим записи в таблице. В строке 1 сведение проекта 17: Наличие записи. учебное значение: Проект найден. вывод: Можно продолжить предметные проверки. В строке 2 сведение проекта 17: is_open. учебное значение: true. вывод: Новый приём разрешён. В строке 3 сведение проекта 17: teacher_id. учебное значение: 7. вывод: Будущая заявка попадёт в область Ирины.\n\nЕсли набор закрыт, создание прекращается с причиной PROJECT_CLOSED. Существующие заявки сохраняются. Если проекта нет, это другой отказ. В конкурентной реализации проверка открытости и запись должны быть согласованы с закрытием проекта. На слайде показан успешный учебный путь, где состояние остаётся допустимым. Мы не делаем из одного раннего чтения гарантию на любое последующее время. Следующий шаг проверит мотивацию.\n\n","visualDescription":"Таблица. Столбцы: Сведение проекта 17; Учебное значение; Вывод. Строка 1: Наличие записи; Проект найден; Можно продолжить предметные проверки. Строка 2: is_open; true; Новый приём разрешён. Строка 3: teacher_id; 7; Будущая заявка попадёт в область Ирины.","wordCount":171,"pauseSeconds":8,"estimatedSeconds":101,"requiredWpm":105,"links":"webinar-3, Путь заявки № 104; учебные правила проекта"},{"title":"Путь заявки: проверка мотивации","body":"Одинаковое правило длины действует на форме и сервере","visual":{"type":"process","items":[{"title":"Нормализация","text":"Удалить пробельные символы с концов по общему правилу"},{"title":"Подсчёт","text":"Посчитать Unicode code points"},{"title":"Диапазон","text":"Принять от 50 до 1000 включительно"},{"title":"Результат","text":"Учебная мотивация соответствует условию"}]},"speech":"Сервер проверяет мотивацию независимо от браузерной подсказки. Сначала применяется согласованная нормализация, затем подсчёт и обе границы. Подготовленный текст про каталог мероприятий подходит. Мы не оцениваем здесь качество интереса Анны автоматически: это не согласованная интеллектуальная проверка. Сервер контролирует формальную допустимость, а Ирина позже читает содержание. Разделение важно, чтобы случайно не добавить скрытый алгоритм оценки.","explanation":"Если мотивация слишком короткая, используется 422 с кодом MOTIVATION_LENGTH. Новая запись не создаётся, а интерфейс сохраняет введённое и показывает конкретное ограничение. Для граничных проверок используем обычные символы без неоднозначности подсчёта. Соответствие формы и сервера должно сохраняться при любом изменении правила. Иначе человек выполнит видимую инструкцию, но получит необъяснимый отказ. Дальше можно перейти к сохранению допустимого обращения.","hint":"Не приписывайте серверу оценку содержательной убедительности мотивации. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-42","catalog":"Свободная схема","title":"Путь заявки: проверка мотивации","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Нормализация","text":"Удалить пробельные символы с концов по общему правилу"},{"title":"Подсчёт","text":"Посчитать Unicode code points"},{"title":"Диапазон","text":"Принять от 50 до 1000 включительно"},{"title":"Результат","text":"Учебная мотивация соответствует условию"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Одинаковое правило длины действует на форме и сервере","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Нормализация: Удалить пробельные символы с концов по общему правилу","focus":["p0"],"result":""},{"caption":"Подсчёт: Посчитать Unicode code points","focus":["p1"],"result":""},{"caption":"Диапазон: Принять от 50 до 1000 включительно","focus":["p2"],"result":""},{"caption":"Результат: Учебная мотивация соответствует условию","focus":["p3"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Одинаковое правило длины действует на форме и сервере"}]}],"structural":true},"question":6,"id":"З3-С42","number":56,"blockTitle":"Путь заявки № 104","blockIndex":5,"plannedSeconds":95,"startSeconds":4803,"transition":"","script":"Сервер проверяет мотивацию независимо от браузерной подсказки. Сначала применяется согласованная нормализация, затем подсчёт и обе границы. Подготовленный текст про каталог мероприятий подходит. Мы не оцениваем здесь качество интереса Анны автоматически: это не согласованная интеллектуальная проверка. Сервер контролирует формальную допустимость, а Ирина позже читает содержание. Разделение важно, чтобы случайно не добавить скрытый алгоритм оценки.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Нормализация». Удалить пробельные символы с концов по общему правилу. Второй блок обозначен «Подсчёт». Посчитать Unicode code points. Третий блок обозначен «Диапазон». Принять от 50 до 1000 включительно. Четвёртый блок обозначен «Результат». Учебная мотивация соответствует условию.\n\nЕсли мотивация слишком короткая, используется 422 с кодом MOTIVATION_LENGTH. Новая запись не создаётся, а интерфейс сохраняет введённое и показывает конкретное ограничение. Для граничных проверок используем обычные символы без неоднозначности подсчёта. Соответствие формы и сервера должно сохраняться при любом изменении правила. Иначе человек выполнит видимую инструкцию, но получит необъяснимый отказ. Дальше можно перейти к сохранению допустимого обращения.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Нормализация: Удалить пробельные символы с концов по общему правилу. 2. Подсчёт: Посчитать Unicode code points. 3. Диапазон: Принять от 50 до 1000 включительно. 4. Результат: Учебная мотивация соответствует условию.","wordCount":152,"pauseSeconds":8,"estimatedSeconds":91,"requiredWpm":105,"links":"webinar-3, Путь заявки № 104; учебные правила проекта"},{"title":"Путь заявки: сохранение","body":"Пара 12 и 17 создаётся один раз","visual":{"type":"table","columns":["До операции","Действие","После успешной фиксации"],"rows":[["Пары 12 и 17 нет","Добавить проверенные данные","Заявка id 104"],["Номер не выбран клиентом","Назначить идентификатор","104"],["Начального статуса нет","Назначить pending","На рассмотрении"],["Время не введено Анной","Сформировать created_at","Условное время создания"]],"caption":""},"speech":"Теперь выполняется сохранение. До операции заявки для пары двенадцать и семнадцать нет. Система добавляет мотивацию, ссылки, начальный статус и время. Номер сто четыре получен как результат. На этом шаге база удерживает уникальность пары. Если другая попытка уже успела сохраниться, текущая не создаст вторую строку. В нашем успешном пути фиксация завершается, и запись становится основанием для ответа.","explanation":"Таблица показывает происхождение значений, а не четыре независимые заявки. Все строки описывают одну операцию создания. Это особенно важно для ведущего: нельзя прочитать иллюстрацию так, будто статус и время возникают в разных объектах. После фиксации сервер располагает подтверждённым результатом. Следующий шаг передаст допустимое сокращённое представление клиенту, сохраняя связь с теми же полями.","hint":"Проговорите, что все строки относятся к одной записи. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"request","catalog":"UML-11","title":"Подача заявки: от POST до чтения","kind":"sequence","data":{"actors":["Браузер","Сервер","База"],"note":"Схема сообщений; порядок сверху вниз, без временной шкалы."},"scenarios":[{"label":"Успешное сохранение","input":"Анна 12; проект 17 открыт; мотивация допустима; пары ещё нет.","frames":[{"caption":"Обзор участников. Никаких действий ещё не выполнено.","focus":[],"result":""},{"captio  INSERT; После успешной фиксации; Сразу после нажатия. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: После успешной фиксации. Успех отправляется после подтверждённой фиксации данных, а не до неё. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","hint":"Дайте аудитории выбрать вариант. Ответ и разбор показывайте отдельной командой.","visualDescription":"В какой момент можно подтвердить устойчивое сохранение? До INSERT; После успешной фиксации; Сразу после нажатия","wordCount":53,"estimatedSeconds":49,"quiz":{"id":"З3-Т6","revision":1,"prompt":"В какой момент можно подтвердить устойчивое сохранение?","options":["До INSERT","После успешной фиксации","Сразу после нажатия"],"answer":1,"explanation":"Успех отправляется после подтверждённой фиксации данных, а не до неё."},"plannedSeconds":0,"startSeconds":5484,"requiredWpm":0},{"title":"Размещение приложения","body":"Одинаковая программа может иметь разные настройки и данные","visual":{"type":"section","number":7,"title":"Размещение приложения"},"speech":"Переходим к вопросу 7: размещение приложения. Одинаковая программа может иметь разные настройки и данные. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":7,"id":"З3-С48","number":64,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":29,"startSeconds":5484,"transition":"","script":"Переходим к вопросу 7: размещение приложения. Одинаковая программа может иметь разные настройки и данные. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 7: Размещение приложения. Справа большая серая стрелка, направленная влево.","wordCount":36,"pauseSeconds":8,"estimatedSeconds":28,"requiredWpm":103,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"Адрес приложения","body":"Браузеру нужен доступный сетевой узел и путь","visual":{"type":"pair","items":[{"title":"Локальная и рабочая среда","visual":{"type":"table","columns":["Среда","Назначение","Данные"],"rows":[["Локальная","Разработка и подготовленные проверки","Учебный набор"],["Рабочая","Использование ресурса по общему адресу","Рабочие записи"],["Условие перехода","Настройки согласованы отдельно","Данные не подменяются автоматически"]],"caption":""}},{"title":"Адрес приложения","visual":{"type":"diagram","nodes":["Браузер","Адрес приложения","Серверный процесс"],"edges":[["Браузер","Адрес приложения","Обращение к выбранному имени и схеме"],["Адрес приложения","Серверный процесс","Доставка к доступной точке обслуживания"]],"caption":""}}]},"speech":"Среда — условия, в которых запущено приложение: адреса, процессы, подключения и настройки. Локальная среда удобна разработчику для подготовки изменений. Рабочая доступна пользователям. Один и тот же исходный код может использовать разные адреса базы и режимы. Поэтому успешный запуск на одном компьютере ещё не доказывает готовность для остальных. Необходимо проверить нужную конфигурацию и фактическую доступность компонентов.\n\nУчебные записи не следует автоматически считать рабочими. Перенос версии программы и перенос данных являются разными действиями. В нашем курсе все значения условные. Мы рассматриваем схему размещения, а не предоставляем готовый промышленный сервер «Проектного навигатора». Такая граница помогает честно отделять подготовленные материалы от эксплуатации. Следующий шаг объяснит, как браузер получает адрес нужного приложения.\n\nДля обращения браузеру нужен адрес. В локальной среде это может быть адрес собственного компьютера с номером порта. В рабочей среде обычно используется доменное имя. Порт обозначает точку обслуживания на узле. Путь внутри адреса выбирает страницу или операцию. Эти части не следует смешивать: изменение маршрута API не означает смену всей машины, а изменение домена не обязательно меняет правила заявки.","explanation":"Доступность адреса требует запущенного приложения и подходящей сетевой настройки. Если процесс остановлен, красивое доменное имя само по себе не создаёт ответ. Если открывается стартовая страница, это ещё не доказывает доступ к базе. Поэтому проверку размещения связывают с конкретным полезным сценарием. На следующих слайдах разложим имя, защиту соединения и серверный процесс, чтобы понять их разные обязанности.","hint":"Не переносите учебные примеры в утверждения о рабочем сервисе. Объясните порт как точку обслуживания, без настройки в эфире. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-49","catalog":"Свободная схема","title":"Адрес приложения","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Локальная и рабочая среда","visual":{"type":"table","columns":["Среда","Назначение","Данные"],"rows":[["Локальная","Разработка и подготовленные проверки","Учебный набор"],["Рабочая","Использование ресурса по общему адресу","Рабочие записи"],["Условие перехода","Настройки согласованы отдельно","Данные не подменяются автоматически"]],"caption":""}},{"title":"Адрес приложения","visual":{"type":"diagram","nodes":["Браузер","Адрес приложения","Серверный процесс"],"edges":[["Браузер","Адрес приложения","Обращение к выбранному имени и схеме"],["Адрес приложения","Серверный процесс","Доставка к доступной точке обслуживания"]],"caption":""}}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Браузеру нужен доступный сетевой узел и путь","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Браузер → Адрес приложения: Обращение к выбранному имени и схеме","focus":["v1.e0"],"result":""},{"caption":"Адрес приложения → Серверный процесс: Доставка к доступной точке обслуживания","focus":["v1.e1"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Браузеру нужен доступный сетевой узел и путь"}]}],"structural":true},"question":7,"id":"З3-С49","number":65,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":194,"startSeconds":5513,"transition":"","script":"Среда — условия, в которых запущено приложение: адреса, процессы, подключения и настройки. Локальная среда удобна разработчику для подготовки изменений. Рабочая доступна пользователям. Один и тот же исходный код может использовать разные адреса базы и режимы. Поэтому успешный запуск на одном компьютере ещё не доказывает готовность для остальных. Необходимо проверить нужную конфигурацию и фактическую доступность компонентов.\n\nУчебные записи не следует автоматически считать рабочими. Перенос версии программы и перенос данных являются разными действиями. В нашем курсе все значения условные. Мы рассматриваем схему размещения, а не предоставляем готовый промышленный сервер «Проектного навигатора». Такая граница помогает честно отделять подготовленные материалы от эксплуатации. Следующий шаг объяснит, как браузер получает адрес нужного приложения.\n\nДля обращения браузеру нужен адрес. В локальной среде это может быть адрес собственного компьютера с номером порта. В рабочей среде обычно используется доменное имя. Порт обозначает точку обслуживания на узле. Путь внутри адреса выбирает страницу или операцию. Эти части не следует смешивать: изменение маршрута API не означает смену всей машины, а изменение домена не обязательно меняет правила заявки.\n\nСопоставим записи в таблице. В строке 1 среда: Локальная. назначение: Разработка и подготовленные проверки. данные: Учебный набор. В строке 2 среда: Рабочая. назначение: Использование ресурса по общему адресу. данные: Рабочие записи. В строке 3 среда: Условие перехода. назначение: Настройки согласованы отдельно. данные: Данные не подменяются автоматически.\n\nРассмотрим подписанные связи схемы. Связь между блоками «Браузер» и «Адрес приложения» обозначает следующее: обращение к выбранному имени и схеме. Связь между блоками «Адрес приложения» и «Серверный процесс» обозначает следующее: доставка к доступной точке обслуживания.\n\nДоступность адреса требует запущенного приложения и подходящей сетевой настройки. Если процесс остановлен, красивое доменное имя само по себе не создаёт ответ. Если открывается стартовая страница, это ещё не доказывает доступ к базе. Поэтому проверку размещения связывают с конкретным полезным сценарием. На следующих слайдах разложим имя, защиту соединения и серверный процесс, чтобы понять их разные обязанности.\n\n","visualDescription":"Локальная и рабочая среда. Таблица. Столбцы: Среда; Назначение; Данные. Строка 1: Локальная; Разработка и подготовленные проверки; Учебный набор. Строка 2: Рабочая; Использование ресурса по общему адресу; Рабочие записи. Строка 3: Условие перехода; Настройки согласованы отдельно; Данные не подменяются автоматически.\n\nАдрес приложения. Схема. Блоки: Браузер; Адрес приложения; Серверный процесс. Связи: Браузер — Адрес приложения: Обращение к выбранному имени и схеме; Адрес приложения — Серверный процесс: Доставка к доступной точке обслуживания.","wordCount":299,"pauseSeconds":22,"estimatedSeconds":185,"requiredWpm":104,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"Доменное имя","body":"Имя помогает найти нужный узел, но не заменяет приложение","visual":{"type":"process","items":[{"title":"Имя","text":"Условный projects.example.test читается человеком"},{"title":"Разрешение имени","text":"Система доменных имён помогает определить адрес узла"},{"title":"Обращение","text":"Браузер соединяется с точкой обслуживания"}]},"speech":"Доменное имя — понятное человеку обозначение сетевого ресурса. DNS, Domain Name System, помогает сопоставлять такие имена с адресной информацией. Это отдельная служба от логики заявок. Если сопоставление недоступно или неверно, браузер может не добраться до приложения. При этом данные в базе не обязаны исчезнуть. Разделение помогает сопровождению искать причину в правильной части пути.","explanation":"В примере используем условное имя, а не существующий адрес сервиса. Оно показывает роль домена в схеме. Для рабочего размещения также учитывают управление именем и сертификатом. Мы не даём пошаговую инструкцию регистрации у конкретного поставщика, потому что задача курса — проектное понимание. Дальше посмотрим, что добавляет защищённое соединение и каких свойств оно само по себе не гарантирует.","hint":"DNS — «ди-эн-эс», расшифруйте перед сокращением. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-50","catalog":"Свободная схема","title":"Доменное имя","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Имя","text":"Условный projects.example.test читается человеком"},{"title":"Разрешение имени","text":"Система доменных имён помогает определить адрес узла"},{"title":"Обращение","text":"Браузер соединяется с точкой обслуживания"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Имя помогает найти нужный узел, но не заменяет приложение","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Имя: Условный projects.example.test читается человеком","focus":["p0"],"result":""},{"caption":"Разрешение имени: Система доменных имён помогает определить адрес узла","focus":["p1"],"result":""},{"caption":"Обращение: Браузер соединяется с точкой обслуживания","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Имя помогает найти нужный узел, но не заменяет приложение"}]}],"structural":true},"question":7,"id":"З3-С50","number":66,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":89,"startSeconds":5707,"transition":"","script":"Доменное имя — понятное человеку обозначение сетевого ресурса. DNS, Domain Name System, помогает сопоставлять такие имена с адресной информацией. Это отдельная служба от логики заявок. Если сопоставление недоступно или неверно, браузер может не добраться до приложения. При этом данные в базе не обязаны исчезнуть. Разделение помогает сопровождению искать причину в правильной части пути.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Имя». Условный projects.example.test читается человеком. Второй блок обозначен «Разрешение имени». Система доменных имён помогает определить адрес узла. Третий блок обозначен «Обращение». Браузер соединяется с точкой обслуживания.\n\nВ примере используем условное имя, а не существующий адрес сервиса. Оно показывает роль домена в схеме. Для рабочего размещения также учитывают управление именем и сертификатом. Мы не даём пошаговую инструкцию регистрации у конкретного поставщика, потому что задача курса — проектное понимание. Дальше посмотрим, что добавляет защищённое соединение и каких свойств оно само по себе не гарантирует.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Имя: Условный projects.example.test читается человеком. 2. Разрешение имени: Система доменных имён помогает определить адрес узла. 3. Обращение: Браузер соединяется с точкой обслуживания.","wordCount":142,"pauseSeconds":8,"estimatedSeconds":85,"requiredWpm":105,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"HTTPS","body":"Защищённое соединение дополняет правила приложения","visual":{"type":"table","columns":["Средство","Что обеспечивает","Чего не заменяет"],"rows":[["TLS в HTTPS","Защиту обмена и проверку стороны по принятой модели сертификатов","Правильность бизнес-правил"],["Серверная авторизация","Право Анны или Ирины на действие","Защиту сетевой передачи"],["Ограничения базы","Согласованность записей","Проверку сетевого сертификата"]],"caption":""},"speech":"Эйч-ти-ти-пи-эс, HTTPS, использует защищённое соединение с TLS. Оно помогает защитить передаваемые данные и проверить сервер в рамках модели сертификатов. Но замок в браузере не означает, что программа правильно проверяет роль или не создаёт дубликаты. Эти свойства относятся к другим частям проекта. Поэтому защищённую передачу включают в схему, не приписывая ей решение всех задач надёжности и доступа.","explanation":"Для нашего пути мотивация и сведения пользователя передаются по защищённому соединению в рабочем размещении. Затем сервер всё равно применяет правила. Если пользователь не имеет права на чужую заявку, HTTPS не делает такое действие допустимым. Сопровождение должно также понимать ошибки сертификата как отдельную причину недоступности. Мы ограничиваемся назначением средства и не настраиваем сертификаты во время лекции.","hint":"TLS — «ти-эл-эс», не называйте HTTPS гарантией отсутствия ошибок.","sources":["https://www.rfc-editor.org/rfc/rfc8446.html"],"question":7,"id":"З3-С51","number":67,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":108,"startSeconds":5796,"transition":"","script":"Эйч-ти-ти-пи-эс, HTTPS, использует защищённое соединение с TLS. Оно помогает защитить передаваемые данные и проверить сервер в рамках модели сертификатов. Но замок в браузере не означает, что программа правильно проверяет роль или не создаёт дубликаты. Эти свойства относятся к другим частям проекта. Поэтому защищённую передачу включают в схему, не приписывая ей решение всех задач надёжности и доступа.\n\nСопоставим записи в таблице. В строке 1 средство: TLS в HTTPS. что обеспечивает: Защиту обмена и проверку стороны по принятой модели сертификатов. чего не заменяет: Правильность бизнес-правил. В строке 2 средство: Серверная авторизация. что обеспечивает: Право Анны или Ирины на действие. чего не заменяет: Защиту сетевой передачи. В строке 3 средство: Ограничения базы. что обеспечивает: Согласованность записей. чего не заменяет: Проверку сетевого сертификата.\n\nДля нашего пути мотивация и сведения пользователя передаются по защищённому соединению в рабочем размещении. Затем сервер всё равно применяет правила. Если пользователь не имеет права на чужую заявку, HTTPS не делает такое действие допустимым. Сопровождение должно также понимать ошибки сертификата как отдельную причину недоступности. Мы ограничиваемся назначением средства и не настраиваем сертификаты во время лекции.\n\n","visualDescription":"Таблица. Столбцы: Средство; Что обеспечивает; Чего не заменяет. Строка 1: TLS в HTTPS; Защиту обмена и проверку стороны по принятой модели сертификатов; Правильность бизнес-правил. Строка 2: Серверная авторизация; Право Анны или Ирины на действие; Защиту сетевой передачи. Строка 3: Ограничения базы; Согласованность записей; Проверку сетевого сертификата.","wordCount":174,"pauseSeconds":8,"estimatedSeconds":103,"requiredWpm":104,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"Процесс сервера","body":"Программа должна оставаться запущенной и доступной","visual":{"type":"process","items":[{"title":"Запуск","text":"Рабочая версия начинает принимать обращения"},{"title":"Работа","text":"Процесс выполняет обработчики и использует настройки"},{"title":"Остановка","text":"Новые обращения не получают обычную обработку"}]},"speech":"Сервер в нашей логической схеме — роль программы. В размещении ей соответствует запущенный процесс, то есть выполняющийся экземпляр программы. Если файлы скопированы, но процесс не работает, запросы не обслуживаются. Поэтому выпуск включает запуск и проверку. При необходимости процесс перезапускают после обновления. Нужно заранее определить, как понять, что он действительно принимает обращения, и где смотреть сведения о сбое.","explanation":"Проверка только наличия процесса недостаточна. Он может работать, но не подключаться к базе. Также стартовая страница может отдаваться отдельно от операций API. Для учебного сервиса полезно проверить получение каталога и управляемый путь заявки в подходящем наборе данных. Эти действия показывают связь компонентов. Мы не добавляем конкретный менеджер процессов или операционную систему: выбор зависит от среды и команды.","hint":"Различайте файлы программы и выполняющийся процесс. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-52","catalog":"Свободная схема","title":"Процесс сервера","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Запуск","text":"Рабочая версия начинает принимать обращения"},{"title":"Работа","text":"Процесс выполняет обработчики и использует настройки"},{"title":"Остановка","text":"Новые обращения не получают обычную обработку"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Программа должна оставаться запущенной и доступной","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Запуск: Рабочая версия начинает принимать обращения","focus":["p0"],"result":""},{"caption":"Работа: Процесс выполняет обработчики и использует настройки","focus":["p1"],"result":""},{"caption":"Остановка: Новые обращения не получают обычную обработку","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Программа должна оставаться запущенной и доступной"}]}],"structural":true},"question":7,"id":"З3-С52","number":68,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":92,"startSeconds":5904,"transition":"","script":"Сервер в нашей логической схеме — роль программы. В размещении ей соответствует запущенный процесс, то есть выполняющийся экземпляр программы. Если файлы скопированы, но процесс не работает, запросы не обслуживаются. Поэтому выпуск включает запуск и проверку. При необходимости процесс перезапускают после обновления. Нужно заранее определить, как понять, что он действительно принимает обращения, и где смотреть сведения о сбое.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Запуск». Рабочая версия начинает принимать обращения. Второй блок обозначен «Работа». Процесс выполняет обработчики и использует настройки. Третий блок обозначен «Остановка». Новые обращения не получают обычную обработку.\n\nПроверка только наличия процесса недостаточна. Он может работать, но не подключаться к базе. Также стартовая страница может отдаваться отдельно от операций API. Для учебного сервиса полезно проверить получение каталога и управляемый путь заявки в подходящем наборе данных. Эти действия показывают связь компонентов. Мы не добавляем конкретный менеджер процессов или операционную систему: выбор зависит от среды и команды.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Запуск: Рабочая версия начинает принимать обращения. 2. Работа: Процесс выполняет обработчики и использует настройки. 3. Остановка: Новые обращения не получают обычную обработку.","wordCount":146,"pauseSeconds":8,"estimatedSeconds":88,"requiredWpm":104,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"Подключение к базе","body":"Обработка использует отдельные параметры доступа к данным","visual":{"type":"diagram","nodes":["Серверный процесс","Настройки подключения","База данных"],"edges":[["Серверный процесс","Настройки подключения","Адрес и необходимые полномочия"],["Серверный процесс","База данных","Чтение и изменение через подключение"]],"caption":""},"speech":"Чтобы читать проекты и сохранять заявки, сервер устанавливает подключение к базе. Ему нужны адрес, имя хранилища и подходящие полномочия. Эти сведения относятся к конфигурации среды, а не к пользовательской форме. Браузер не должен получать доступ для произвольного выполнения команд в базе. Он обращается к согласованным операциям сервера, которые применяют правила. Такое разделение сохраняет выбранную архитектуру.","explanation":"Если подключение недоступно, сервер не может честно подтвердить новое сохранение. Результат должен отражать сбой обработки, а технические сведения помогут сопровождению. Нельзя заменять ошибку базы сообщением о короткой мотивации. Для диагностики также полезно различать отказ подключения и нарушение ожидаемого ограничения уникальности. Один случай означает инфраструктурную проблему, другой — конфликт с текущим состоянием данных при допустимой работе базы.","hint":"Не показывайте реальные параметры или секреты подключения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-53","catalog":"Свободная схема","title":"Подключение к базе","kind":"visual","data":{"visual":{"type":"diagram","nodes":["Серверный процесс","Настройки подключения","База данных"],"edges":[["Серверный процесс","Настройки подключения","Адрес и необходимые полномочия"],["Серверный процесс","База данных","Чтение и изменение через подключение"]],"caption":""},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Обработка использует отдельные параметры доступа к данным","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Серверный процесс → Настройки подключения: Адрес и необходимые полномочия","focus":["e0"],"result":""},{"caption":"Серверный процесс → База данных: Чтение и изменение через подключение","focus":["e1"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Обработка использует отдельные параметры доступа к данным"}]}],"structural":true},"question":7,"id":"З3-С53","number":69,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":96,"startSeconds":5996,"transition":"","script":"Чтобы читать проекты и сохранять заявки, сервер устанавливает подключение к базе. Ему нужны адрес, имя хранилища и подходящие полномочия. Эти сведения относятся к конфигурации среды, а не к пользовательской форме. Браузер не должен получать доступ для произвольного выполнения команд в базе. Он обращается к согласованным операциям сервера, которые применяют правила. Такое разделение сохраняет выбранную архитектуру.\n\nРассмотрим подписанные связи схемы. Связь между блоками «Серверный процесс» и «Настройки подключения» обозначает следующее: адрес и необходимые полномочия. Связь между блоками «Серверный процесс» и «База данных» обозначает следующее: чтение и изменение через подключение.\n\nЕсли подключение недоступно, сервер не может честно подтвердить новое сохранение. Результат должен отражать сбой обработки, а технические сведения помогут сопровождению. Нельзя заменять ошибку базы сообщением о короткой мотивации. Для диагностики также полезно различать отказ подключения и нарушение ожидаемого ограничения уникальности. Один случай означает инфраструктурную проблему, другой — конфликт с текущим состоянием данных при допустимой работе базы.\n\n","visualDescription":"Схема. Блоки: Серверный процесс; Настройки подключения; База данных. Связи: Серверный процесс — Настройки подключения: Адрес и необходимые полномочия; Серверный процесс — База данных: Чтение и изменение через подключение.","wordCount":143,"pauseSeconds":14,"estimatedSeconds":92,"requiredWpm":105,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"Конфигурация","body":"Параметры среды отделяют от правил и пользовательских данных","visual":{"type":"table","columns":["Параметр","Учебное обозначение","Назначение"],"rows":[["Адрес базы","DB_URL = значение среды","Подключение к нужному хранилищу"],["Режим","APP_ENV = production","Условия запуска"],["Адрес приложения","APP_ORIGIN = рабочий адрес","Согласованное обращение"],["Доступ","Секреты не включены в пример","Не публикуются в клиентском коде"]],"caption":""},"speech":"Конфигурация задаёт параметры запуска для выбранной среды. Она позволяет использовать рабочую версию с правильной базой и адресом без редактирования пользовательской формы. В таблице показаны условные имена, а не настоящие секреты. Их значения передаются подходящим способом среды размещения. Правило длины мотивации и адрес базы имеют разный смысл: первое описывает договор проекта, второе — условия подключения.","explanation":"Ошибка конфигурации может выглядеть как неработающее приложение, хотя код и данные сами по себе корректны. Поэтому перед выпуском проверяют наличие параметров и соответствие нужной среде. Особенно опасно случайно подключить рабочую версию к учебному хранилищу. Мы не запускаем настройку в эфире, а показываем подготовленный перечень сведений и последствий. Этого достаточно, чтобы ведущий объяснил границу между программой и средой её выполнения.","hint":"Значения параметров условные, реальные секреты не требуются.","sources":[],"question":7,"id":"З3-С54","number":70,"blockTitle":"Размещение приложения","blockIndex":6,"plannedSeconds":111,"startSeconds":6092,"transition":"","script":"Конфигурация задаёт параметры запуска для выбранной среды. Она позволяет использовать рабочую версию с правильной базой и адресом без редактирования пользовательской формы. В таблице показаны условные имена, а не настоящие секреты. Их значения передаются подходящим способом среды размещения. Правило длины мотивации и адрес базы имеют разный смысл: первое описывает договор проекта, второе — условия подключения.\n\nСопоставим записи в таблице. В строке 1 параметр: Адрес базы. учебное обозначение: DB_URL = значение среды. назначение: Подключение к нужному хранилищу. В строке 2 параметр: Режим. учебное обозначение: APP_ENV = production. назначение: Условия запуска. В строке 3 параметр: Адрес приложения. учебное обозначение: APP_ORIGIN = рабочий адрес. назначение: Согласованное обращение. В строке 4 параметр: Доступ. учебное обозначение: Секреты не включены в пример. назначение: Не публикуются в клиентском коде.\n\nОшибка конфигурации может выглядеть как неработающее приложение, хотя код и данные сами по себе корректны. Поэтому перед выпуском проверяют наличие параметров и соответствие нужной среде. Особенно опасно случайно подключить рабочую версию к учебному хранилищу. Мы не запускаем настройку в эфире, а показываем подготовленный перечень сведений и последствий. Этого достаточно, чтобы ведущий объяснил границу между программой и средой её выполнения.\n\n","visualDescription":"Таблица. Столбцы: Параметр; Учебное обозначение; Назначение. Строка 1: Адрес базы; DB_URL = значение среды; Подключение к нужному хранилищу. Строка 2: Режим; APP_ENV = production; Условия запуска. Строка 3: Адрес приложения; APP_ORIGIN = рабочий адрес; Согласованное обращение. Строка 4: Доступ; Секреты не включены в пример; Не публикуются в клиентском коде.","wordCount":179,"pauseSeconds":8,"estimatedSeconds":106,"requiredWpm":104,"links":"webinar-3, Размещение приложения; учебные правила проекта"},{"title":"Доступность компонентов","body":"Рабочая страница не доказывает исправность полного пути","visual":{"type":"table","columns":["Компонент","Признак","Ограничение вывода"],"rows":[["Страница интерфейса","Загрузилась оболочка","API может быть недоступен"],["API каталога","Получен ожидаемый список","Запись может не работать"],["База","Доступны нужные операции","Права пользователя ещё проверяются"],["Полный сценарий","Получен согласованный результат","Нужны также отрицательные проверки"]],"caption":""},"speech":"Доступность нужно оценивать по составу системы. Загрузка страницы показывает, что браузер получил оболочку. Получение каталога подтверждает ещё часть пути. Создание в контролируемом сценарии проверяет запись, но не доказывает все права и ограничения. Поэтому нельзя объявить систему готовой по одному зелёному индикатору. Нужно связать признаки с тем, что они действительно подтверждают.","explanation":"Для нашего примера критерии выпуска включат доступность компонентов и подготовленные проверки основного поведения. При отказе важно понять, где оборвался путь. Ошибка имени, соединения, процесса и базы требует разных действий. Схема размещения помогает сопоставить симптом с зависимостью, а журнал и метрики дополнят её на четвёртом занятии. Теперь перейдём к управляемому выпуску новой версии и сохранению возможности восстановления.\n\nРассмотрим отказ каждого компонента отдельно. Если доменное имя не разрешается, браузер не получает адрес сервера. Если адрес найден, но процесс приложения остановлен, запрос не обработается. Если приложение работает, но не может подключиться к базе, оно не должно выдавать сохранение заявки за успешное. Одна общая надпись «сайт не работает» скрывает разные места отказа и приводит к случайным попыткам исправления.\n\nВ рабочей среде необходимо согласовать адрес, защищённое соединение, запуск процесса и доступ к данным. Параметры подключения относятся к окружению. Пароли не следует помещать в клиентский код, который получает браузер. Разделение сред позволяет проверять изменения на учебных данных до запуска для пользователей. При этом успешный запуск главной страницы ещё не доказывает работоспособность подачи заявки. Для проверки требуется пройти действие с сохранением и последующим чтением. Если приложение размещено за промежуточным сервером, ответственность каждого звена также должна быть понятна. Схема размещения отвечает на практический вопрос: где выполняется действие и что должно быть доступно, чтобы оно завершилось. Выбор конкретного поставщика инфраструктуры не заменяет этого описания.","hint" дрес","Совпадает с опубликованным маршрутом"],["Защищённый обмен","Сертификат и HTTPS подходят адресу"],["Сведения о версии","Можно установить действующую редакцию"]],"caption":""}}]},"speech":"Версия обозначает конкретный набор изменений. Перед выпуском нужно знать, что проверено и что меняется. Затем готовят конфигурацию, оценивают структуру данных и способ восстановления. Размещение выполняют по понятному порядку, после чего подтверждают работу ключевого пути. Такой процесс снижает неопределённость: при проблеме можно установить, какая версия действует и что было сделано. Случайное копирование отдельных файлов затрудняет этот разбор.\n\nВ нашем учебном случае мы показываем порядок, а не выполняем промышленный выпуск. Ожидаемые проверки ещё не являются фактически пройденными. При работе с настоящим сервисом результат фиксируют отдельно. Полезно заранее определить, что считать неудачным выпуском и кто принимает решение о возврате. Следующие слайды раскроют настройки, изменение структуры, резервную копию и ограничения отката.\n\nПодготовка настроек предотвращает часть ошибок ещё до переключения пользователей. Проверяем, что выбрана нужная среда, подключение ведёт к правильной базе, а рабочий адрес соответствует размещению. Защищённое соединение должно подходить этому имени. Полезно иметь способ установить действующую версию, иначе разбор сообщения пользователя начнётся с догадок. При этом внутренние секреты не должны появиться на публичной странице.","explanation":"Перечень на экране — готовая памятка, а не предложение аудитории что-то настроить. Ведущий объясняет назначение каждого пункта. Нельзя считать его универсальным исчерпывающим регламентом для любого сервиса. Состав зависит от архитектуры и среды. Для «Проектного навигатора» он связывает уже введённые элементы, поэтому не добавляет внезапные внешние службы и сложные механизмы, которых нет в базовой версии.","hint":"Отметьте, что схема описывает подготовленный порядок. Покажите памятку как последовательность ожидаемое состояние: Совпадает с опубликованным маршрутом. В строке 4 проверяем: Защищённый обмен. ожидаемое состояние: Сертификат и HTTPS подходят адресу. В строке 5 проверяем: Сведения о версии. ожидаемое состояние: Можно установить действующую редакцию.\n\nПеречень на экране — готовая памятка, а не предложение аудитории что-то настроить. Ведущий объясняет назначение каждого пункта. Нельзя считать его универсальным исчерпывающим регламентом для любого сервиса. Состав зависит от архитектуры и среды. Для «Проектного навигатора» он связывает уже введённые элементы, поэтому не добавляет внезапные внешние службы и сложные механизмы, которых нет в базовой версии.\n\n","visualDescription":"Выпуск версии. Последовательность подписанных блоков. 1. Выбор версии: Известно, какой проверенный вариант выпускают. 2. Подготовка: Настройки, совместимость данных и резервирование. 3. Размещение: Обновление и запуск по принятому порядку. 4. Подтверждение: Проверка доступности и ключевого сценария.\n\nПодготовка настроек выпуска. Таблица. Столбцы: Проверяем; Ожидаемое состояние. Строка 1: Среда; Выбрана рабочая, а не локальная. Строка 2: Подключение; Доступна нужная база. Строка 3: Адрес; Совпадает с опубликованным маршрутом. Строка 4: Защищённый обмен; Сертификат и HTTPS подходят адресу. Строка 5: Сведения о версии; Можно установить действующую редакцию.","wordCount":318,"pauseSeconds":16,"estimatedSeconds":189,"requiredWpm":105,"links":"webinar-3, Выпуск версии; учебные правила проекта"},{"title":"Обновление структуры данных","body":"Новая программа должна понимать существующие записи","visual":{"type":"process","items":[{"title":"Изменение схемы","text":"Подготовленная операция меняет структуру хранения"},{"title":"Совместимость","text":"Проверяется чтение старых и новых записей"},{"title":"Порядок","text":"Обновление данных согласовано с выпуском программы"}]},"speech":"Миграция схемы — управляемое изменение структуры базы. Например, при новом правиле может понадобиться дополнительное ограничение. Перед применением проверяют, соответствуют ли ему существующие записи. Если уже есть дубликаты, добавление уникальной пары потребует отдельного решения по данным. Нельзя просто объявить изменение безопасным потому, что команда короткая. Также новая и старая версии программы должны быть согласованы со структурой.","explanation":"В нашем базовом учебном наборе схема уже соответствует правилам. Мы рассматриваем миграцию как часть будущего выпуска, не изменяя данные в эфире. Если расширение добавляет необязательное поле, это одна сложность. Если удаляет сведения, это другая и может затруднить возврат. Поэтому план изменения должен включать проверку результата и условия восстановления, а не только команду выполнения. Следующий слайд разберёт роль резервной копии.","hint":"Миграция здесь относится к схеме данных, а не к переносу пользователя. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-3-58","catalog":"Свободная схема","title":"Обновление структуры данных","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Изменение схемы","text":"Подготовленная операция меняет структуру хранения"},{"title":"Совместимость","text":"Проверяется чтение старых и новых записей"},{"title":"Порядок","text":"Обновление данных согласовано с выпуском программы"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Новая программа должна понимать существующие записи","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Изменение схемы: Подготовленная операция меняет структуру хранения","focus":["p0"],"result":""},{"caption":"Совместимость: Проверяется чтение старых и новых записей","focus":["p1"],"result":""},{"caption":"Порядок: Обновление данных согласовано с выпуском программы","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Новая программа должна понимать существующие записи"}]}],"structural":true},"question":8,"id":"З3-С58","number":76,"blockTitle":"Выпуск версии","blockIndex":7,"plannedSeconds":92,"startSeconds":6632,"transition":"","script":"Миграция схемы — управляемое изменение структуры базы. Например, при новом правиле может понадобиться дополнительное ограничение. Перед применением проверяют, соответствуют ли ему существующие записи. Если уже есть дубликаты, добавление уникальной пары потребует отдельного решения по данным. Нельзя просто объявить изменение безопасным потому, что команда короткая. Также новая и старая версии программы должны быть согласованы со структурой.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Изменение схемы». Подготовленная операция меняет структуру хранения. Второй блок обозначен «Совместимость». Проверяется чтение старых и новых записей. Третий блок обозначен «Порядок». Обновление данных согласовано с выпуском программы.\n\nВ нашем базовом учебном наборе схема уже соответствует правилам. Мы рассматриваем миграцию как часть будущего выпуска, не изменяя данные в эфире. Если расширение добавляет необязательное поле, это одна сложность. Если удаляет сведения, это другая и может затруднить возврат. Поэтому план изменения должен включать проверку результата и условия восстановления, а не только команду выполнения. Следующий слайд разберёт роль резервной копии.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Изменение схемы: Подготовленная операция меняет структуру хранения. 2. Совместимость: Проверяется чтение старых и новых записей. 3. Порядок: Обновление данных согласовано с выпуском программы.","wordCount":147,"pauseSeconds":8,"estimatedSeconds":88,"requiredWpm":105,"links":"webinar-3, Выпуск версии; учебные правила проекта"},{"title":"Резервная копия","body":"Восстановление требует пригодной копии и проверенного порядка","visual":{"type":"pair","items":[{"title":"Резервная копия","visual":{"type":"table","columns":["Шаг","Назначение"],"rows":[["Подготовить копию","Сохранить состояние до рискованного изменения"],["Проверить состав","Убедиться, что нужные данные включены"],["Проверить восстановление","Установить, что копия действительно пригодна"],["Учесть время","После копии могли появиться новые записи"]],"caption":""}},{"title":"Возврат версии и передача в сопровождение","visual":{"type":"process","items":[{"title":"Решение о возврате","text":"Известен признак неудачного выпуска"},{"title":"Проверка совместимости","text":"Предыдущая программа работает с текущими данными"},{"title":"Восстановление","text":"Учитываются изменения схемы и новые записи"},{"title":"Передача","text":"Зафиксированы версия, адреса проверки и порядок разбора"}]}}]},"speech":"Резервная копия нужна для восстановления, а не для формального наличия файла. Нужно понимать, какие данные и момент она охватывает, где хранится и каким способом возвращается. Проверка восстановления показывает больше, чем успешное создание архива. Если после копии Анна подала новую заявку, возврат к старому состоянию может потерять это обращение. Поэтому восстановление требует оценки последствий и согласованного порядка.\n\nОткат программы означает возврат к предыдущей версии, но не обязательно возврат данных. Если схема изменилась несовместимо, старый код может перестать работать. Если восстановить старую копию базы, можно потерять более поздние обращения. Поэтому план восстановления оценивает все части вместе. После успешного выпуска в сопровождение передают действующую версию, способ проверки и сведения, необходимые для поиска причины сбоя.\n\nМы разобрали, как система выполняет запрос. Теперь необходимо определить, как обнаружить неправильное поведение, найти причину сбоя и понять, какие изменения принесут пользу. На четвёртом лекции свяжем требования с проверками, наблюдением, аналитикой и расширениями. Там же вернёмся к случаю сохранённой заявки, чей ответ не дошёл до Анны, и разберём его по подготовленным сведениям.","explanation":"У разных систем есть разные способы резервирования. Мы не выбираем конкретный режим по одной схеме. Для курса важно увидеть зависимость между выпуском, изменением данных и возможной потерей более поздних записей. Копия не заменяет совместимость программы и схемы, а старый исполняемый файл не восстанавливает удалённые сведения сам по себе. Эти ограничения объясняют, почему последний шаг выпуска требует отдельного плана возврата.\n\nПеред выпуском проверим зависимость версии приложения от структуры базы. Новый код может ожидать поле, которого ещё нет, а прежний код после изменения структуры может работать иначе. Поэтому порядок обновления описывают заранее и проверяют на копии среды. Сам факт успешной сборки файлов интерфейса не подтверждает совместимость всей системы.\n\nРезервная копия полезна только вместе с проверяемой процедурой восстановления. Нужно знать, что сохранено, к какому моменту относятся данные и кто может выполнить восстановление. Возврат предыдущих файлов приложения и восстановление базы имеют разные последствия. Если после выпуска появились новые заявки, восстановление старого снимка может их потерять. Поэтому откат нельзя описать одной кнопкой без условий. Иногда безопаснее исправить ошибку следующей версией, сохранив актуальные данные. Для нашего учебного выпуска готовят план, известные ограничения и проверку основного сценария. После изменений Анна должна иметь возможность подать допустимую заявку, увидеть её в своём списке, а Ирина должна прочитать её в заявках собственного проекта. Такой критерий связывает технический выпуск с пользовательским результатом и задаёт основу передачи в сопровождение.","hint":"Не называйте непроверенную копию гарантией восстановления. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":["https://www.postgresql.org/docs/current/backup.html"],"learning":{"id":"explain-3-59","catalog":"Свободная схема","title":"Резервная копия","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Резервная копия","visual":{"type":"table","columns":["Шаг","Назначение"],"rows":[["Подготовить копию","Сохранить состояние до рискованного изменения"],["Проверить состав","Убедиться, что нужные данные включены"],["Проверить восстановление","Установить, что копия действительно пригодна"],["Учесть время","После копии могли появиться новые записи"]],"caption":""}},{"title":"Возврат версии и передача в сопровождение","visual":{"type":"process","items":[{"title":"Решение о возврате","text":"Известен признак неудачного выпуска"},{"title":"Проверка совместимости","text":"Предыдущая программа работает с текущими данными"},{"title":"Восстановление","text":"Учитываются изменения схемы и новые записи"},{"title":"Передача","text":"Зафиксированы версия, адреса проверки и порядок разбора"}]}}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Восстановление требует пригодной копии и проверенного порядка","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Решение о возврате: Известен признак неудачного выпуска","focus":["v1.p0"],"result":""},{"caption":"Проверка совместимости: Предыдущая программа работает с текущими данными","focus":["v1.p1"],"result":""},{"caption":"Восстановление: Учитываются изменения схемы и новые записи","focus":["v1.p2"],"result":""},{"caption":"Передача: Зафиксированы версия, адреса проверки и порядок разбора","focus":["v1.p3"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Восстановление требует пригодной копии и проверенного порядка"}]}],"structural":true},"question":8,"id":"З3-С59","number":77,"blockTitle":"Выпуск версии","blockIndex":7,"plannedSeconds":290,"startSeconds":6724,"transition":"","script":"Резервная копия нужна для восстановления, а не для формального наличия файла. Нужно понимать, какие данные и момент она охватывает, где хранится и каким способом возвращается. Проверка восстановления показывает больше, чем успешное создание архива. Если после копии Анна подала новую заявку, возврат к старому состоянию может потерять это обращение. Поэтому восстановление требует оценки последствий и согласованного порядка.\n\nОткат программы означает возврат к предыдущей версии, но не обязательно возврат данных. Если схема изменилась несовместимо, старый код может перестать работать. Если восстановить старую копию базы, можно потерять более поздние обращения. Поэтому план восстановления оценивает все части вместе. После успешного выпуска в сопровождение передают действующую версию, способ проверки и сведения, необходимые для поиска причины сбоя.\n\nМы разобрали, как система выполняет запрос. Теперь необходимо определить, как обнаружить неправильное поведение, найти причину сбоя и понять, какие изменения принесут пользу. На четвёртом лекции свяжем требования с проверками, наблюдением, аналитикой и расширениями. Там же вернёмся к случаю сохранённой заявки, чей ответ не дошёл до Анны, и разберём его по подготовленным сведениям.\n\nСопоставим записи в таблице. В строке 1 шаг: Подготовить копию. назначение: Сохранить состояние до рискованного изменения. В строке 2 шаг: Проверить состав. назначение: Убедиться, что нужные данные включены. В строке 3 шаг: Проверить восстановление. назначение: Установить, что копия действительно пригодна. В строке 4 шаг: Учесть время. назначение: После копии могли появиться новые записи.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Решение о возврате». Известен признак неудачного выпуска. Второй блок обозначен «Проверка совместимости». Предыдущая программа работает с текущими данными. Третий блок обозначен «Восстановление». Учитываются изменения схемы и новые записи. Четвёртый блок обозначен «Передача». Зафиксированы версия, адреса проверки и порядок разбора.\n\nУ разных систем есть разные способы резервирования. Мы не выбираем конкретный режим по одной схеме. Для курса важно увидеть зависимость между выпуском, изменением данных и возможной потерей более поздних записей. Копия не заменяет совместимость программы и схемы, а старый исполняемый файл не восстанавливает удалённые сведения сам по себе. Эти ограничения объясняют, почему последний шаг выпуска требует отдельного плана возврата.\n\nПеред выпуском проверим зависимость версии приложения от структуры базы. Новый код может ожидать поле, которого ещё нет, а прежний код после изменения структуры может работать иначе. Поэтому порядок обновления описывают заранее и проверяют на копии среды. Сам факт успешной сборки файлов интерфейса не подтверждает совместимость всей системы.\n\nРезервная копия полезна только вместе с проверяемой процедурой восстановления. Нужно знать, что сохранено, к какому моменту относятся данные и кто может выполнить восстановление. Возврат предыдущих файлов приложения и восстановление базы имеют разные последствия. Если после выпуска появились новые заявки, восстановление старого снимка может их потерять. Поэтому откат нельзя описать одной кнопкой без условий. Иногда безопаснее исправить ошибку следующей версией, сохранив актуальные данные. Для нашего учебного выпуска готовят план, известные ограничения и проверку основного сценария. После изменений Анна должна иметь возможность подать допустимую заявку, увидеть её в своём списке, а Ирина должна прочитать её в заявках собственного проекта. Такой критерий связывает технический выпуск с пользовательским результатом и задаёт основу передачи в сопровождение.\n\n","visualDescription":"Резервная копия. Таблица. Столбцы: Шаг; Назначение. Строка 1: Подготовить копию; Сохранить состояние до рискованного изменения. Строка 2: Проверить состав; Убедиться, что нужные данные включены. Строка 3: Проверить восстановление; Установить, что копия действительно пригодна. Строка 4: Учесть время; После копии могли появиться новые записи.\n\nВозврат версии и передача в сопровождение. Последовательность подписанных блоков. 1. Решение о возврате: Известен признак неудачного выпуска. 2. Проверка совместимости: Предыдущая программа работает с текущими данными. 3. Восстановление: Учитываются изменения схемы и новые записи. 4. Передача: Зафиксированы версия, адреса проверки и порядок разбора.","wordCount":479,"pauseSeconds":16,"estimatedSeconds":277,"requiredWpm":105,"links":"webinar-3, Выпуск версии; учебные правила проекта"},{"supplemental":true,"question":8,"blockIndex":7,"blockTitle":"Выпуск версии","sources":["https://www.postgresql.org/docs/current/backup.html"],"notebook":"","links":"webinar-3, Выпуск версии; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":78,"id":"З3-П8","title":"Практика: Готовность выпуска","kind":"practice","visual":{"type":"practice"},"speech":"Применим понятия вопроса к новому учебному случаю. Учебный случай: новая версия ожидает дополнительный столбец. Сначала запишите прогноз. Затем последовательно исследуйте факты: Код уже собран. Миграция на целевой базе ещё не выполнена. Старая версия должна иметь путь восстановления. Выберите решение и объясните его. Обоснованный вывод: Совместимость схемы, миграцию и восстановление. Новый код должен соответствовать схеме целевой базы. До переключения нужны проверенные миграция и возможность восстановления. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","script":"Применим понятия вопроса к новому учебному случаю. Учебный случай: новая версия ожидает дополнительный столбец. Сначала запишите прогноз. Затем последовательно исследуйте факты: Код уже собран. Миграция на целевой базе ещё не выполнена. Старая версия должна иметь путь восстановления document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#pdf').onclick=()=>window.print();document.querySelector('#notes').onclick=()=>{document.body.classList.toggle('with-notes');document.querySelector('#notes').textContent=document.body.classList.contains('with-notes')?'Скрыть сценарий':'Показать сценарий';};document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.addEventListener('keydown',ev=>{if(activityMode||ev.target.closest('input,textarea,select,dialog,[contenteditable=true],.quiz,.table-scroll'))return;if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(ev.key)){ev.preventDefault();show(ev.key==='Home'?0:ev.key==='End'?pages.length-1:current+(['ArrowRight','PageDown'].includes(ev.key)?1:-1));}});window.addEventListener('hashchange',()=>{if(activityMode||new URLSearchParams(location.hash.slice(1)).has('activity')){location.reload();return;}const n=Number(new URLSearchParams(location.hash.slice(1)).get('slide')||1)-1;if(n!==current)show(n);});const aid=new URLSearchParams(location.hash.slice(1)).get('activity');if(!aid)show(Number(new URLSearchParams(location.hash.slice(1)).get('slide')||1)-1);if(aid){activityMode=true;const s=l.slides.find(x=>x.id===aid);root.innerHTML=window.PISPractice.activity(s,location.pathname+'#slide='+s.number,l);window.PISPractice.bindActivity(root,s.activity);document.querySelector('.offline-toolbar').hidden=true;document.querySelector('.offline-controls').hidden=true;}</script></body></html>
