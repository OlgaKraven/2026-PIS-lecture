в.\n\nОтложенная возможность остаётся за границей первой версии по конкретной причине. Чат может быть полезен, но для регистрации и решения достаточно мотивационного текста. Вложения требуют дополнительных ограничений, которые ещё не определены. Подбор проектов будем рассматривать как развитие после появления понятного базового пути. Мы сохраняем пожелания, чтобы не потерять идею, однако не считаем их уже реализованными или согласованными.","explanation":"Такое разделение делает объём проекта обозримым. Когда позже обсуждается поиск по интересам, мы явно назовём его расширением. В исходных таблицах не появятся скрытые поля интересов или файлов. Это позволит оценить, какие изменения действительно необходимы новой функции, и сравнить пользу с дополнительной сложностью.","hint":"Читайте таблицу через причину включения функции. Не называйте отложенные функции ошибочными.","sources":[],"question":7,"id":"З1-С46","number":62,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":187,"startSeconds":5202,"transition":"","script":"Первая версия должна позволять пройти согласованный путь до полезного результата. Если оставить только каталог, Анна не сможет подать заявку. Если оставить форму без списка преподавателя, обращение некому рассмотреть. Поэтому состав версии определяют связностью действий. Каждая возможность на экране закрывает необходимый шаг. Такой подход помогает не сокращать продукт до внешне законченной, но практически бесполезной части.\n\nВ нашем учебном варианте каталог заранее заполнен, а вход уже действует. Это зафиксированные допущения. Мы можем сосредоточиться на создании и рассмотрении заявки, не добавляя редактор проектов. Полнота оценивается относительно выбранного сценария и границ, а не относительно всех возможностей похожих сервисов.\n\nОтложенная возможность остаётся за границей первой версии по конкретной причине. Чат может быть полезен, но для регистрации и решения достаточно мотивационного текста. Вложения требуют дополнительных ограничений, которые ещё не определены. Подбор проектов будем рассматривать как развитие после появления понятного базового пути. Мы сохраняем пожелания, чтобы не потерять идею, однако не считаем их уже реализованными или согласованными.\n\nСопоставим записи в таблице. В строке 1 необходимая возможность: Каталог и карточка. почему входит: Анна должна выбрать проект. В строке 2 необходимая возможность: Форма заявки. почему входит: Анна передаёт мотивацию. В строке 3 необходимая возможность: Мои заявки. почему входит: Анна видит подтверждение и итог. В строке 4 необходимая возможность: Рассмотрение преподавателем. почему входит: Ирина завершает процесс решением.\n\nСопоставим записи в таблице. В строке 1 пожелание: Чат. причина отложить: Основное решение принимают без переписки внутри сервиса. В строке 2 пожелание: Вложения. причина отложить: Нужны новые правила файлов и хранения. В строке 3 пожелание: Видеовстречи. причина отложить: Не входят в путь регистрации заявки. В строке 4 пожелание: Подбор проектов. причина отложить: Сначала нужен устойчивый базовый каталог.\n\nТакое разделение делает объём проекта обозримым. Когда позже обсуждается поиск по интересам, мы явно назовём его расширением. В исходных таблицах не появятся скрытые поля интересов или файлов. Это позволит оценить, какие изменения действительно необходимы новой функции, и сравнить пользу с дополнительной сложностью.\n\n","visualDescription":"Состав первой версии. Таблица. Столбцы: Необходимая возможность; Почему входит. Строка 1: Каталог и карточка; Анна должна выбрать проект. Строка 2: Форма заявки; Анна передаёт мотивацию. Строка 3: Мои заявки; Анна видит подтверждение и итог. Строка 4: Рассмотрение преподавателем; Ирина завершает процесс решением.\n\nОтложенные возможности. Таблица. Столбцы: Пожелание; Причина отложить. Строка 1: Чат; Основное решение принимают без переписки внутри сервиса. Строка 2: Вложения; Нужны новые правила файлов и хранения. Строка 3: Видеовстречи; Не входят в путь регистрации заявки. Строка 4: Подбор проектов; Сначала нужен устойчивый базовый каталог.","wordCount":306,"pauseSeconds":16,"estimatedSeconds":183,"requiredWpm":107,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"Общая архитектура","body":"Браузер показывает, сервер применяет правила, база хранит","visual":{"type":"diagram","nodes":["Браузер","Сервер","База данных"],"edges":[["Браузер","Сервер","Запрос"],["Сервер","База данных","Чтение и сохранение"],["Сервер","Браузер","Ответ"]],"caption":""},"speech":"Архитектура описывает существенные части приложения и их взаимодействия. В нашей учебной схеме три части. Браузер показывает форму и результат. Сервер получает обращение и проверяет правила. База хранит пользователей, проекты и заявки. Связи идут через сервер: браузер не получает прямое право произвольно менять таблицы. Пока схема не задаёт число компьютеров или процессов. Она распределяет ответственность.","explanation":"Такое разделение объясняет, почему одна и та же проверка может иметь разные задачи. В браузере ограничение длины помогает человеку быстро исправить текст. На сервере проверка определяет допустимость обращения. В базе ограничения защищают согласованность записей. Эти действия поддерживают одно правило на разных границах.\n\nСхему архитектуры полезно читать по одному конкретному действию. Браузер получил мотивацию и передал её серверу. Сервер определил Анну и проверил условия. База сохранила одну заявку. Сервер вернул результат, браузер показал подтверждение. Мы не выводим из этой схемы, что каждая часть обязательно находится на отдельном компьютере. Логическая ответственность и физическое размещение являются разными вопросами. Их не следует смешивать при объяснении.\n\nЕсли приложение небольшое, несколько обязанностей могут выполняться в одном процессе. Это не отменяет необходимости понимать границы данных и доверия. Интерфейс по-прежнему не выбирает право, а хранение по-прежнему поддерживает устойчивый результат. Такой уровень схемы достаточен для первого занятия. На третьем лекции он получит подробный обмен и отдельный разбор размещения, где появятся адреса и конфигурация.","hint":"Прочитайте названия частей и ответственность каждой. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"architecture","catalog":"ARCH-02","title":"Ответственность частей приложения","kind":"graph","data":{"nodes":["Браузер Анны","Сервер приложения","База данных"],"edges":[[0,1,"HTTPS · запрос и ответ"],[1,2,"SQL · чтение и запись"]]},"scenarios":[{"label":"Структура приложения","input":"Состав приложения; стрелки обозначают каналы взаимодействия, а не текущий запрос.","frames":[{"caption":"Обзор: браузер, сервер и база имеют разные обязанности.","focus":[],"result":""},{"caption":"Браузер показывает форму и состояние обмена.","focus":["n0"],"result":""},{"caption":"Сервер определяет пользователя и проверяет правила.","focus":["n1","e0"],"result":""},{"caption":"База поддерживает ключи, связи и единственность пары.","focus":["n2","e1"],"result":"Структурная связь не означает выполнение запроса."}]}],"structural":true},"question":7,"id":"З1-С47","number":63,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":157,"startSeconds":5389,"transition":"","script":"Архитектура описывает существенные части приложения и их взаимодействия. В нашей учебной схеме три части. Браузер показывает форму и результат. Сервер получает обращение и проверяет правила. База хранит пользователей, проекты и заявки. Связи идут через сервер: браузер не получает прямое право произвольно менять таблицы. Пока схема не задаёт число компьютеров или процессов. Она распределяет ответственность.\n\nНа схеме разберём исходные данные: Состав приложения; стрелки обозначают каналы взаимодействия, а не текущий запрос. Обзор: браузер, сервер и база имеют разные обязанности.  Браузер показывает форму и состояние обмена.  Сервер определяет пользователя и проверяет правила.  База поддерживает ключи, связи и единственность пары. Структурная связь не означает выполнение запроса.\n\nТакое разделение объясняет, почему одна и та же проверка может иметь разные задачи. В браузере ограничение длины помогает человеку быстро исправить текст. На сервере проверка определяет допустимость обращения. В базе ограничения защищают согласованность записей. Эти действия поддерживают одно правило на разных границах.\n\nСхему архитектуры полезно читать по одному конкретному действию. Браузер получил мотивацию и передал её серверу. Сервер определил Анну и проверил условия. База сохранила одну заявку. Сервер вернул результат, браузер показал подтверждение. Мы не выводим из этой схемы, что каждая часть обязательно находится на отдельном компьютере. Логическая ответственность и физическое размещение являются разными вопросами. Их не следует смешивать при объяснении.\n\nЕсли приложение небольшое, несколько обязанностей могут выполняться в одном процессе. Это не отменяет необходимости понимать границы данных и доверия. Интерфейс по-прежнему не выбирает право, а хранение по-прежнему поддерживает устойчивый результат. Такой уровень схемы достаточен для первого занятия. На третьем лекции он получит подробный обмен и отдельный разбор размещения, где появятся адреса и конфигурация.\n\n","visualDescription":"Схема. Блоки: Браузер; Сервер; База данных. Связи: Браузер — Сервер: Запрос; Сервер — База данных: Чтение и сохранение; Сервер — Браузер: Ответ.","wordCount":256,"pauseSeconds":14,"estimatedSeconds":154,"requiredWpm":107,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"Браузер","body":"Интерфейс помогает выполнить действие и понять результат","visual":{"type":"process","items":[{"title":"Ввод","text":"Анна видит выбранный проект и пишет мотивацию"},{"title":"Обратная связь","text":"Форма показывает ограничение и ошибки заполнения"},{"title":"Результат","text":"Страница отображает подтверждённые сведения системы"}]},"speech":"Браузерная часть отвечает за взаимодействие с пользователем. Она должна понятно показать задачу, дать ввести мотивацию и объяснить полученный результат. Часть ошибок удобно обнаружить до отправки. Например, подсказка длины избавляет от бесполезного ожидания. Но браузер работает с теми сведениями, которые уже получил. Если проект закрыли после открытия страницы, локальная копия может устареть. Поэтому окончательные правила проверяет сервер.","explanation":"Не будем поручать интерфейсу выбор итогового статуса или номера студента. Пользователь не должен заполнять технические значения, которые система уже знает. Во втором лекции покажем, как такое распределение отражается в форме: поле мотивации будет единственным необходимым пользовательским вводом для выбранного проекта.","hint":"Отличайте удобство ввода от окончательного решения системы. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-48","catalog":"Свободная схема","title":"Браузер","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Ввод","text":"Анна видит выбранный проект и пишет мотивацию"},{"title":"Обратная связь","text":"Форма показывает ограничение и ошибки заполнения"},{"title":"Результат","text":"Страница отображает подтверждённые сведения системы"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Интерфейс помогает выполнить действие и понять результат","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Ввод: Анна видит выбранный проект и пишет мотивацию","focus":["p0"],"result":""},{"caption":"Обратная связь: Форма показывает ограничение и ошибки заполнения","focus":["p1"],"result":""},{"caption":"Результат: Страница отображает подтверждённые сведения системы","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Интерфейс помогает выполнить действие и понять результат"}]}],"structural":true},"question":7,"id":"З1-С48","number":64,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":81,"startSeconds":5546,"transition":"","script":"Браузерная часть отвечает за взаимодействие с пользователем. Она должна понятно показать задачу, дать ввести мотивацию и объяснить полученный результат. Часть ошибок удобно обнаружить до отправки. Например, подсказка длины избавляет от бесполезного ожидания. Но браузер работает с теми сведениями, которые уже получил. Если проект закрыли после открытия страницы, локальная копия может устареть. Поэтому окончательные правила проверяет сервер.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Ввод». Анна видит выбранный проект и пишет мотивацию. Второй блок обозначен «Обратная связь». Форма показывает ограничение и ошибки заполнения. Третий блок обозначен «Результат». Страница отображает подтверждённые сведения системы.\n\nНе будем поручать интерфейсу выбор итогового статуса или номера студента. Пользователь не должен заполнять технические значения, которые система уже знает. Во втором лекции покажем, как такое распределение отражается в форме: поле мотивации будет единственным необходимым пользовательским вводом для выбранного проекта.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Ввод: Анна видит выбранный проект и пишет мотивацию. 2. Обратная связь: Форма показывает ограничение и ошибки заполнения. 3. Результат: Страница отображает подтверждённые сведения системы.","wordCount":131,"pauseSeconds":8,"estimatedSeconds":79,"requiredWpm":108,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"Сервер","body":"Обработка связывает пользователя, правила и сохранение","visual":{"type":"process","items":[{"title":"Пользователь","text":"Определяется по действующему сеансу"},{"title":"Проверки","text":"Роль, проект, текст, повтор и допустимый переход"},{"title":"Изменение","text":"Сохранение согласованного результата и подготовка ответа"}]},"speech":"Серверная часть получает обращения от браузера и действует от имени установленного пользователя. Сеанс — способ связать последовательность обращений с уже выполненным входом. В нашем курсе вход работает заранее. Сервер проверяет правила независимо от того, какие элементы видны на странице. Анна может изменить отправляемые данные, поэтому поле с её номером не является доказательством личности. Проверку полномочий нельзя заменить скрытой кнопкой.","explanation":"После проверок сервер организует работу с данными и формирует результат. Для успешной подачи он должен подтвердить именно сохранение. При отказе — сообщить согласованную причину. На третьем занятии разложим эту обработку на короткие шаги и покажем реальные форматы обмена без обязательного программирования в эфире.","hint":"Сеанс произносится обычным словом, объясните его назначение. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-49","catalog":"Свободная схема","title":"Сервер","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Пользователь","text":"Определяется по действующему сеансу"},{"title":"Проверки","text":"Роль, проект, текст, повтор и допустимый переход"},{"title":"Изменение","text":"Сохранение согласованного результата и подготовка ответа"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Обработка связывает пользователя, правила и сохранение","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Пользователь: Определяется по действующему сеансу","focus":["p0"],"result":""},{"caption":"Проверки: Роль, проект, текст, повтор и допустимый переход","focus":["p1"],"result":""},{"caption":"Изменение: Сохранение согласованного результата и подготовка ответа","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Обработка связывает пользователя, правила и сохранение"}]}],"structural":true},"question":7,"id":"З1-С49","number":65,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":83,"startSeconds":5627,"transition":"","script":"Серверная часть получает обращения от браузера и действует от имени установленного пользователя. Сеанс — способ связать последовательность обращений с уже выполненным входом. В нашем курсе вход работает заранее. Сервер проверяет правила независимо от того, какие элементы видны на странице. Анна может изменить отправляемые данные, поэтому поле с её номером не является доказательством личности. Проверку полномочий нельзя заменить скрытой кнопкой.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Пользователь». Определяется по действующему сеансу. Второй блок обозначен «Проверки». Роль, проект, текст, повтор и допустимый переход. Третий блок обозначен «Изменение». Сохранение согласованного результата и подготовка ответа.\n\nПосле проверок сервер организует работу с данными и формирует результат. Для успешной подачи он должен подтвердить именно сохранение. При отказе — сообщить согласованную причину. На третьем занятии разложим эту обработку на короткие шаги и покажем реальные форматы обмена без обязательного программирования в эфире.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Пользователь: Определяется по действующему сеансу. 2. Проверки: Роль, проект, текст, повтор и допустимый переход. 3. Изменение: Сохранение согласованного результата и подготовка ответа.","wordCount":133,"pauseSeconds":8,"estimatedSeconds":81,"requiredWpm":106,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"База данных","body":"Связанные записи сохраняют общее состояние ресурса","visual":{"type":"table","columns":["Сущность","Пример сохраняемых сведений"],"rows":[["Пользователь","Анна, роль студент, id 12"],["Проект","Название, преподаватель 7, доступность набора"],["Заявка","Проект 17, студент 12, мотивация, статус"]],"caption":""},"speech":"База данных хранит организованные сведения, которые приложение получает и изменяет. Для нашего проекта достаточно трёх основных сущностей: пользователя, проекта и заявки. Заявка связывает существующего студента с существующим проектом. Мы не копируем в каждое обращение всё описание проекта. При чтении приложение получает необходимые связанные сведения. Подробно ключи и ограничения разберём на втором занятии.","explanation":"Хранение общего состояния позволяет Анне закрыть страницу и позже увидеть ту же заявку. Оно также позволяет Ирине рассмотреть обращение независимо от открытого окна студента. Однако само наличие базы не гарантирует согласованность. Нужно определить обязательные поля, допустимые значения и запрет повторной пары. Поэтому схема данных является частью проектирования.","hint":"Не превращайте таблицу в подробную схему полей раньше второго лекции.","sources":[],"question":7,"id":"З1-С50","number":66,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":88,"startSeconds":5710,"transition":"","script":"База данных хранит организованные сведения, которые приложение получает и изменяет. Для нашего проекта достаточно трёх основных сущностей: пользователя, проекта и заявки. Заявка связывает существующего студента с существующим проектом. Мы не копируем в каждое обращение всё описание проекта. При чтении приложение получает необходимые связанные сведения. Подробно ключи и ограничения разберём на втором занятии.\n\nСопоставим записи в таблице. В строке 1 сущность: Пользователь. пример сохраняемых сведений: Анна, роль студент, id 12. В строке 2 сущность: Проект. пример сохраняемых сведений: Название, преподаватель 7, доступность набора. В строке 3 сущность: Заявка. пример сохраняемых сведений: Проект 17, студент 12, мотивация, статус.\n\nХранение общего состояния позволяет Анне закрыть страницу и позже увидеть ту же заявку. Оно также позволяет Ирине рассмотреть обращение независимо от открытого окна студента. Однако само наличие базы не гарантирует согласованность. Нужно определить обязательные поля, допустимые значения и запрет повторной пары. Поэтому схема данных является частью проектирования.\n\n","visualDescription":"Таблица. Столбцы: Сущность; Пример сохраняемых сведений. Строка 1: Пользователь; Анна, роль студент, id 12. Строка 2: Проект; Название, преподаватель 7, доступность набора. Строка 3: Заявка; Проект 17, студент 12, мотивация, статус.","wordCount":143,"pauseSeconds":8,"estimatedSeconds":86,"requiredWpm":107,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"Принцип выбора технологий","body":"Инструмент соответствует задаче и условиям сопровождения","visual":{"type":"table","columns":["Критерий","Что выясняем"],"rows":[["Функциональность","Можно ли реализовать выбранные экраны и правила"],["Данные","Есть ли нужные связи и ограничения"],["Команда","Кто сможет поддерживать решение"],["Размещение","Где и как будет работать ресурс"]],"caption":""},"speech":"Технологии выбирают после понимания задачи и ограничений. Для учебного сервиса важны приём обращений, проверка прав и согласованное хранение. Можно реализовать это разными языками и средствами. Название популярного инструмента ещё не объясняет его пригодность. Учитывают возможности команды, среду размещения и будущие изменения. Слишком сложное решение увеличит стоимость поддержки, если его преимущества не нужны выбранному сценарию.","explanation":"В курсе мы используем HTTP, JSON и короткие примеры SQL как форматы, необходимые для объяснения обмена и данных. Названия языков здесь обозначают инструменты разбора, а не обязательный промышленный стек. Все серверные алгоритмы будут явно помечены как псевдокод, чтобы ведущему не пришлось переключаться между несколькими языками.\n\nДля выбора инструмента полезно рассмотреть стоимость изменения. Если каждый новый статус требует ручного исправления десятков экранов, модель может быть плохо согласована. Если команду невозможно сопровождать без редкого внешнего специалиста, это зависимость проекта. Но заранее усложнять маленький сервис ради всех воображаемых будущих функций тоже нецелесообразно. Решение должно соответствовать текущей задаче и разумно ожидаемому развитию.\n\nВ учебном материале мы не выбираем победителя среди платформ. Вместо этого фиксируем критерии, по которым можно объяснить выбор. Это профессиональный навык проектировщика: связать средство с необходимым результатом и показать ограничения. Название технологии без такого объяснения не отвечает на вопрос, почему она подходит «Проектному навигатору». Поэтому дальнейшие технические примеры короткие и служат пониманию процесса, а не рекламе определённого стека.","hint":"Не назначайте конкретный стек без основания в задаче.","sources":[],"question":7,"id":"З1-С51","number":67,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":156,"startSeconds":5798,"transition":"","script":"Технологии выбирают после понимания задачи и ограничений. Для учебного сервиса важны приём обращений, проверка прав и согласованное хранение. Можно реализовать это разными языками и средствами. Название популярного инструмента ещё не объясняет его пригодность. Учитывают возможности команды, среду размещения и будущие изменения. Слишком сложное решение увеличит стоимость поддержки, если его преимущества не нужны выбранному сценарию.\n\nСопоставим записи в таблице. В строке 1 критерий: Функциональность. что выясняем: Можно ли реализовать выбранные экраны и правила. В строке 2 критерий: Данные. что выясняем: Есть ли нужные связи и ограничения. В строке 3 критерий: Команда. что выясняем: Кто сможет поддерживать решение. В строке 4 критерий: Размещение. что выясняем: Где и как будет работать ресурс.\n\nВ курсе мы используем HTTP, JSON и короткие примеры SQL как форматы, необходимые для объяснения обмена и данных. Названия языков здесь обозначают инструменты разбора, а не обязательный промышленный стек. Все серверные алгоритмы будут явно помечены как псевдокод, чтобы ведущему не пришлось переключаться между несколькими языками.\n\nДля выбора инструмента полезно рассмотреть стоимость изменения. Если каждый новый статус требует ручного исправления десятков экранов, модель может быть плохо согласована. Если команду невозможно сопровождать без редкого внешнего специалиста, это зависимость проекта. Но заранее усложнять маленький сервис ради всех воображаемых будущих функций тоже нецелесообразно. Решение должно соответствовать текущей задаче и разумно ожидаемому развитию.\n\nВ учебном материале мы не выбираем победителя среди платформ. Вместо этого фиксируем критерии, по которым можно объяснить выбор. Это профессиональный навык проектировщика: связать средство с необходимым результатом и показать ограничения. Название технологии без такого объяснения не отвечает на вопрос, почему она подходит «Проектному навигатору». Поэтому дальнейшие технические примеры короткие и служат пониманию процесса, а не рекламе определённого стека.\n\n","visualDescription":"Таблица. Столбцы: Критерий; Что выясняем. Строка 1: Функциональность; Можно ли реализовать выбранные экраны и правила. Строка 2: Данные; Есть ли нужные связи и ограничения. Строка 3: Команда; Кто сможет поддерживать решение. Строка 4: Размещение; Где и как будет работать ресурс.","wordCount":265,"pauseSeconds":8,"estimatedSeconds":153,"requiredWpm":107,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"Риски и зависимости","body":"Неопределённость оценивают до начала реализации","visual":{"type":"table","columns":["Риск или зависимость","Последствие","Ответное решение"],"rows":[["Неясное правило повторов","Две несовместимые реализации","Зафиксировать пару студент и проект"],["Готовый вход","Без него нельзя определить пользователя","Записать допущение и границу"],["Изменение проекта после открытия формы","Устаревшие сведения интерфейса","Повторная серверная проверка"]],"caption":""},"speech":"Риск — возможное событие, которое помешает цели. Зависимость — условие или результат другой работы, без которого наш сценарий не выполнится. Мы уже зависим от действующего входа. Если это допущение неверно, объём проекта изменится. Неясность правила повторов тоже создаёт риск: интерфейс и сервер могут запретить разные действия. Раннее уточнение стоит дешевле, чем согласование нескольких готовых реализаций.","explanation":"Реестр рисков полезен, если у каждой записи есть последствие и ответное решение. Общая строка «возможны ошибки» ничего не подсказывает. В таблице условия конкретны и связаны с нашим примером. По ним можно понять, что необходимо уточнить, что проверить и какое допущение передать следующему участнику проекта.","hint":"Различайте риск и уже наступившую ошибку.","sources":[],"question":7,"id":"З1-С52","number":68,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":98,"startSeconds":5954,"transition":"","script":"Риск — возможное событие, которое помешает цели. Зависимость — условие или результат другой работы, без которого наш сценарий не выполнится. Мы уже зависим от действующего входа. Если это допущение неверно, объём проекта изменится. Неясность правила повторов тоже создаёт риск: интерфейс и сервер могут запретить разные действия. Раннее уточнение стоит дешевле, чем согласование нескольких готовых реализаций.\n\nСопоставим записи в таблице. В строке 1 риск или зависимость: Неясное правило повторов. последствие: Две несовместимые реализации. ответное решение: Зафиксировать пару студент и проект. В строке 2 риск или зависимость: Готовый вход. последствие: Без него нельзя определить пользователя. о ценить полноту проектирования.","explanation":"Представим, что мы меняем правило повторной подачи. Тогда нужно пересмотреть ограничение данных, обработку, сообщение и проверку. Связи позволяют найти эти места адресно. Без них команда будет искать по памяти и рискует оставить старое правило в одной из частей. Позже эта же идея поможет проверить весь комплект лекций.","hint":"Читайте строки слева направо, не по отдельным столбцам.","sources":[],"question":7,"id":"З1-С53","number":69,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":102,"startSeconds":6052,"transition":"","script":"Прослеживаемость означает возможность пройти от потребности к связанному решению и обратно. Если в форме появляется новое поле, должно быть понятно, какую задачу оно поддерживает. Если требование существует только в документе, но нигде не реализовано, связь оборвана. На экране показаны три законченные цепочки. Они объединяют разные виды материалов вокруг одного правила. Это помогает оценить полноту проектирования.\n\nСопоставим записи в таблице. В строке 1 основание: ФТ-01: видеть сохранённую заявку. проектное решение: Раздел «Мои заявки» и запись в базе. проверка: После подачи видна нужная заявка. В строке 2 основание: ПР-01: одна заявка на проект. проектное решение: Уникальная пара студента и проекта. проверка: Повтор не создаёт запись. В строке 3 основание: ПР-03: только свой проект. проектное решение: Проверка принадлежности на сервере. проверка: Чужой преподаватель получает отказ.\n\nПредставим, что мы меняем правило повторной подачи. Тогда нужно пересмотреть ограничение данных, обработку, сообщение и проверку. Связи позволяют найти эти места адресно. Без них команда будет искать по памяти и рискует оставить старое правило в одной из частей. Позже эта же идея поможет проверить весь комплект лекций.\n\n","visualDescription":"Таблица. Столбцы: Основание; Проектное решение; Проверка. Строка 1: ФТ-01: видеть сохранённую заявку; Раздел «Мои заявки» и запись в базе; После подачи видна нужная заявка. Строка 2: ПР-01: одна заявка на проект; Уникальная пара студента и проекта; Повтор не создаёт запись. Строка 3: ПР-03: только свой проект; Проверка принадлежности на сервере; Чужой преподаватель получает отказ.","wordCount":169,"pauseSeconds":8,"estimatedSeconds":100,"requiredWpm":108,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"title":"Паспорт проекта","body":"Краткое согласованное описание первой версии","visual":{"type":"table","columns":["Раздел","Заполненный результат"],"rows":[["Название","Проектный навигатор"],["Цель","Единый учёт подачи и рассмотрения заявок"],["Роли","Студент, преподаватель"],["Состав","Каталог, подача, свои заявки, решение"],["Ограничения","50–1000 символов, одна заявка, свой проект"],["Вне версии","Чат, вложения, видео, интеллектуальный поиск"]],"caption":""},"speech":"Паспорт проекта собирает основные договорённости в одном обозримом документе. Он не заменяет подробные требования, но помогает быстро понять назначение и объём. Для «Проектного навигатора» мы можем заполнить его без вымышленных сроков, бюджета и фамилий ответственных за разработку. Известны цель, роли, функции и ограничения. Отложенные возможности записаны явно. Это защищает первую версию от случайного расширения.","explanation":"Паспорт полезно читать вместе со схемой процесса и реестром требований. Краткое слово «подача» раскрывается через условия, действия и подтверждение. Если материалы противоречат друг другу, требуется согласовать исходное решение. Декоративно оформленный паспорт с неподтверждёнными обещаниями не заменяет такой работы.\n\nПрочитаем паспорт как документ для нового участника. Из названия он узнаёт, какой ресурс создают. Из цели — почему нужны единый учёт и понятный статус. Из ролей — кто выполняет действия. Из состава — какой путь должен завершаться в версии. Ограничения уточняют допустимые значения и полномочия. Отдельный список вне версии предотвращает ошибочное ожидание чата или файлов. Такой порядок позволяет быстро восстановить рамку проекта.\n\nЕсли после чтения остаётся вопрос о подробном поведении, паспорт должен вести к соответствующему сценарию и требованию. Он не обязан содержать каждую будущую строку запроса. Слишком подробный паспорт легко дублирует другие документы и начинает расходиться с ними. Поэтому важна согласованная краткость: общая рамка в одном месте, точные условия по известным связям. Дальше используем её для оценки нового пожелания о вложении.","hint":"Показывайте заполненный документ, не оставляйте поля для аудитории.","sources":[],"question":7,"id":"З1-С54","number":70,"blockTitle":"Первая версия и архитектура","blockIndex":6,"plannedSeconds":173,"startSeconds":6154,"transition":"Следующий вопрос — разбор изменения. Новая кнопка означает изменение пути работы с данными.","script":"Паспорт проекта собирает основные договорённости в одном обозримом документе. Он не заменяет подробные требования, но помогает быстро понять назначение и объём. Для «Проектного навигатора» мы можем заполнить его без вымышленных сроков, бюджета и фамилий ответственных за разработку. Известны цель, роли, функции и ограничения. Отложенные возможности записаны явно. Это защищает первую версию от случайного расширения.\n\nСопоставим записи в таблице. В строке 1 раздел: Название. заполненный результат: Проектный навигатор. В строке 2 раздел: Цель. заполненный результат: Единый учёт подачи и рассмотрения заявок. В строке 3 раздел: Роли. заполненный результат: Студент, преподаватель. В строке 4 раздел: Состав. заполненный результат: Каталог, подача, свои заявки, решение. В строке 5 раздел: Ограничения. заполненный результат: 50–1000 символов, одна заявка, свой проект. В строке 6 раздел: Вне версии. заполненный результат: Чат, вложения, видео, интеллектуальный поиск.\n\nПаспорт полезно читать вместе со схемой процесса и реестром требований. Краткое слово «подача» раскрывается через условия, действия и подтверждение. Если материалы противоречат друг другу, требуется согласовать исходное решение. Декоративно оформленный паспорт с неподтверждёнными обещаниями не заменяет такой работы.\n\nПрочитаем паспорт как документ для нового участника. Из названия он узнаёт, какой ресурс создают. Из цели — почему нужны единый учёт и понятный статус. Из ролей — кто выполняет действия. Из состава — какой путь должен завершаться в версии. Ограничения уточняют допустимые значения и полномочия. Отдельный список вне версии предотвращает ошибочное ожидание чата или файлов. Такой порядок позволяет быстро восстановить рамку проекта.\n\nЕсли после чтения остаётся вопрос о подробном поведении, паспорт должен вести к соответствующему сценарию и требованию. Он не обязан содержать каждую будущую строку запроса. Слишком подробный паспорт легко дублирует другие документы и начинает расходиться с ними. Поэтому важна согласованная краткость: общая рамка в одном месте, точные условия по известным связям. Дальше используем её для оценки нового пожелания о вложении.\n\nСледующий вопрос — разбор изменения. Новая кнопка означает изменение пути работы с данными.","visualDescription":"Таблица. Столбцы: Раздел; Заполненный результат. Строка 1: Название; Проектный навигатор. Строка 2: Цель; Единый учёт подачи и рассмотрения заявок. Строка 3: Роли; Студент, преподаватель. Строка 4: Состав; Каталог, подача, свои заявки, решение. Строка 5: Ограничения; 50–1000 символов, одна заявка, свой проект. Строка 6: Вне версии; Чат, вложения, видео, интеллектуальный поиск.","wordCount":295,"pauseSeconds":8,"estimatedSeconds":169,"requiredWpm":107,"links":"webinar-1, Первая версия и архитектура; учебные правила проекта"},{"supplemental":true,"question":7,"blockIndex":6,"blockTitle":"Первая версия и архитектура","sources":[],"notebook":"","links":"webinar-1, Первая версия и архитектура; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":71,"id":"З1-П7","title":"Практика: Ответственность слоёв","kind":"practice","visual":{"type":"p тся файл со своими правилами обработки и хранения"}]}},{"title":"Затрагиваемые части системы","visual":{"type":"diagram","nodes":["Форма заявки","Серверная обработка","Хранилище файлов","Данные заявки"],"edges":[["Форма заявки","Серверная обработка","Передача файла"],["Серверная обработка","Хранилище файлов","Сохранение содержимого"],["Серверная обработка","Данные заявки","Связь с файлом"]],"caption":""}}]},"speech":"Разберём готовый запрос на изменение: к мотивационному тексту предлагают добавить файл с примерами работ. Польза понятна — преподаватель сможет увидеть результат предыдущей деятельности. Однако формулировка ещё не задаёт допустимые форматы, размер и срок хранения. Если сразу нарисовать кнопку загрузки, мы создадим впечатление согласованного решения. Поэтому сначала определим новые объекты и действия, которые появятся в системе.\n\nВложения в этом разборе рассматриваются как предложение следующей версии. Они не включаются в исходную заявку и не изменяют схемы второго лекции. Мы используем один пример изменения, чтобы показать оценку влияния, а не незаметно увеличить состав проекта. После разбора будет принято явное решение о границе версии.\n\nДля вложения понадобится элемент выбора файла в форме. Серверу нужно принять содержимое и проверить ограничения. Сам файл придётся хранить, а в заявке — поддержать связь с ним. Преподавателю понадобится возможность открыть допустимое вложение. Кроме счастливого пути возникают ошибки передачи и недоступность хранилища. Таким образом, изменение затрагивает почти весь путь данных, хотя пользователь начинает его одной кнопкой.","explanation":"На схеме специально показано отдельное хранилище как проектный вариант для оценки, а не как утверждённая архитектура базовой версии. Выбор конкретного способа хранения потребовал бы дополнительных решений. Сейчас достаточно увидеть новые обязанности и зависимость между сохранением заявки и сохранением файла.\n\nРассмотрим неудачный частичный вариант. В форме появилась кнопка выбора файла, но сервер по-прежнему принимает только проект и мотивацию. Пользователь видит обещание, которое система не выполняет. Другой вариант: файл передаётся, но в заявке нет устойчивой связи с ним, и Ирина не может открыть материал. Обе ситуации показывают разрыв между слоями. Оценка влияния нужна, чтобы избежать такого ложного завершения.\n\nТакже изменится сопровождение. При сообщении «файл не открывается» нужно отличить отсутствие содержимого, нарушение доступа и временную недоступность хранения. Восстановление каждого случая разное. Поэтому полезная функция включает не только счастливый путь, но и понятные состояния отказа. Это объясняет, почему решение отложить вложения основано на объёме согласования, а не на нежелании добавить визуальный элемент.","hint":"На слайде пометьте вложения как предложение, а не базовую функцию. Отметьте статус схемы: оценка предлагаемого расширения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-56","catalog":"Свободная схема","title":"Затрагиваемые части системы","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Запрос на добавление вложений","visual":{"type":"process","items":[{"title":"Пожелание","text":"Анна хочет приложить примеры своих работ"},{"title":"Польза","text":"Ирина сможет посмотреть дополнительные материалы"},{"title":"Изменение","text":"Появится файл со своими правилами обработки и хранения"}]}},{"title":"Затрагиваемые части системы","visual":{"type":"diagram","nodes":["Форма заявки","Серверная обработка","Хранилище файлов","Данные заявки"],"edges":[["Форма заявки","Серверная обработка","Передача файла"],["Серверная обработка","Хранилище файлов","Сохранение содержимого"],["Серверная обработка","Данные заявки","Связь с файлом"]],"caption":""}}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Файл проходит через интерфейс, обработку и хранение","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Пожелание: Анна хочет приложить примеры своих работ","focus":["v0.p0"],"result":""},{"caption":"Польза: Ирина сможет посмотреть дополнительные материалы","focus":["v0.p1"],"result":""},{"caption":"Изменение: Появится файл со своими правилами обработки и хранения","focus":["v0.p2"],"result":""},{"caption":"Форма заявки → Серверная обработка: Передача файла","focus":["v1.e0"],"result":""},{"caption":"Серверная обработка → Хранилище файлов: Сохранение содержимого","focus":["v1.e1"],"result":""},{"caption":"Серверная обработка → Данные заявки: Связь с файлом","focus":["v1.e2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Файл проходит через интерфейс, обработку и хранение"}]}],"structural":true},"question":8,"id":"З1-С56","number":74,"blockTitle":"Разбор изменения","blockIndex":7,"plannedSeconds":233,"startSeconds":6356,"transition":"","script":"Разберём готовый запрос на изменение: к мотивационному тексту предлагают добавить файл с примерами работ. Польза понятна — преподаватель сможет увидеть результат предыдущей деятельности. Однако формулировка ещё не задаёт допустимые форматы, размер и срок хранения. Если сразу нарисовать кнопку загрузки, мы создадим впечатление согласованного решения. Поэтому сначала определим новые объекты и действия, которые появятся в системе.\n\nВложения в этом разборе рассматриваются как предложение следующей версии. Они не включаются в исходную заявку и не изменяют схемы второго лекции. Мы используем один пример изменения, чтобы показать оценку влияния, а не незаметно увеличить состав проекта. После разбора будет принято явное решение о границе версии.\n\nДля вложения понадобится элемент выбора файла в форме. Серверу нужно принять содержимое и проверить ограничения. Сам файл придётся хранить, а в заявке — поддержать связь с ним. Преподавателю понадобится возможность открыть допустимое вложение. Кроме счастливого пути возникают ошибки передачи и недоступность хранилища. Таким образом, изменение затрагивает почти весь путь данных, хотя пользователь начинает его одной кнопкой.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Пожелание». Анна хочет приложить примеры своих работ. Второй блок обозначен «Польза». Ирина сможет посмотреть дополнительные материалы. Третий блок обозначен «Изменение». Появится файл со своими правилами обработки и хранения.\n\nРассмотрим подписанные связи схемы. Связь между блоками «Форма заявки» и «Серверная обработка» обозначает следующее: передача файла. Связь между блоками «Серверная обработка» и «Хранилище файлов» обозначает следующее: сохранение содержимого. Связь между блоками «Серверная обработка» и «Данные заявки» обозначает следующее: связь с файлом.\n\nНа схеме специально показано отдельное хранилище как проектный вариант для оценки, а не как утверждённая архитектура базовой версии. Выбор конкретного способа хранения потребовал бы дополнительных решений. Сейчас достаточно увидеть новые обязанности и зависимость между сохранением заявки и сохранением файла.\n\nРассмотрим неудачный частичный вариант. В форме появилась кнопка выбора файла, но сервер по-прежнему принимает только проект и мотивацию. Пользователь видит обещание, которое система не выполняет. Другой вариант: файл передаётся, но в заявке нет устойчивой связи с ним, и Ирина не может открыть материал. Обе ситуации показывают разрыв между слоями. Оценка влияния нужна, чтобы избежать такого ложного завершения.\n\nТакже изменится сопровождение. При сообщении «файл не открывается» нужно отличить отсутствие содержимого, нарушение доступа и временную недоступность хранения. Восстановление каждого случая разное. Поэтому полезная функция включает не только счастливый путь, но и понятные состояния отказа. Это объясняет, почему решение отложить вложения основано на объёме согласования, а не на нежелании добавить визуальный элемент.\n\n","visualDescription":"Запрос на добавление вложений. Последовательность подписанных блоков. 1. Пожелание: Анна хочет приложить примеры своих работ. 2. Польза: Ирина сможет посмотреть дополнительные материалы. 3. Изменение: Появится файл со своими правилами обработки и хранения.\n\nЗатрагиваемые части системы. Схема. Блоки: Форма заявки; Серверная обработка; Хранилище файлов; Данные заявки. Связи: Форма заявки — Серверная обработка: Передача файла; Серверная обработка — Хранилище файлов: Сохранение содержимого; Серверная обработка — Данные заявки: Связь с файлом.","wordCount":378,"pauseSeconds":22,"estimatedSeconds":228,"requiredWpm":107,"links":"webinar-1, Разбор изменения; учебные правила проекта"},{"title":"Новые правила для файлов","body":"До реализации необходимо согласовать допустимость и доступ","visual":{"type":"table","columns":["Вопрос","Что требуется определить"],"rows":[["Формат","Какие типы содержимого разрешены"],["Размер","Какова граница и сообщение при превышении"],["Доступ","Кто открывает файл и как проверяют право"],["Хранение","Как долго сохраняют и как удаляют"],["Ошибка","Что происходит с заявкой при сбое передачи"]],"caption":""},"speech":"Новое поле требует новых правил. Нужно согласовать, какие файлы действительно помогают преподавателю, какой объём допустим и кто имеет доступ. Ошибка загрузки может случиться до или после сохранения заявки, поэтому потребуется определить поведение в обоих случаях. Нельзя оставлять решение на случайное поведение браузера. Даже если библиотека умеет загружать файл, она не выбирает за проектировщика смысл этой операции.","explanation":"Мы не заполняем таблицу произвольными числами. На слайде показан перечень решений, необходимых для оценки предложения. В отличие от мотивационного текста с утверждённой границей, параметры вложений пока не согласованы. Это позволяет честно показать неопределённость и не выдавать предположение за действующее правило курса.","hint":"Не придумывайте размер файла как утверждённое ограничение.","sources":[],"question":8,"id":"З1-С57","number":75,"blockTitle":"Разбор изменения","blockIndex":7,"plannedSeconds":103,"startSeconds":6589,"transition":"","script":"Новое поле требует новых правил. Нужно согласовать, какие файлы действительно помогают преподавателю, какой объём допустим и кто имеет доступ. Ошибка загрузки может случиться до или после сохранения заявки, поэтому потребуется определить поведение в обоих случаях. Нельзя оставлять решение на случайное поведение браузера. Даже если библиотека умеет загружать файл, она не выбирает за проектировщика смысл этой операции.\n\nСопоставим записи в таблице. В строке 1 вопрос: Формат. что требуется определить: Какие типы содержимого разрешены. В строке 2 вопрос: Размер. что требуется определить: Какова граница и сообщение при превышении. В строке 3 вопрос: Доступ. что требуется определить: Кто открывает файл и как проверяют право. В строке 4 вопрос: Хранение. что требуется определить: Как долго сохраняют и как удаляют. В строке 5 вопрос: Ошибка. что требуется определить: Что происходит с заявкой при сбое передачи.\n\nМы не заполняем таблицу произвольными числами. На слайде показан перечень решений, необходимых для оценки предложения. В отличие от мотивационного текста с утверждённой границей, параметры вложений пока не согласованы. Это позволяет честно показать неопределённость и не выдавать предположение за действующее правило курса.\n\n","visualDescription":"Таблица. Столбцы: Вопрос; Что требуется определить. Строка 1: Формат; Какие типы содержимого разрешены. Строка 2: Размер; Какова граница и сообщение при превышении. Строка 3: Доступ; Кто открывает файл и как проверяют право. Строка 4: Хранение; Как долго сохраняют и как удаляют. Строка 5: Ошибка; Что происходит с заявкой при сбое передачи.","wordCount":171,"pauseSeconds":8,"estimatedSeconds":101,"requiredWpm":108,"links":"webinar-1, Разбор изменения; учебные правила проекта"},{"title":"Дополнительная сложность","body":"Нужно учитывать отказ, проверку доступа и сопровождение файла","visual":{"type":"process","items":[{"title":"Подача","text":"Обработка должна связать результат двух сохранений"},{"title":"Рассмотрение","text":"Преподаватель получает только доступные ему вложения"},{"title":"Сопровождение","text":"Нужно понимать, где файл, заявка и причина сбоя"}]},"speech":"Оценим сложность по последствиям. Если файл сохранился, а заявка нет, возникнет лишнее содержимое. Если заявка сохранилась, а файл недоступен, преподавателю потребуется понятное сообщение. Проверка прав должна действовать и при открытии вложения по прямому адресу. Сопровождение должно различать отсутствие файла и отказ доступа. Эти ситуации показывают, почему объём расширения нельзя оценить только временем рисования кнопки.","explanation":"Дополнительная сложность не означает, что функцию никогда нельзя делать. Она означает необходимость обоснованного выбора и полного проектирования. Польза должна сопоставляться с затратами и рисками. Для нашей первой версии основной путь уже завершён без вложений, поэтому есть возможность отложить эту работу без потери цели.","hint":"Сравните последствия по этапам пути файла. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-58","catalog":"Свободная схема","title":"Дополнительная сложность","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Подача","text":"Обработка должна связать результат двух сохранений"},{"title":"Рассмотрение","text":"Преподаватель получает только доступные ему вложения"},{"title":"Сопровождение","text":"Нужно понимать, где файл, заявка и причина сбоя"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Нужно учитывать отказ, проверку доступа и сопровождение файла","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Подача: Обработка должна связать результат двух сохранений","focus":["p0"],"result":""},{"caption":"Рассмотрение: Преподаватель получает только доступные ему вложения","focus":["p1"],"result":""},{"caption":"Сопровождение: Нужно понимать, где файл, заявка и причина сбоя","focus":["p2"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Нужно учитывать отказ, проверку доступа и сопровождение файла"}]}],"structural":true},"question":8,"id":"З1-С58","number":76,"blockTitle":"Разбор изменения","blockIndex":7,"plannedSeconds":83,"startSeconds":6692,"transition":"","script":"Оценим сложность по последствиям. Если файл сохранился, а заявка нет, возникнет лишнее содержимое. Если заявка сохранилась, а файл недоступен, преподавателю потребуется понятное сообщение. Проверка прав должна действовать и при открытии вложения по прямому адресу. Сопровождение должно различать отсутствие файла и отказ доступа. Эти ситуации показывают, почему объём расширения нельзя оценить только временем рисования кнопки.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Подача». Обработка должна связать результат двух сохранений. Второй блок обозначен «Рассмотрение». Преподаватель получает только доступные ему вложения. Третий блок обозначен «Сопровождение». Нужно понимать, где файл, заявка и причина сбоя.\n\nДополнительная сложность не означает, что функцию никогда нельзя делать. Она означает необходимость обоснованного выбора и полного проектирования. Польза должна сопоставляться с затратами и рисками. Для нашей первой версии основной путь уже завершён без вложений, поэтому есть возможность отложить эту работу без потери цели.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Подача: Обработка должна связать результат двух сохранений. 2. Рассмотрение: Преподаватель получает только доступные ему вложения. 3. Сопровождение: Нужно понимать, где файл, заявка и причина сбоя.","wordCount":133,"pauseSeconds":8,"estimatedSeconds":81,"requiredWpm":106,"links":"webinar-1, Разбор изменения; учебные правила проекта"},{"title":"Решение отложить вложения","body":"Первая версия принимает только мотивационный текст","visual":{"type":"pair","items":[{"title":"Решение отложить вложения","visual":{"type":"table","columns":["Критерий","Оценка"],"rows":[["Основной путь","Выполняется без файла"],["Правила файлов","Ещё не согласованы"],["Влияние","Форма, сервер, данные, хранение, сопровождение"],["Решение","Сохранить пожелание для отдельного расширения"]],"caption":""}},{"title":"Комплект результатов проектирования","visual":{"type":"process","items":[{"title":"Назначение","text":"Паспорт фиксирует цель, роли и состав версии"},{"title":"Поведение","text":"Процесс и сценарии показывают действия и исключения"},{"title":"Договор","text":"Требования, права и статусы задают проверяемые ограничения"},{"title":"Следующий шаг","text":"Экраны и данные должны поддержать эти решения"}]}}]},"speech":"После оценки принимаем конкретное решение: вложения остаются за границей первой версии. В форме будет только мотивационный текст, связанный с выбранным проектом. Пожелание сохраняется отдельно с описанной пользой и вопросами для уточнения. Такое решение можно объяснить заинтересованным сторонам. Оно основано на достаточности основного пути и несогласованной сложности расширения. Это лучше, чем обещание без понятного объёма.\n\nМы получили согласованное описание будущего ресурса. Паспорт задаёт назначение и границы. Модель процесса показывает путь заявки. Требования уточняют, что должна делать система и как проверить результат. Права и состояния определяют допустимые действия. Эти материалы можно передать следующему участнику проекта без необходимости самостоятельно угадывать правило повторов или смысл закрытого набора.\n\nМы определили, какие действия должна поддерживать система. Теперь необходимо показать, как пользователь выполнит эти действия на экране и какие данные приложение должно для этого хранить. На втором лекции перейдём к конкретным макетам, объектам и таблицам. Все решения будут опираться на уже согласованный путь Анны и Ирины.","explanation":"На следующих занятиях отсутствие файла является следствием данного решения. В структуре заявки не будет скрытого поля вложения. Договор создания заявки не станет требовать загрузку. Когда функция вернётся в план, мы сможем оценить изменение относительно устойчивой основы и проследить все затронутые части.\n\nОтложенное пожелание желательно сохранить с причиной и условиями возврата. Для вложений это согласование пользы, форматов, размера, доступа и поведения при сбое. Тогда следующая оценка начнётся с известного вопроса, а не с повторения всей переписки. Но наличие записи в списке идей не является обещанием срока или гарантией реализации. Такое обещание потребовало бы отдельного планирования.\n\nВ нашем комплекте это решение имеет проверяемое последствие: ни форма, ни структура заявки, ни тело создания не содержат файл. Если он внезапно появился на следующем занятии, материалы противоречат границе версии. Таким образом, оценка изменения помогает не только управлять разработкой, но и редактировать учебный курс. Мы можем проверить его согласованность по конкретному признаку, не полагаясь на общее впечатление от содержания.","hint":"Подчеркните окончательную границу учебной первой версии. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-59","catalog":"Свободная схема","title":"Решение отложить вложения","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Решение отложить вложения","visual":{"type":"table","columns":["Критерий","Оценка"],"rows":[["Основной путь","Выполняется без файла"],["Правила файлов","Ещё не согласованы"],["  повторения всей переписки. Но наличие записи в списке идей не является обещанием срока или гарантией реализации. Такое обещание потребовало бы отдельного планирования.\n\nВ нашем комплекте это решение имеет проверяемое последствие: ни форма, ни структура заявки, ни тело создания не содержат файл. Если он внезапно появился на следующем занятии, материалы противоречат границе версии. Таким образом, оценка изменения помогает не только управлять разработкой, но и редактировать учебный курс. Мы можем проверить его согласованность по конкретному признаку, не полагаясь на общее впечатление от содержания.\n\n","visualDescription":"Решение отложить вложения. Таблица. Столбцы: Критерий; Оценка. Строка 1: Основной путь; Выполняется без файла. Строка 2: Правила файлов; Ещё не согласованы. Строка 3: Влияние; Форма, сервер, данные, хранение, сопровождение. Строка 4: Решение; Сохранить пожелание для отдельного расширения.\n\nКомплект результатов проектирования. Последовательность подписанных блоков. 1. Назначение: Паспорт фиксирует цель, роли и состав версии. 2. Поведение: Процесс и сценарии показывают действия и исключения. 3. Договор: Требования, права и статусы задают проверяемые ограничения. 4. Следующий шаг: Экраны и данные должны поддержать эти решения.","wordCount":397,"pauseSeconds":16,"estimatedSeconds":233,"requiredWpm":107,"links":"webinar-1, Разбор изменения; учебные правила проекта"},{"supplemental":true,"question":8,"blockIndex":7,"blockTitle":"Разбор изменения","sources":[],"notebook":"","links":"webinar-1, Разбор изменения; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":78,"id":"З1-П8","title":"Практика: Граница первой версии","kind":"practice","visual":{"type":"practice"},"speech":"Применим понятия вопроса к новому учебному случаю. Учебный случай: в сервис бронирования хотят добавить фотографии документов. Сначала запишите прогноз. Затем последовательно исследуйте факты: Файл может содержать персональные сведения. Н lDescription":"Проблема → требование: ФТ-01 связывает сохранение с повторным чтением заявки. Процесс → состояние: Свою заявку рассматривает ответственный преподаватель; исходный статус pending. Граница версии: Каталог, подача, просмотр и решение; вложения пока отложены.","kind":"summary","question":null,"blockTitle":"Разбор изменения","blockIndex":7,"wordCount":56,"pauseSeconds":5,"estimatedSeconds":36,"notebook":"","links":"Введение и итоги занятия","number":80,"plannedSeconds":37,"startSeconds":7013,"requiredWpm":105},{"title":"Вопросы от аудитории","body":"","visual":{"type":"questions","items":[{"question":"Как проверить, что заявки больше не теряются?","answer":"Проверка опирается на ФТ-01: после успешной подачи запись видна Анне в разделе «Мои заявки» с выбранным проектом и статусом «На рассмотрении». Подтверждение связано с сохранённой записью. Ирина получает её в заявках собственного проекта. Одной красивой надписи об успехе недостаточно. Нужно проследить результат повторным чтением и убедиться, что обе стороны обращаются к одной заявке."},{"question":"Почему одна заявка на проект не запрещает другие проекты?","answer":"Ограничение относится к паре конкретного студента и конкретного проекта. Для Анны это пара 12 и 17. Повтор той же пары запрещён, но другой проект образует другую пару и допускается. Имена людей и названия проектов служат подписями. Правило формулируется через устойчивую принадлежность, чтобы одинаковые имена или изменение названия не меняли смысл запрета."},{"question":"Почему вложения отложены?","answer":"Основной сценарий выполняется с мотивационным текстом от 50 до 1000 символов. Вложения требуют новых правил размера, формата, хранения, доступа и обработки частичного отказа. Их польза сохранена как пожелание, но объём ещё не согласован. Решение отложить функцию сохраняет достижимую первую версию. Возврат к пожеланию позже начнётся с оценки затронутых требований и частей системы."}]},"speech":"Завершаем занятие вопросами от аудитории. Ниже приведены разборы возможных вопросов по теме, которые можно использовать при обсуждении.\n\nКак проверить, что заявки больше не теряются? Проверка опирается на ФТ-01: после успешной подачи запись видна Анне в разделе «Мои заявки» с выбранным проектом и статусом «На рассмотрении». Подтверждение связано с сохранённой записью. Ирина получает её в заявках собственного проекта. Одной красивой надписи об успехе недостаточно. Нужно проследить результат повторным чтением и убедиться, что обе стороны обращаются к одной заявке.\n\nПочему одна заявка на проект не запрещает другие проекты? Ограничение относится к паре конкретного студента и конкретного проекта. Для Анны это пара 12 и 17. Повтор той же пары запрещён, но другой проект образует другую пару и допускается. Имена людей и названия проектов служат подписями. Правило формулируется через устойчивую принадлежность, чтобы одинаковые имена или изменение названия не меняли смысл запрета.\n\nПочему вложения отложены? Основной сценарий выполняется с мотивационным текстом от 50 до 1000 символов. Вложения требуют новых правил размера, формата, хранения, доступа и обработки частичного отказа. Их польза сохранена как пожелание, но объём ещё не согласован. Решение отложить функцию сохраняет достижимую первую версию. Возврат к пожеланию позже начнётся с оценки затронутых требований и частей системы.","explanation":"Результат этого лекции: паспорт проекта, схема процесса, требования и границы первой версии. Мы можем связать каждое решение с правилом учебного проекта и объяснить, что произойдёт в основном сценарии и при отказе. Это позволяет перейти к следующему этапу без изменения смысла уже согласованных данных.","hint":"Ответьте на поступившие вопросы по теме. Подготовленные разборы служат опорой преподавателю; обязательный опрос и ожидание ответа группы не требуются.","sources":[],"kind":"questions","question":null,"id":"З1-С60","number":81,"blockTitle":"Разбор изменения","blockIndex":7,"plannedSeconds":150,"startSeconds":7050,"tr
