оцессом, где будет виден порядок действий и ответственность участников.","hint":"Не называйте эту схему архитектурой размещения. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-17","catalog":"Свободная схема","title":"Контекстная схема","kind":"visual","data":{"visual":{"type":"diagram","nodes":["Анна: студент","Проектный навигатор","Ирина: преподаватель"],"edges":[["Анна: студент","Проектный навигатор","Проект и мотивация"],["Проектный навигатор","Анна: студент","Мои заявки и статус"],["Ирина: преподаватель","Проектный навигатор","Одобрение или отказ"],["Проектный навигатор","Ирина: преподаватель","Заявки своих проектов"]],"caption":""},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Один блок системы и подписанные взаимодействия с двумя ролями","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Анна: студент → Проектный навигатор: Проект и мотивация","focus":["e0"],"result":""},{"caption":"Проектный навигатор → Анна: студент: Мои заявки и статус","focus":["e1"],"result":""},{"caption":"Ирина: преподаватель → Проектный навигатор: Одобрение или отказ","focus":["e2"],"result":""},{"caption":"Проектный навигатор → Ирина: преподаватель: Заявки своих проектов","focus":["e3"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Один блок системы и подписанные взаимодействия с двумя ролями"}]}],"structural":true},"question":3,"id":"З1-С17","number":25,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":101,"startSeconds":1929,"transition":"","script":"Контекстная схема показывает границу системы и её взаимодействия с внешними участниками. Слева Анна передаёт выбранный проект и мотивационный текст. В ответ она получает подтверждение и сведения о своих заявках. Справа Ирина получает обращения к собственным проектам и передаёт решение. Подписи делают связи содержательными. Линия без названия не объясняет, что пересекает границу. Поэтому мы читаем не только прямоугольники, но и направление каждого обмена.\n\nРассмотрим подписанные связи схемы. Связь между блоками «Анна: студент» и «Проектный навигатор» обозначает следующее: проект и мотивация. Связь между блоками «Проектный навигатор» и «Анна: студент» обозначает следующее: мои заявки и статус. Связь между блоками «Ирина: преподаватель» и «Проектный навигатор» обозначает следующее: одобрение или отказ. Связь между блоками «Проектный навигатор» и «Ирина: преподаватель» обозначает следующее: заявки своих проектов.\n\nЭта схема не задаёт число страниц и не описывает последовательность нажатий. Она отвечает на более общий вопрос: кто взаимодействует с ресурсом и что получает. Дальше мы дополним её процессом, где будет виден порядок действий и ответственность участников.\n\n","visualDescription":"Схема. Блоки: Анна: студент; Проектный навигатор; Ирина: преподаватель. Связи: Анна: студент — Проектный навигатор: Проект и мотивация; Проектный навигатор — Анна: студент: Мои заявки и статус; Ирина: преподаватель — Проектный навигатор: Одобрение или отказ; Проектный навигатор — Ирина: преподаватель: Заявки своих проектов.","wordCount":156,"pauseSeconds":14,"estimatedSeconds":99,"requiredWpm":108,"links":"webinar-1, Границы и процессы; учебные правила проекта"},{"title":"Текущий процесс","body":"Результат зависит от переноса сведений между источниками","visual":{"type":"process","items":[{"title":"Анна пишет сообщение","text":"Передаёт проект и мотивацию в личный диалог"},{"title":"Ирина переносит сведения","text":"Создаёт строку в своей таблице"},{"title":"Ирина принимает решение","text":"Оставляет отметку и отправляет новое сообщение"},{"title":"Анна ищет ответ","text":"Сверяет переписку, если подтверждение непонятно"}]},"speech":"Процесс — последовательность действий, которая приводит к результату. Здесь сначала действует студент, затем преподаватель. Перенос в таблицу является отдельным шагом, у которого нет общего видимого подтверждения. Решение тоже передаётся отдельно от записи. Если одно сообщение пропущено, картина у участников расходится. Мы выделяем шаги не для обвинения исполнителей, а для понимания зависимости между действиями. Именно в точках ручной передачи возникают трудности учёта.","explanation":"Можно улучшить инструкцию по переписке, но останется необходимость сопоставлять источники. Наш вариант автоматизации меняет место регистрации: студент передаёт данные сразу в общий сервис, а преподаватель работает с сохранённой записью. Следующий слайд покажет этот вариант целиком.","hint":"Называйте исполнителя перед каждым действием. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-18","catalog":"Свободная схема","title":"Текущий процесс","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Анна пишет сообщение","text":"Передаёт проект и мотивацию в личный диалог"},{"title":"Ирина переносит сведения","text":"Создаёт строку в своей таблице"},{"title":"Ирина принимает решение","text":"Оставляет отметку и отправляет новое сообщение"},{"title":"Анна ищет ответ","text":"Сверяет переписку, если подтверждение непонятно"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Результат зависит от переноса сведений между источниками","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Анна пишет сообщение: Передаёт проект и мотивацию в личный диалог","focus":["p0"],"result":""},{"caption":"Ирина переносит сведения: Создаёт строку в своей таблице","focus":["p1"],"result":""},{"caption":"Ирина принимает решение: Оставляет отметку и отправляет новое сообщение","focus":["p2"],"result":""},{"caption":"Анна ищет ответ: Сверяет переписку, если подтверждение непонятно","focus":["p3"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Результат зависит от переноса сведений между источниками"}]}],"structural":true},"question":3,"id":"З1-С18","number":26,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":90,"startSeconds":2030,"transition":"","script":"Процесс — последовательность действий, которая приводит к результату. Здесь сначала действует студент, затем преподаватель. Перенос в таблицу является отдельным шагом, у которого нет общего видимого подтверждения. Решение тоже передаётся отдельно от записи. Если одно сообщение пропущено, картина у участников расходится. Мы выделяем шаги не для обвинения исполнителей, а для понимания зависимости между действиями. Именно в точках ручной передачи возникают трудности учёта.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Анна пишет сообщение». Передаёт проект и мотивацию в личный диалог. Второй блок обозначен «Ирина переносит сведения». Создаёт строку в своей таблице. Третий блок обозначен «Ирина принимает решение». Оставляет отметку и отправляет новое сообщение. Четвёртый блок обозначен «Анна ищет ответ». Сверяет переписку, если подтверждение непонятно.\n\nМожно улучшить инструкцию по переписке, но останется необходимость сопоставлять источники. Наш вариант автоматизации меняет место регистрации: студент передаёт данные сразу в общий сервис, а преподаватель работает с сохранённой записью. Следующий слайд покажет этот вариант целиком.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Анна пишет сообщение: Передаёт проект и мотивацию в личный диалог. 2. Ирина переносит сведения: Создаёт строку в своей таблице. 3. Ирина принимает решение: Оставляет отметку и отправляет новое сообщение. 4. Анна ищет ответ: Сверяет переписку, если подтверждение непонятно.","wordCount":146,"pauseSeconds":8,"estimatedSeconds":88,"requiredWpm":107,"links":"webinar-1, Границы и процессы; учебные правила проекта"},{"title":"Предлагаемый процесс","body":"Сохранённая заявка связывает подачу и решение","visual":{"type":"process","items":[{"title":"Анна выбирает проект","text":"Открывает карточку и заполняет мотивацию"},{"title":"Система сохраняет заявку","text":"Показывает Анне состояние «На рассмотрении»"},{"title":"Ирина рассматривает обращение","text":"Открывает список собственного проекта"},{"title":"Система сохраняет решение","text":"Показывает Анне «Одобрена» или «Отклонена»"}]},"speech":"В предлагаемом процессе исчезает ручная регистрация сообщения. После заполнения формы система проверяет правила и сохраняет заявку. Именно сохранение позволяет обеим сторонам работать с одним обращением. Преподаватель не создаёт вторую копию мотивационного текста, а открывает уже существующую заявку. Решение меняет её состояние. Студент затем получает актуальные сведения в своём разделе. Для этого не требуется, чтобы два участника одновременно находились на сайте.","explanation":"На схеме показан основной успешный путь. Возможные отказы мы разберём отдельно: текст может быть слишком коротким, проект закрытым, а заявка повторной. Основная последовательность остаётся опорой, относительно которой удобно объяснять такие ветви.\n\nСравним старый и новый процесс по моменту передачи ответственности. Раньше Анна отвечала за отправку сообщения, а Ирина — за последующий перенос. Между ними не было общего наблюдаемого события. Теперь система подтверждает регистрацию, и обе стороны обращаются к одной записи. Это не обещание мгновенного решения преподавателя. Автоматизация берёт на себя учёт, а содержательное рассмотрение остаётся действием человека. Такое разделение позволяет ожиданиям совпасть.\n\nЕсли Анна не увидела результат, нужно выяснить, какое событие уже произошло. До отправки есть только заполненная форма. После сохранения существует заявка. После решения существует итог. Мы не называем эти моменты одним словом «готово». Эта точность пригодится всем следующим представлениям: текстам кнопок, полям данных и результатам обмена. Сейчас она проверяется обычным чтением процесса, без технической настройки и без предположения о выбранном языке программирования.","hint":"Покажите, где впервые возникает запись заявки. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-19","catalog":"Свободная схема","title":"Предлагаемый процесс","kind":"visual","data":{"visual":{"type":"process","items":[{"title":"Анна выбирает проект","text":"Открывает карточку и заполняет мотивацию"},{"title":"Система сохраняет заявку","text":"Показывает Анне состояние «На рассмотрении»"},{"title":"Ирина рассматривает обращение","text":"Открывает список собственного проекта"},{"title":"Система сохраняет решение","text":"Показывает Анне «Одобрена» или «Отклонена»"}]},"note":"Порядок подсветки служит объяснению; он не изображает выполнение системы."},"scenarios":[{"label":"Разбор материала","input":"Сохранённая заявка связывает подачу и решение","frames":[{"caption":"Обзор: все элементы и подписи доступны до начала показа.","focus":[],"result":""},{"caption":"Анна выбирает проект: Открывает карточку и заполняет мотивацию","focus":["p0"],"result":""},{"caption":"Система сохраняет заявку: Показывает Анне состояние «На рассмотрении»","focus":["p1"],"result":""},{"caption":"Ирина рассматривает обращение: Открывает список собственного проекта","focus":["p2"],"result":""},{"caption":"Система сохраняет решение: Показывает Анне «Одобрена» или «Отклонена»","focus":["p3"],"result":""},{"caption":"Сопоставьте все элементы и сформулируйте вывод.","focus":[],"result":"Сохранённая заявка связывает подачу и решение"}]}],"structural":true},"question":3,"id":"З1-С19","number":27,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":153,"startSeconds":2120,"transition":"","script":"В предлагаемом процессе исчезает ручная регистрация сообщения. После заполнения формы система проверяет правила и сохраняет заявку. Именно сохранение позволяет обеим сторонам работать с одним обращением. Преподаватель не создаёт вторую копию мотивационного текста, а открывает уже существующую заявку. Решение меняет её состояние. Студент затем получает актуальные сведения в своём разделе. Для этого не требуется, чтобы два участника одновременно находились на сайте.\n\nПрочитаем последовательность на схеме. Первый блок обозначен «Анна выбирает проект». Открывает карточку и заполняет мотивацию. Второй блок обозначен «Система сохраняет заявку». Показывает Анне состояние «На рассмотрении». Третий блок обозначен «Ирина рассматривает обращение». Открывает список собственного проекта. Четвёртый блок обозначен «Система сохраняет решение». Показывает Анне «Одобрена» или «Отклонена».\n\nНа схеме показан основной успешный путь. Возможные отказы мы разберём отдельно: текст может быть слишком коротким, проект закрытым, а заявка повторной. Основная последовательность остаётся опорой, относительно которой удобно объяснять такие ветви.\n\nСравним старый и новый процесс по моменту передачи ответственности. Раньше Анна отвечала за отправку сообщения, а Ирина — за последующий перенос. Между ними не было общего наблюдаемого события. Теперь система подтверждает регистрацию, и обе стороны обращаются к одной записи. Это не обещание мгновенного решения преподавателя. Автоматизация берёт на себя учёт, а содержательное рассмотрение остаётся действием человека. Такое разделение позволяет ожиданиям совпасть.\n\nЕсли Анна не увидела результат, нужно выяснить, какое событие уже произошло. До отправки есть только заполненная форма. После сохранения существует заявка. После решения существует итог. Мы не называем эти моменты одним словом «готово». Эта точность пригодится всем следующим представлениям: текстам кнопок, полям данных и результатам обмена. Сейчас она проверяется обычным чтением процесса, без технической настройки и без предположения о выбранном языке программирования.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Анна выбирает проект: Открывает карточку и заполняет мотивацию. 2. Система сохраняет заявку: Показывает Анне состояние «На рассмотрении». 3. Ирина рассматривает обращение: Открывает список собственного проекта. 4. Система сохраняет решение: Показывает Анне «Одобрена» или «Отклонена».","wordCount":260,"pauseSeconds":8,"estimatedSeconds":150,"requiredWpm":108,"links":"webinar-1, Границы и процессы; учебные правила проекта"},{"title":"Чтение модели процесса","body":"Порядок действий, исполнитель и наблюдаемый результат","visual":{"type":"table","columns":["Элемент модели","Как читаем","Пример"],"rows":[["Шаг","Кто выполняет действие","Система сохраняет заявку"],["Порядок","Что должно произойти раньше","Сохранение перед подтверждением"],["Результат","Что изменилось после шага","Заявка видна Анне"],["Исключение","Когда путь прерывается","Проект закрыт"]],"caption":""},"speech":"Модель полезна, когда разные читатели одинаково понимают изображённое. Для каждого шага называем исполнителя, действие и результат. Затем проверяем порядок: нельзя честно подтвердить сохранение раньше, чем оно завершилось. Отдельно отмечаем условия, при которых основной путь не продолжается. Если модель показывает только слова «заявка» и «решение» без действий, она описывает понятия, но ещё не объясняет процесс. При чтении мы связываем каждый элемент с конкретным событием.","explanation":"Схема устройства отвечает на другой вопрос: из каких частей состоит приложение. На ней браузер и база могут находиться рядом, но это не означает их прямое взаимодействие. Поэтому всегда сначала устанавливаем назначение модели. Так можно избежать ошибочных выводов из внешне похожих прямоугольников и линий.","hint":"Сопоставьте модель процесса с контекстной схемой.","sources":[],"question":3,"id":"З1-С20","number":28,"blockTitle":"Границы и процессы","blockIndex":2,"plannedSeconds":109,"startSeconds":2273,"transition":"Следующий вопрос — требования и приёмка. Согласованное описание необходимого поведения или свойства.","script":"Модель полезна, когда разные читатели одинаково понимают изображённое. Для каждого шага называем исполнителя, действие и результат. Затем проверяем порядок: нельзя честно подтвердить сохранение раньше, чем оно завершилось. Отдельно отмечаем условия, при которых основной путь не продолжается. Если модель показывает только слова «заявка» и «решение» без действий, она описывает понятия, но ещё не объясняет процесс. При чтении мы связываем каждый элемент с конкретным событием.\n\nСопоставим записи в таблице. В строке 1 элемент модели: Шаг. как читаем: Кто выполняет действие. пример: Система сохраняет заявку. В строке 2 элемент модели: Порядок. как читаем: Что должно произойти раньше. пример: Сохранение перед подтверждением. В строке 3 элемент модели: Результат. как читаем: Что изменилось после шага. пример: Заявка видна Анне. В строке 4 элемент модели: Исключение. как читаем: Когда путь прерывается. пример: Проект закрыт.\n\nСхема устройства отвечает на другой вопрос: из каких частей состоит приложение. На ней браузер и база могут находиться рядом, но это не означает их прямое взаимодействие. Поэтому всегда сначала устанавливаем назначение модели. Так можно избежать ошибочных выводов из внешне похожих прямоугольников и линий.\n\nСледующий вопрос — требования и приёмка. Согласованное описание необходимого поведения или свойства.","visualDescription":"Таблица. Столбцы: Элемент модели; Как читаем; Пример. Строка 1: Шаг; Кто выполняет действие; Система сохраняет заявку. Строка 2: Порядок; Что должно произойти раньше; Сохранение перед подтверждением. Строка 3: Результат; Что изменилось после шага; Заявка видна Анне. Строка 4: Исключение; Когда путь прерывается; Проект закрыт.","wordCount":182,"pauseSeconds":8,"estimatedSeconds":107,"requiredWpm":108,"links":"webinar-1, Границы и процессы; учебные правила проекта"},{"supplemental":true,"question":3,"blockIndex":2,"blockTitle":"Границы и процессы","sources":[],"notebook":"","links":"webinar-1, Границы и процессы; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":29,"id":"З1-П3","title":"Практика: Граница системы","kind":"practice","visual":{"type":"practice"},"speech":"Применим понятия вопроса к новому учебному случаю. Учебный случай: библиотечный сервис получает заказ читателя и решение библиотекаря. Сначала запишите прогноз. Затем последовательно исследуйте факты: Читатель выбирает издание. Библиотекарь подтверждает выдачу. Каталог хранится внутри сервиса. Выберите решение и объясните его. Обоснованный вывод: Читатель и библиотекарь. Читатель и библиотекарь взаимодействуют с сервисом извне. Таблица и обработчик находятся внутри принятой границы. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","script":"Применим понятия вопроса к новому учебному случаю. Учебный случай: библиотечный сервис получает заказ читателя и решение библиотекаря. Сначала запишите прогноз. Затем последовательно исследуйте факты: Читатель выбирает издание. Библиотекарь подтверждает выдачу. Каталог хранится внутри сервиса. Выберите решение и объясните его. Обоснованный вывод: Читатель и библиотекарь. Читатель и библиотекарь взаимодействуют с сервисом извне. Таблица и обработчик находятся внутри принятой границы. Сравните свой прогноз с наблюдениями; если он изменился, сформулируйте причину. Это самостоятельный разбор, его результат не добавляется к баллам самопроверки.","hint":"Откройте дополнение в новой вкладке. Сначала запишите прогноз; затем исследуйте факты и обоснуйте решение.","visualDescription":"Учебный случай: библиотечный сервис получает заказ читателя и решение библиотекаря. Читатель выбирает издание. Библиотекарь подтверждает выдачу. Каталог хранится внутри сервиса.","wordCount":78,"estimatedSeconds":63,"activity":{"id":"З1-П3","revision":1,"title":"Граница системы","task":"Учебный случай: библиотечный сервис получает заказ читателя и решение библиотекаря.","facts":["Читатель выбирает издание.","Библиотекарь подтверждает выдачу.","Каталог хранится внутри сервиса."],"decision":"Что находится за внешней границей сервиса?","options":["Таблица заказов","Читатель и библиотекарь","Внутренний обработчик"],"answer":1,"explanation":"Читатель и библиотекарь взаимодействуют с сервисом извне. Таблица и обработчик находятся внутри принятой границы.","check":"Сопоставьте каждый факт с правилом. Обоснуйте, почему остальные решения не подходят."},"plannedSeconds":0,"startSeconds":2382,"requiredWpm":0},{"supplemental":true,"question":3,"blockIndex":2,"blockTitle":"Границы и процессы","sources":[],"notebook":"","links":"webinar-1, Границы и процессы; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":30,"id":"З1-Т3","title":"Самопроверка · Вопрос 3","kind":"quiz","visual":{"type":"quiz"},"speech":"Проверим понимание вопроса. Какое отношение корректно для контекстной схемы? Варианты: Студент → сервис: подача заявки; База → студент: право одобрить чужой проект; Сервис → внутренняя таблица: часть внешнего окружения. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Студент → сервис: подача заявки. Контекст связывает внешнего участника с системой и подписывает обмен или воздействие. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","script":"Проверим понимание вопроса. Какое отношение корректно для контекстной схемы? Варианты: Студент → сервис: подача заявки; База → студент: право одобрить чужой проект; Сервис → внутренняя таблица: часть внешнего окружения. Прежде чем открыть ответ, предложите обоснование выбранного решения. Правильный вариант: Студент → сервис: подача заявки. Контекст связывает внешнего участника с системой и подписывает обмен или воздействие. Обсудите, какое условие пришлось бы изменить, чтобы другой ответ стал допустимым.","hint":"Дайте аудитории выбрать вариант. Ответ и разбор показывайте отдельной командой.","visualDescription":"Какое отношение корректно для контекстной схемы? Студент → сервис: подача заявки; База → студент: право одобрить чужой проект; Сервис → внутренняя таблица: часть внешнего окружения","wordCount":66,"estimatedSeconds":56,"quiz":{"id":"З1-Т3","revision":1,"prompt":"Какое отношение корректно для контекстной схемы?","options":["Студент → сервис: подача заявки","База → студент: право одобрить чужой проект","Сервис → внутренняя таблица: часть внешнего окружения"],"answer":0,"explanation":"Контекст связывает внешнего участника с системой и подписывает обмен или воздействие."},"plannedSeconds":0,"startSeconds":2382,"requiredWpm":0},{"title":"Требования и приёмка","body":"Согласованное описание необходимого поведения или свойства","visual":{"type":"section","number":4,"title":"Требования и приёмка"},"speech":"Переходим к вопросу 4: требования и приёмка. Согласованное описание необходимого поведения или свойства. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.","explanation":"","hint":"Назовите вопрос. Затем перейдите к следующему слайду с подробной схемой и готовым разбором.","sources":[],"kind":"section","question":4,"id":"З1-С21","number":31,"blockTitle":"Требования и приёмка","blockIndex":3,"plannedSeconds":28,"startSeconds":2382,"transition":"","script":"Переходим к вопросу 4: требования и приёмка. Согласованное описание необходимого поведения или свойства. Здесь важно связать рассматриваемое решение с конкретным действием Анны или Ирины. Сначала обозначим исходные условия, затем прочитаем подготовленный пример и объясним результат.\n\n\n\n\n\n","visualDescription":"Разделитель. Вопрос 4: Требования и приёмка. Справа большая серая стрелка, направленная влево.","wordCount":35,"pauseSeconds":8,"estimatedSeconds":27,"requiredWpm":105,"links":"webinar-1, Требования и приёмка; учебные правила проекта"},{"title":"Источники требований","body":"Высказывание подтверждают наблюдением и примером","visual":{"type":"pair","items":[{"title":"Требование к системе","visual":{"type":"process","items":[{"title":"Потребность","text":"Анна хочет убедиться, что обращение принято"},{"title":"Требование","text":"Система сохраняет заявку и показывает её студенту"},{"title":"Проверка","text":"После подачи в своих заявках видна нужная запись"}]}},{"title":"Источники требований","visual":{"type":"table","columns":["Источник","Что узнаём","Ограничение"],"rows":[["Разговор с Анной","Она не видит подтверждение","Нужен конкретный случай"],["Рабочая таблица Ирины","Как учитывают обращения","Таблица может быть неполной"],["Наблюдение процесса","Где переносят сведения","Один случай не описывает все ситуации"]],"caption":""}}]},"speech":"Требование фиксирует, что система должна делать или каким свойством обладать. Оно появляется из потребности, но формулируется достаточно точно для проектирования и проверки. Фраза «заявки не должны теряться» задаёт направление, однако оставляет открытым момент регистрации. Мы уточняем действие системы и видимый результат. Требование не обязано сразу описывать таблицу базы или конкретную библиотеку. Такие детали выбирают на основе задачи и ограничений.\n\nПредставим, что разработчик сохранил сведения, но не показал их Анне. Одна часть потребности выполнена, другая остаётся нерешённой. Поэтому состав требования нужно читать полностью. Удобно отделять обязательное поведение от способа реализации, чтобы техническая замена не разрушала смысл договорённости.\n\nИсточником требования может быть разговор, документ или наблюдение за работой. Каждый источник показывает свою часть задачи. Анна хорошо описывает затруднение с подтверждением, но не обязана знать, как преподаватель ведёт список. Таблица показывает поля, однако не всегда объясняет их смысл. Поэтому важные сведения сопоставляют. Если в разговоре звучит запрет нескольких проектов, а текущие правила их разрешают, противоречие необходимо разрешить до реализации.","explanation":"Для учебного курса согласованный промпт служит источником правил «Проектного навигатора». В реальном проекте понадобится зафиксировать, кто утвердил спорное решение и на каких данных оно основано. Номер требования позволит связать последующие экраны и проверки с этой договорённостью.\n\nИсточники помогают отличать установленное правило от единичной привычки. Если один преподаватель ведёт свою таблицу по фамилиям, это ещё не означает, что ключ будущей системы должен быть фамилией. Если студент просит «быструю подачу», нужно выяснить, что именно занимает время: поиск темы, повторный ввод или ожидание ответа. Прямое копирование слов в техническое требование часто сохраняет исходную неопределённость. Анализ раскрывает смысл и проверяемую ситуацию.\n\nВ учебном разборе мы используем заранее согласованные сведения и не изображаем проведённое исследование. Это ограничение не мешает показать метод. Для каждого высказывания можно установить предмет уточнения: наблюдение, ожидаемое изменение, границу доступа или условие приёмки. Если подтверждения пока нет, запись остаётся вопросом, а не незаметно утверждённой функцией. Такой статус особенно важен для пожеланий о файлах, чате и интеллектуальном поиске.","hint":"Подчеркните связь между потребностью и проверяемым поведением. Не представляйте учебную ситуацию как проведённое интервью. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-22","catalog":"Свободная схема","title":"Источники требований","kind":"visual","data":{"visual":{"type":"pair" оказывает обращения и сохраняет решение. Для удобства назначим требованиям обозначения. Буквы ФТ означают «функциональное требование», число отличает одну запись от другой. Нумерация не означает важность. Она помогает сослаться на конкретное поведение при обсуждении макета, серверного обработчика или проверки.","explanation":"Строки на экране пока являются краткими названиями. У полного требования будут условия и признаки выполнения. Например, ФТ-03 должно учитывать принадлежность проекта преподавателю. Без этого уточнения «просмотр заявок» легко превратится в доступ ко всем обращениям, хотя такого права мы не согласовывали.","hint":"Расшифруйте ФТ перед первым чтением кода.","sources":[],"notebook":"Функциональное требование — описание действия или поведения, которое должна поддерживать система.","question":4,"id":"З1-С23","number":33,"blockTitle":"Требования и приёмка","blockIndex":3,"plannedSeconds":86,"startSeconds":2651,"transition":"","script":"Функциональное требование описывает действие или результат работы системы. В нашем примере система получает каталог, принимает заявку, показывает обращения и сохраняет решение. Для удобства назначим требованиям обозначения. Буквы ФТ означают «функциональное требование», число отличает одну запись от другой. Нумерация не означает важность. Она помогает сослаться на конкретное поведение при обсуждении макета, серверного обработчика или проверки.\n\nСопоставим записи в таблице. В строке 1 код: ФТ-01. поведение: Сохранение и показ своей заявки. В строке 2 код: ФТ-02. поведение: Каталог и карточка проекта. В строке 3 код: ФТ-03. поведение: Просмотр заявок собственного проекта. В строке 4 код: ФТ-04. поведение: Однократное итоговое решение преподавателя.\n\nСтроки на экране пока являются краткими названиями. У полного требования будут условия и признаки выполнения. Например, ФТ-03 должно учитывать принадлежность проекта преподавателю. Без этого уточнения «просмотр заявок» легко превратится в доступ ко всем обращениям, хотя такого права мы не согласовывали.\n\n","visualDescription":"Таблица. Столбцы: Код; Поведение. Строка 1: ФТ-01; Сохранение и показ своей заявки. Строка 2: ФТ-02; Каталог и карточка проекта. Строка 3: ФТ-03; Просмотр заявок собственного проекта. Строка 4: ФТ-04; Однократное итоговое решение преподавателя.","wordCount":139,"pauseSeconds":8,"estimatedSeconds":84,"requiredWpm":107,"links":"webinar-1, Требования и приёмка; учебные правила проекта"},{"title":"Требования к качеству","body":"Как оценивают выполнение полезного действия","visual":{"type":"table","columns":["Область","Условие","Признак"],"rows":[["Доступность формы","Работа с клавиатурой","Доступны поле и кнопка, виден фокус"],["Понятность","Текст короче минимума","Названы граница и способ исправления"],["Надёжность учёта","Повторная отправка","Вторая заявка не создаётся"]],"caption":""},"speech":"Кроме набора функций важны свойства их выполнения. Форма может существовать, но быть недоступной с клавиатуры. Сообщение об ошибке может появляться, но не объяснять, что исправить. Требования к качеству уточняют, каким должен быть результат в заданных условиях. Некоторые свойства пересекаются с правилами поведения. Это допустимо, если их смысл и способ проверки ясны. Не нужно спорить о категории ценой потери существенного ограничения.","explanation":"Здесь мы не обещаем конкретную скорость загрузки без условий измерения. Для такого требования понадобятся объём данных, нагрузка и граница времени. На четвёртом занятии появится подготовленный пример измерений. Сейчас важно увидеть разницу между наличием функции и пригодностью её выполнения для пользователя.","hint":"Не добавляйте вымышленные показатели доступности сервиса.","sources":[],"notebook":"Требование к качеству — требование к свойству системы с заданными условиями его оценки.","question":4,"id":"З1-С24","number":34,"blockTitle":"Требования и приёмка","blockIndex":3,"plannedSeconds":92,"startSeconds":2737,"transition":"","script":"Кроме набора функций важны свойства их выполнения. Форма может существовать, но быть недоступной с клавиатуры. Сообщение об ошибке может появляться, но не объяснять, что исправить. Требования к качеству уточняют, каким должен быть результат в заданных условиях. Некоторые свойства пересекаются с правилами поведения. Это допустимо, если их смысл и способ проверки ясны. Не нужно спорить о категории ценой потери существенного ограничения.\n\nСопоставим записи в таблице. В строке 1 область: Доступность формы. условие: Работа с клавиатурой. признак: Доступны поле и кнопка, виден фокус. В строке 2 область: Понятность. условие: Текст короче минимума. признак: Названы граница и способ исправления. В строке 3 область: Надёжность учёта. условие: Повторная отправка. признак: Вторая заявка не создаётся.\n\nЗдесь мы не обещаем конкретную скорость загрузки без условий измерения. Для такого требования понадобятся объём данных, нагрузка и граница времени. На четвёртом занятии появится подготовленный пример измерений. Сейчас важно увидеть разницу между наличием функции и пригодностью её выполнения для пользователя.\n\n","visualDescription":"Таблица. Столбцы: Область; Условие; Признак. Строка 1: Доступность формы; Работа с клавиатурой; Доступны поле и кнопка, виден фокус. Строка 2: Понятность; Текст короче минимума; Названы граница и способ исправления. Строка 3: Надёжность учёта; Повторная отправка; Вторая заявка не создаётся.","wordCount":150,"pauseSeconds":8,"estimatedSeconds":90,"requiredWpm":107,"links":"webinar-1, Требования и приёмка; учебные правила проекта"},{"title":"Измеримость требования","body":"Условия и результат позволяют проверить договорённость","visual":{"type":"table","columns":["Расплывчато","Проверяемо"],"rows":[["Форма должна быть удобной","Поле подписано, ограничение видно до отправки"],["Заявка отправляется быстро","Время измеряют для указанной нагрузки и объёма данных"],["Статус всегда понятен","В списке показан один из трёх согласованных статусов"]],"caption":""},"speech":"Измеримость означает возможность определить, выполнено ли требование. Это не обязательно число. Наличие подписи или конкретного статуса тоже проверяется наблюдением. Уточнение начинается с условий: кто действует, с какими данными и в каком состоянии системы. Затем описывается ожидаемый результат. Если требование использует слова «быстро» или «удобно», необходимо раскрыть их смысл для данного сценария. Иначе разные участники будут оценивать результат по разным основаниям.","explanation":"Пример со скоростью на экране специально оставляет числовую границу несогласованной. Мы показываем состав измеримого условия, а не выдаём случайное число за утверждённое требование. После измерений команда сможет обосновать целевой показатель и условия его проверки.\n\nУ измеримого требования есть ещё одна особенность: его можно одинаково прочитать спустя время. Фраза «сделать список современным» зависит от вкуса и даты. Формулировка «после успешной подачи показать выбранный проект и состояние обращения в разделе своих заявок» сохраняет смысл. Команда может изменить оформление и технологии, не теряя обязательного результата. Поэтому точность не означает избыточную техническую детализацию. Она означает ясное наблюдаемое свойство.\n\nСлишком жёсткая детализация тоже способна помешать. Если без причины требовать конкретный цвет каждого элемента, можно ограничить доступность или адаптацию. Сначала фиксируют, что человек должен различить и сделать. Затем выбирают оформление, которое поддерживает это. Исключение — согласованный фирменный шаблон, где визуальные параметры уже заданы. В нашем курсе такой шаблон определяет внешний стиль, а содержание схем и примеров следует правилам учебного проекта.","hint":"Различайте проверяемость наблюдением и числовое измерение.","sources":[],"question":4,"id":"З1-С25","number":35,"blockTitle":"Требования и приёмка","blockIndex":3,"plannedSeconds":155,"startSeconds":2829,"transition":"","script":"Измеримость означает возможность определить, выполнено ли требование. Это не обязательно число. Наличие подписи или конкретного статуса тоже проверяется наблюдением. Уточнение начинается с условий: кто действует, с какими данными и в каком состоянии системы. Затем описывается ожидаемый результат. Если требование использует слова «быстро» или «удобно», необходимо раскрыть их смысл для данного сценария. Иначе разные участники будут оценивать результат по разным основаниям.\n\nСопоставим записи в таблице. В строке 1 расплывчато: Форма должна быть удобной. проверяемо: Поле подписано, ограничение видно до отправки. В строке 2 расплывчато: Заявка отправляется быстро. проверяемо: Время измеряют для указанной нагрузки и объёма данных. В строке 3 расплывчато: Статус всегда понятен. проверяемо: В списке показан один из трёх согласованных статусов.\n\nПример со скоростью на экране специально оставляет числовую границу несогласованной. Мы показываем состав измеримого условия, а не выдаём случайное число за утверждённое требование. После измерений команда сможет обосновать целевой показатель и условия его проверки.\n\nУ измеримого требования есть ещё одна особенность: его можно одинаково прочитать спустя время. Фраза «сделать список современным» зависит от вкуса и даты. Формулировка «после успешной подачи показать выбранный проект и состояние обращения в разделе своих заявок» сохраняет смысл. Команда может изменить оформление и технологии, не теряя обязательного результата. Поэтому точность не означает избыточную техническую детализацию. Она означает ясное наблюдаемое свойство.\n\nСлишком жёсткая детализация тоже способна помешать. Если без причины требовать конкретный цвет каждого элемента, можно ограничить доступность или адаптацию. Сначала фиксируют, что человек должен различить и сделать. Затем выбирают оформление, которое поддерживает это. Исключение — согласованный фирменный шаблон, где визуальные параметры уже заданы. В нашем курсе такой шаблон определяет внешний стиль, а содержание схем и примеров следует правилам учебного проекта.\n\n","visualDescription":"Таблица. Столбцы: Расплывчато; Проверяемо. Строка 1: Форма должна быть удобной; Поле подписано, ограничение видно до отправки. Строка 2: Заявка отправляется быстро; Время измеряют для указанной нагрузки и объёма данных. Строка 3: Статус всегда понятен; В списке показан один из трёх согласованных статусов.","wordCount":264,"pauseSeconds":8,"estimatedSeconds":152,"requiredWpm":108,"links":"webinar-1, Требования и приёмка; учебные правила проекта"},{"title":"Разбор жалобы о потерянных заявках","body":"Наблюдение превращается в действие и подтверждение","visual":{"type":"process","items":[{"title":"Наблюдение","text":"Сообщение отправлено, строки в рабочем списке нет"},{"title":"Цель Анны","text":"Убедиться, что её обращение зарегистрировано"},{"title":"Цель Ирины","text":"Увидеть новое обращение в своём проекте"},{"title":"Решение","text":"Сохранить заявку и показать обеим сторонам допустимые сведения"}]},"speech":"Разберём жалобу «Нужно, чтобы заявки больше не терялись». Первым шагом уточняем наблюдение: отправленное обращение отсутствует в общем списке. Вторым выясняем, что Анна считает завершением подачи. Ей необходимо увидеть зарегистрированную заявку. Третьим учитываем преподавателя: Ирина должна получить запись для рассмотрения. Теперь можно описать действие системы. Она сохраняет заявку и предоставляет доступ по роли. Так из жалобы получается согласованное поведение.","explanation":"Здесь полезно проверить причинную связь. Простая надпись «Отправлено» не гарантирует сохранения. Сообщение преподавателю тоже не заменяет запись. Для приёмки нужен результат, который можно повторно получить из системы. Поэтому выбранный признак связан с разделом «Мои заявки», а не только с краткой плашкой после нажатия.","hint":"Пройдите четыре шага без предложения аудитории решить задачу. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"requirement","catalog":"REQ-01","title":"От жалобы к проверяемому требованию","kind":"cards","data":{"items":[{"title":"Наблюдение","text":"Сообщение отправлено, в общем списке заявки нет."},{"title":"Потребность","text":"Анна хочет подтвердить регистрацию; Ирина — увидеть обращение."},{"title":"ФТ-01","text":"Сохранить заявку и показать её Анне в «Моих заявках»."},{"title":"Приёмка","text":"Повторное чтение возвращает заявку 104, проект 17, pending."}]},"scenarios":[{"label":"Разбор требования","input":"Учебный случай: сообщение без общей записи.","frames":[{"caption":"Обзор: наблюдение, потребность, поведение и приёмка различаются.","focus":[],"result":""},{"caption":"Наблюдение описывает проблему, но ещё не задаёт решение.","focus":["0"],"result":""},{"caption":"Потребности обеих ролей объясняют цель изменения.","focus":["1"],"result":""},{"caption":"ФТ-01 задаёт наблюдаемое поведение системы.","focus":["2"],"result":""},{"caption":"Повторное чтение проверяет устойчивый результат, а не только надпись об успехе.","focus":["3"],"result":"Заявка 104 существует и доступна обеим ролям в пределах их прав."}]}],"structural":true},"question":4,"id":"З1-С26","number":36,"blockTitle":"Требования и приёмка","blockIndex":3,"plannedSeconds":97,"startSeconds":2984,"transition":"","script":"Разберём жалобу «Нужно, чтобы заявки больше не терялись». Первым шагом уточняем наблюдение: отправленное обращение отсутствует в общем списке. Вторым выясняем, что Анна считает завершением подачи. Ей необходимо увидеть зарегистрированную заявку. Третьим учитываем преподавателя: Ирина должна получить запись для рассмотрения. Теперь можно описать действие системы. Она сохраняет заявку и предоставляет доступ по роли. Так из жалобы получается согласованное поведение.\n\nНа схеме разберём исходные данные: Учебный случай: сообщение без общей записи. Обзор: наблюдение, потребность, поведение и приёмка различаются.  Наблюдение описывает проблему, но ещё не задаёт решение.  Потребности обеих ролей объясняют цель изменения.  ФТ-01 задаёт наблюдаемое поведение системы.  Повторное чтение проверяет устойчивый результат, а не только надпись об успехе. Заявка 104 существует и доступна обеим ролям в пределах их прав.\n\nЗдесь полезно проверить причинную связь. Простая надпись «Отправлено» не гарантирует сохранения. Сообщение преподавателю тоже не заменяет запись. Для приёмки нужен результат, который можно повторно получить из системы. Поэтому выбранный признак связан с разделом «Мои заявки», а не только с краткой плашкой после нажатия.\n\n","visualDescription":"Последовательность подписанных блоков. 1. Наблюдение: Сообщение отправлено, строки в рабочем списке нет. 2. Цель Анны: Убедиться, что её обращение зарегистрировано. 3. Цель Ирины: Увидеть новое обращение в своём проекте. 4. Решение: Сохранить заявку и показать обеим сторонам допустимые сведения.","wordCount":160,"pauseSeconds":8,"estimatedSeconds":95,"requiredWpm":108,"links":"webinar-1, Требования и приёмка; учебные правила проекта"},{"title":"Критерий приёмки ФТ-01","body":"После успешной подачи заявка видна в своём списке","visual":{"type":"table","columns":["Элемент","Заполненное описание"],"rows":[["Исходные условия","Анна вошла, проект 17 открыт, заявки ещё нет"],["Действие","Передан мотивационный текст допустимой длины"],["Результат","В «Моих заявках» виден проект 17 и «На рассмотрении»"],["Обозначение","ФТ-01: сохранение и отображение своей заявки"]],"caption":""},"speech":"Критерий приёмки задаёт признак, по которому принимают результат работы. В нашем случае недостаточно увидеть новую строку где угодно. Она должна относиться к Анне, указывать выбранный проект и содержать начальное состояние. Условие отсутствия предыдущей заявки тоже важно: иначе мы случайно проверим повторную подачу. Вход в систему принимаем действующим. Длина мотивации находится между пятьюдесятью и тысячей символов включительно.","explanation":"Успешность в этом примере означает сохранение обращения, а не одобрение участия. Решение преподавателя будет отдельным действием. Такое разделение помогает и при разработке, и при последующей проверке: можно точно указать, какая часть сценария дала неправильный результат.\n\nПройдём критерий приёмки в виде готового наблюдения. До действия в собственном списке нет заявки Анны на проект семнадцать. После допустимой подачи появляется одна запись с этим проектом и надписью «На рассмотрении». Если запись появилась только в чужом кабинете, условие не выполнено. Если вместо ожидания указано «Одобрена», система преждевременно приняла решение. Если запись исчезает после повторного открытия раздела, подтверждение не опиралось на устойчивый результат. Один критерий позволяет назвать несколько разных несоответствий.\n\nОднако критерий не должен обещать того, что не согласовано. Мы не требуем немедленного письма Ирине на первом занятии, потому что уведомление вводится позже как расширение. Не проверяем наличие вложения, потому что его нет в версии. Такое ограничение делает приёмку честной и обозримой. Дополнительные желания сначала проходят оценку влияния, а затем получают собственные условия и признаки результата.","hint":"Читайте исходные условия перед ожидаемым результатом.","sources":[],"notebook":"Критерий приёмки — проверяемое условие, по которому принимают конкретный результат.","question":4,"id":"З1-С27","number":37,"blockTitle":"Требования и приёмка","blockIndex":3,"plannedSeconds":163,"startSeconds":3081,"transition":"","script":"Критерий приёмки задаёт признак, по которому принимают результат работы. В нашем случае недостаточно увидеть новую строку где угодно. Она должна относиться к Анне, указывать выбранный проект и содержать начальное состояние. Условие отсутствия предыдущей заявки тоже важно: иначе мы случайно проверим повторную подачу. Вход в систему принимаем действующим. Длина мотивации находится между пятьюдесятью и тысячей символов включительно.\n\nСопоставим записи в таблице. В строке 1 элемент: Исходные условия. заполненное описан ловарь трёх состояний появится в блоке о данных.\n\nСопоставим записи в таблице. В строке 1 код: ФТ-01. условие: Корректная первая подача. признак выполнения: Своя заявка со статусом pending. В строке 2 код: ПР-01. условие: Повтор той же пары. признак выполнения: Вторая запись отсутствует. В строке 3 код: ПР-02. условие: Длина мотивации. признак выполнения: Допустимо 50–1000 символов. В строке 4 код: ПР-03. условие: Решение преподавателя. признак выполнения: Только свой проект, исходный статус pending.\n\nРеестр не должен превращаться в перечень несвязанных обещаний. Для каждой строки известен сценарий применения и признак выполнения. Если на следующем занятии макет позволит отправить десять символов без ошибки, мы сможем сослаться на ПР-02. Обозначение делает замечание адресным и облегчает исправление всех связанных материалов.\n\nСледующий вопрос — сценарии, права и состояния. Предусловия, действие и сохранённый результат.","visualDescription":"Таблица. Столбцы: Код; Условие; Признак выполнения. Строка 1: ФТ-01; Корректная первая подача; Своя заявка со статусом pending. Строка 2: ПР-01; Повтор той же пары; Вторая запись отсутствует. Строка 3: ПР-02; Длина мотивации; Допустимо 50–1000 символов. Строка 4: ПР-03; Решение преподавателя; Только свой проект, исходный статус pending.","wordCount":171,"pauseSeconds":8,"estimatedSeconds":101,"requiredWpm":108,"links":"webinar-1, Требования и приёмка; учебные правила проекта"},{"supplemental":true,"question":4,"blockIndex":3,"blockTitle":"Требования и приёмка","sources":[],"notebook":"","links":"webinar-1, Требования и приёмка; учебные правила проекта","pauseSeconds":20,"explanation":"","transition":"","body":"","number":39,"id":"З1-П4","title":"Практика: Проверяемая приёмка","kind":"practice","visual":{"type":"practice"},"speech":"Применим понятия вопроса к новому учебному случаю. Учебный случай: требование — заказ 208 доступен автору после повторного входа. Сначала запишите прогноз. Затем последовательно исследуйте факты: le":"Приём","text":"Система проверяет условия и сохраняет заявку"},{"title":"Завершение","text":"В своих заявках Анна видит «На рассмотрении»"}]}},{"title":"Альтернативные ситуации","visual":{"type":"table","columns":["Условие","Поведение системы","Что видит Анна"],"rows":[["49 символов","Отказ в создании","Уточнение минимальной длины"],["Заявка уже существует","Новой записи нет","Сообщение и переход к своей заявке"],["Проект закрыт","Новая подача запрещена","Объяснение закрытого набора"],["Ответ не получен","Результат ещё не подтверждён","Сохранённый текст и повторная проверка"]],"caption":""}}]},"speech":"Сценарий описывает последовательность взаимодействия для достижения цели. Начинаем с предусловий, то есть сведений, которые должны быть верны до начала действия. Затем Анна заполняет форму. Система проверяет значения и правила, после чего сохраняет запись. Завершение мы определяем по доступному результату: заявка видна в своём списке. Это основной путь, в котором все условия выполнены. Он станет опорой для макетов и серверной обработки.\n\nВ сценарии есть действия пользователя и действия системы. Их нельзя смешивать. Анна вводит мотивацию, но не назначает себе номер заявки и итоговый статус. Система создаёт эти сведения по правилам. Такое разделение сразу помогает определить, какие поля нужны в форме, а какие должны появиться только после обработки.\n\nАльтернативная ситуация появляется, когда условие основного пути не выполнено или результат нельзя подтвердить. Для каждой ситуации нужно описать поведение системы и понятную обратную связь. Слишком короткий текст можно исправить. Повторную заявку исправлять увеличением текста бессмысленно: нужно открыть существующую. Закрытый проект требует объяснения другого ограничения. Обрыв связи отличается от этих отказов: он может произойти после сохранения.","explanation":"Поэтому одно универсальное сообщение «Произошла ошибка» не подходит всем случаям. Оно скрывает дальнейшее действие пользователя. Мы заранее проектируем различия, чтобы интерфейс и сервер возвращали согласованный смысл. На следующих занятиях каждое сообщение получит свой макет и пример результата обработки.\n\nАльтернативные ветви полезно сравнивать по тому, что пользователь может исправить. При коротком тексте Анна меняет содержимое поля. При закрытом проекте увеличение текста бессмысленно: нужно вернуться к выбору. При уже существующей заявке правильнее открыть её. При неизвестном результате связи сначала восстанавливают сведения. Поэтому кнопка «Повторить» не является универсальным ответом на все отклонения. Её смысл зависит от того, что известно системе.\n\nТакое различие позволяет не превращать любой отказ в тупик. Система может сохранить полезный ввод и объяснить дальнейшее действие, оставаясь в рамках правил. Но она не должна обещать создание там, где запись запрещена. На следующем уровне проектирования эти ветви станут разными состояниями формы. Сейчас мы формулируем их назначение обычными словами, чтобы позднее технические коды не подменили смысл пользовательской ситуации.","hint":"Отмечайте смену исполнителя между шагами. Отдельно остановитесь на неопределённом результате связи. Разверните схему. Начните с обзора; последовательно нажимайте «Далее». Прочитайте исходные данные и итог. «Назад» восстанавливает снимок; автоматического запуска нет.","sources":[],"learning":{"id":"explain-1-30","catalog":"Свободная схема","title":"Альтернативные ситуации","kind":"visual","data":{"visual":{"type":"pair","items":[{"title":"Основной сценарий подачи","visual":{"type":"process","items":[{"title":"Предусловия","text":"Анна вошла, проект открыт, предыдущей заявки нет"},{"title":"Заполнение","text":"Анна вводит мотивацию длиной 50–1000 символов"},{"title":"Приём","text":"Система проверяет условия и сохраняет заявку"},{"title":"Завершение","text":"В своих заявках Анна видит «На рассмотрении»"}]}},{"title":"Альтернативные ситуации","visual":{"type":"table","columns":["Условие","Поведение системы","Что видит Анна"],"rows":[[
